<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Space</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:crosshair;user-select:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hotbar{position:fixed;pointer-events:none}      /* placed in whole device pixels by layoutHotbar() */
  .slot{position:absolute;display:block;image-rendering:pixelated;opacity:.55;transition:opacity .12s}
  .slot.sel{opacity:1;filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
  /* UI is intentionally neutral (no colour theme) */
  #loader{position:fixed;inset:0;background:#000 center/cover no-repeat;image-rendering:pixelated;
          transition:opacity .8s;z-index:10;display:flex;align-items:flex-end;justify-content:center}
  #loader.gone{opacity:0;pointer-events:none}
  #loader span{font:14px/1 monospace;color:#ddd;letter-spacing:.3em;margin-bottom:90px;
               background:rgba(0,0,0,.55);padding:8px 14px}
  #menu{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;
        background:#000 center/cover no-repeat;image-rendering:pixelated;cursor:default;
        font:13px/1.4 monospace;color:#ddd;letter-spacing:.06em}
  #menu.on{display:flex}
  #menu .panel{background:rgba(0,0,0,.82);border:1px solid #555;
        padding:10px 20px 14px;width:min(420px,92vw);image-rendering:auto}
  #menu .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;
        border-bottom:1px solid rgba(255,255,255,.12)}
  #menu select{font:inherit;color:#eee;background:#111;border:1px solid #666;padding:4px 6px;max-width:60%}
  #menu input[type=checkbox]{accent-color:#bbb;width:16px;height:16px}
  #menu input[type=range]{accent-color:#bbb;width:150px}
  #menu .sl{display:flex;align-items:center;gap:10px}
  #menu .sl b{font-weight:normal;min-width:44px;text-align:right}
  #menu .hint{padding-top:12px;text-align:center;opacity:.6}
  #dbg{position:fixed;left:10px;top:10px;z-index:12;display:none;width:250px;padding:10px 12px;
       background:rgba(0,0,0,.8);border:1px solid #555;font:12px/1.5 monospace;color:#ddd;cursor:default}
  #dbg.on{display:block}
  #dbg b{color:#fff;letter-spacing:.2em}
  #dbg label{display:flex;align-items:center;gap:8px;margin:6px 0}
  #dbg input[type=checkbox]{accent-color:#bbb}
  #dbg input[type=range]{accent-color:#bbb;flex:1}
  #dbg button{font:inherit;color:#eee;background:#111;border:1px solid #666;padding:2px 8px;cursor:pointer}
  #dbg button:hover{background:#2a2a2a}
  #dbg pre{margin:8px 0 0;white-space:pre-wrap;color:#aaa;font-size:11px}
  #dbg .hint{opacity:.6;font-size:11px;margin-top:6px}
  #busy{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;
        background:#000 center/cover no-repeat;image-rendering:pixelated;cursor:default;
        font:14px/1 monospace;color:#ddd;letter-spacing:.3em}
  #busy.on{display:flex}
  #busy span{background:rgba(0,0,0,.65);padding:8px 14px;text-align:center}
  #busy button{font:inherit;letter-spacing:.3em;color:#000;background:#ddd;border:0;padding:11px 20px;cursor:pointer}
  #busy button:hover{background:#fff}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hotbar"></div>
<div id="loader"><span id="ltext">LOADING</span></div>
<div id="dbg">
  <b>DEBUG</b>
  <label><input type="checkbox" id="dfly"> Fly (no clip) — Space up, C down, Shift fast</label>
  <label><input type="checkbox" id="dstam"> Infinite stamina</label>
  <div>Teleport: <button data-area="matrix">Matrix</button> <button data-area="mausoleum">Mausoleum</button></div>
  <label>Time <input type="range" id="dtime" min="-1" max="1" step="0.01" value="0"><span id="dtimev">1.00×</span></label>
  <button id="dtime1">reset time</button>
  <pre id="dinfo"></pre>
  <div class="hint">type 1337dbg again to close · Esc frees the mouse</div>
</div>
<div id="menu"><div class="panel">
  <label class="row"><span>3D</span>
    <select id="m3d">
      <option value="off">Disabled</option>
      <option value="anaglyph">3D Anaglyph</option>
      <option value="sbs">SideBySide 3D</option>
      <option value="sbsFlat">SideBySide NoWarp</option>
      <option value="sbsStereo">SideBySide Stereo</option>
    </select></label>
  <label class="row"><span>Invert 3D</span><input type="checkbox" id="minv"></label>
  <div class="row"><span id="mdata">Data storage: OK</span></div>
  <label class="row"><span>Mouse sensitivity</span>
    <span class="sl"><input type="range" id="msens" min="10" max="300" step="5"><b id="msensv">100%</b></span></label>
  <div class="hint">Press tab to close this menu</div>
</div></div>
<div id="busy"><span id="btext">ALREADY RUNNING IN ANOTHER TAB</span><button id="bgo">PLAY HERE</button></div>

<script>
(() => {
"use strict";

/* ================= single instance: only one tab at a time =================
   Uses the Web Locks API (the browser frees the lock by itself if a tab
   closes or crashes). A second tab shows "ALREADY RUNNING IN ANOTHER TAB"
   and does nothing — no render, no audio, no saving. "PLAY HERE" moves the
   game to that tab: the old tab saves, stops, hands its exact state over
   (BroadcastChannel keeps float64 exact) and releases the lock. If the old
   tab doesn't answer within 1.5 s, the lock is taken by force and the old
   tab stops WITHOUT saving, so it can't overwrite the newer position.
   Fallback without Web Locks: a BroadcastChannel ping/pong check. */
const LOCK = "mx3d_instance", CLAIM_FLAG = "mx3d_claim";
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(LOCK) : null;
const hasLocks = !!(navigator.locks && navigator.locks.request);
const busy = document.getElementById("busy"), busyText = document.getElementById("btext");
let app = null, booted = false, releaseLock = null;
let handoff = null, waitingHandoff = false, pinging = false, pongSeen = false;

function showBusy(msg) {
  document.getElementById("loader").classList.add("gone");
  try { const th = localStorage.getItem("mx3d_thumb"); if (th) busy.style.backgroundImage = "url(" + th + ")"; } catch (e) {}
  busyText.textContent = msg; busy.classList.add("on");
}
function run(extraState) {
  busy.classList.remove("on");
  booted = true;
  app = boot(extraState) || null;
}
function stopHere(save, msg) {
  let st = null;
  if (app) { st = app.stop(save); app = null; }
  if (releaseLock) { releaseLock(); releaseLock = null; }
  showBusy(msg);
  return st;
}
function holdLock(extraGetter) {
  return new Promise(r => {
    releaseLock = r;
    run(extraGetter ? extraGetter() : null);
  });
}
function lostLock() {            // our lock was taken by force
  if (app) stopHere(false, "RUNNING IN ANOTHER TAB");
}
if (bc) bc.onmessage = e => {
  const m = e.data || {};
  if (m.t === "handoff" && app) {
    const st = stopHere(true, "RUNNING IN ANOTHER TAB");
    bc.postMessage({ t: "released", state: st });
  } else if (m.t === "released" && waitingHandoff) {
    handoff = m.state || null;
  } else if (m.t === "ping" && app) {
    bc.postMessage({ t: "pong" });
  } else if (m.t === "pong" && pinging) {
    pongSeen = true;
  }
};

// take over from whichever tab is running now
function claim() {
  busyText.textContent = "SWITCHING...";
  waitingHandoff = true; handoff = null;
  if (bc) bc.postMessage({ t: "handoff" });
  // give the old tab's state message a moment to arrive, then boot with it
  const withHandoff = () => new Promise(r => {
    const t0 = performance.now();
    (function wait() {
      if (handoff || performance.now() - t0 > 600) { waitingHandoff = false; r(handoff); }
      else setTimeout(wait, 20);
    })();
  });
  if (hasLocks) {
    let got = false;
    const take = lock => {
      if (got) return;           // already got it another way; let go at once
      got = true;
      return withHandoff().then(st => holdLock(() => st));
    };
    navigator.locks.request(LOCK, take).catch(lostLock);
    setTimeout(() => {
      if (!got) navigator.locks.request(LOCK, { steal: true }, take).catch(lostLock);
    }, 1500);
  } else {
    setTimeout(() => withHandoff().then(st => run(st)), 200);
  }
}
document.getElementById("bgo").addEventListener("click", () => {
  if (booted) {                  // this tab ran before: reload clean, then claim
    try { sessionStorage.setItem(CLAIM_FLAG, "1"); } catch (e) {}
    location.reload();
  } else claim();
});

let claimOnLoad = false;
try { claimOnLoad = sessionStorage.getItem(CLAIM_FLAG) === "1"; sessionStorage.removeItem(CLAIM_FLAG); } catch (e) {}
if (claimOnLoad) {
  showBusy("SWITCHING..."); claim();
} else if (hasLocks) {
  navigator.locks.request(LOCK, { ifAvailable: true }, lock => {
    if (!lock) { showBusy("ALREADY RUNNING IN ANOTHER TAB"); return; }
    return holdLock(null);
  }).catch(lostLock);
} else if (bc) {
  pinging = true; bc.postMessage({ t: "ping" });
  setTimeout(() => {
    pinging = false;
    if (pongSeen) showBusy("ALREADY RUNNING IN ANOTHER TAB"); else run(null);
  }, 300);
} else run(null);

/* ================= the app (runs only in the tab that holds the lock) ================= */
function boot(handoffState) {
let dead = false;              // set by stop(): no more frames, audio or saves

/* =====================================================================
   NOTE — PRECISION RULE (read before adding anything 3D):
   ALWAYS store 3D / world data as 64-bit floats (plain JS numbers or
   Float64Array). Players may end up trillions of metres from spawn
   (far teleporters, distance-based mechanics), and 32-bit floats only
   keep ~7 digits — at 1e12 m they can't even tell metres apart.
     - Positions, velocities, teleporter targets, distances, saved data:
       JS number / Float64Array only. Never Float32Array, never
       Math.fround, never rounding before saving.
     - The GPU only has 32-bit floats, so never upload absolute world
       positions. Subtract the camera position on the CPU first (in
       64-bit), then send the small camera-relative result
       ("camera-relative rendering" — see uCamFrac / uOff below).
     - Integer cell indices are exact in a JS number up to 2^53
       (~9e15); Math.floor(x / SP) is safe well past trillions of metres.
     - Keep angles wrapped (yaw to -PI..PI) so they stay precise.
     - JSON.stringify writes numbers with full 64-bit round-trip
       precision, so save the raw values.
   Rough float64 resolution: 1e9 m -> ~0.1 µm, 1e12 m -> ~0.1 mm,
   1e15 m -> ~0.1 m (movement starts to get steppy past ~1e15).
   ===================================================================== */

/* ================= persistence ================= */
const KEY = "mx3d";
const LS_STATE = "mx3d_state", LS_THUMB = "mx3d_thumb", LS_SHOT = "mx3d_shot";   // shot: sharp last frame for a reload

function readCookie() {
  try {
    const m = document.cookie.match(/(?:^|;\s*)mx3d=([^;]*)/);
    return m ? JSON.parse(decodeURIComponent(m[1])) : null;
  } catch (e) { return null; }
}
function writeCookie(obj) {
  try {
    document.cookie = KEY + "=" + encodeURIComponent(JSON.stringify(obj)) +
      ";max-age=31536000;path=/;SameSite=Lax";
  } catch (e) {}
}
function readLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

// show the low-res snapshot while loading
const loader = document.getElementById("loader");
// a reload (F5) shows the sharp last frame (saved on pagehide) so it looks like nothing changed
const shot = readLS(LS_SHOT), thumb = shot || readLS(LS_THUMB);
if (shot) { loader.style.imageRendering = "auto"; loader.style.transition = "opacity .2s"; }
if (thumb) {
  loader.style.backgroundImage = "url(" + thumb + ")";
  document.getElementById("ltext").style.display = "none";   // just the snapshot, no text
}

// menu settings (per browser, localStorage)
const LS_SET = "mx3d_settings";
const settings = { stereo: "off", invert: false, sens: 1 };
try { Object.assign(settings, JSON.parse(readLS(LS_SET) || "{}")); } catch (e) {}
if (settings.stereo === "xr") settings.stereo = "off";   // a 3D-screen session needs a click to start
function saveSettings() { writeLS(LS_SET, JSON.stringify(settings)); }

// pick the freshest saved state (cookie vs localStorage backup)
const AREAS = ["matrix", "mausoleum"];   // "mausoleum" = the world under the matrix floor
const defaults = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0, slot: 0, area: "matrix", ts: 0 };
let saved = null;
const fromCookie = readCookie();
let fromLS = null; try { fromLS = JSON.parse(readLS(LS_STATE) || "null"); } catch (e) {}
saved = [fromLS, fromCookie, handoffState].filter(Boolean).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0] || null;   // ties: the full localStorage copy wins
const S0 = Object.assign({}, defaults, saved || {});

// world state — 64-bit floats only (see PRECISION RULE at the top)
const player = {
  x: +S0.x || 0, y: +S0.y || 0, z: +S0.z || 0,
  yaw: +S0.yaw || 0, pitch: +S0.pitch || 0, vy: +S0.vy || 0, slot: S0.slot | 0,   // slot 0 = very left
  // items: 9 hotbar slots (null = empty) + active item effects [{ id, t, ... }]; saved as-is
  hotbar: Array.isArray(S0.hotbar) && S0.hotbar.length === 9 ? S0.hotbar : Array(9).fill(null),
  effects: Array.isArray(S0.effects) ? S0.effects : [],
  area: S0.area === "plane" ? "mausoleum" : AREAS.includes(S0.area) ? S0.area : "matrix"   // "plane" = old name
};

function snapshotState() {
  // raw 64-bit values — no rounding, so far-away positions survive a save exactly
  // everything needed so a reload (F5) continues exactly: position, look, velocity, the
  // body's state (in the air / climbing / falling through / stamina), hotbar + item effects
  const s = { x: player.x, y: player.y, z: player.z, yaw: player.yaw,
           pitch: player.pitch, slot: player.slot, area: player.area, ts: Date.now(),
           vy: player.vy, hotbar: player.hotbar, effects: player.effects };
  if (typeof body !== "undefined") {
    Object.assign(s, { vx: body.vx, vz: body.vz, air: body.air, baseY: body.baseY, climb: body.climb,
      falling: body.falling, fallT: body.fallT, slowFall: body.slowFall, fov: body.fov, fly: body.fly,
      coyote: body.coyote, stam: { v: stam.v, out: stam.out, rest: stam.rest, fx: stam.fx }, fade: fadeAmt });
  }
  return s;
}

/* ================= ambience: "Seashore" at A3 =================
   Imitates the General MIDI "Seashore" patch (program 123) played on A3,
   as it sounds on classic lo-fi GM synths: a noise wash that swells in like
   a wave and slowly recedes, played 3 semitones under middle C, so it's a
   bit darker and slower, with a grainy low-sample-rate edge.
   Generated in code as a ~31 s stereo loop of 5 waves with different lengths
   and strengths, so the pattern doesn't feel repetitive. The wave envelope
   repeats exactly every loop and the ends are crossfaded, so it's seamless.
   Stereo: each ear gets its own noise, the waves reach one ear ~0.7 s
   before the other, and the whole wash drifts slowly left <-> right
   (equal-power pan, at most ~60% to one side, periodic with the loop).
   It only plays in the matrix area (it fades out in other areas).
   Browsers only allow audio after a click/key, so it starts on the first
   input and fades in.
   (Audio samples are Float32 — fine; the 64-bit rule is for world data.) */
const AMB_VOL = 0.10;        // overall ambience loudness (keep it quiet)
let actx = null, ambGain = null, ambOn = false;
function makeWindBuffer(ctx) {
  const sr = 22050;          // generated at a lo-fi rate (also 2x faster to build); the browser resamples it
  const waves = [5.6, 6.8, 5.1, 7.3, 6.2];      // seconds per wave
  const peaks = [1.0, 0.78, 0.93, 0.72, 0.88];  // how big each wave is
  const secs = waves.reduce((a, b) => a + b, 0);
  const starts = []; { let acc = 0; for (const w of waves) { starts.push(acc); acc += w; } }
  const FLOOR = 0.13, E3 = Math.exp(-3);
  function env(t) {                              // 0..1, periodic in secs
    t %= secs;
    let k = waves.length - 1; while (k > 0 && t < starts[k]) k--;
    const p = (t - starts[k]) / waves[k], rise = 0.36;
    let sh;
    if (p < rise) { const u = p / rise; sh = u * u * (3 - 2 * u); }        // wave rolls in
    else { const u = (p - rise) / (1 - rise); sh = (Math.exp(-3 * u) - E3) / (1 - E3); } // wash recedes
    return FLOOR + (peaks[k] - FLOOR) * sh;
  }
  const L = Math.floor(sr * secs), X = Math.floor(sr * 2), N = L + X;
  const buf = ctx.createBuffer(2, L, sr);
  // A3 = 3 semitones below the sample's root: ~22 kHz sample played slower,
  // plus the grainy sample-and-hold / quantize of an old wavetable synth
  const effRate = 11025 * Math.pow(2, -3 / 12);
  const hold = Math.max(1, Math.round(sr / effRate)), levels = 64;
  const k1 = f => 1 - Math.exp(-2 * Math.PI * f / sr);   // one-pole coefficient
  const hpA = k1(110);
  for (let ch = 0; ch < 2; ch++) {
    const raw = new Float32Array(N);
    let l1 = 0, l2 = 0, hp = 0, peak = 1e-9;
    for (let i = 0; i < N; i++) {
      const e = env(i / sr + secs - ch * 0.7);   // waves reach the left ear a moment earlier
      const n = Math.random() * 2 - 1;
      // darker in the troughs, bright hiss at the crest
      const a = k1(450 + 2900 * Math.pow(e, 1.4));
      l1 += a * (n - l1); l2 += a * (l1 - l2);
      hp += hpA * (l2 - hp);                     // remove rumble below ~110 Hz
      const body = (l2 - hp) * 2.4;
      const foam = n * 0.05 * e * e * e;         // fizz of foam near the peak
      // constant wind bed + waves on top: never drops out between waves
      const v = (body + foam) * (0.62 + 0.38 * Math.pow(e, 1.25));
      raw[i] = v; if (Math.abs(v) > peak) peak = Math.abs(v);
    }
    const out = buf.getChannelData(ch);
    let held = 0;
    for (let i = 0; i < L; i++) {
      let v = raw[i];
      if (i < X) { const t = i / X; v = raw[i] * t + raw[L + i] * (1 - t); } // seamless loop
      // lo-fi; a little dither so quiet parts stay grainy instead of rounding to silence
      if (i % hold === 0) held = Math.round((v / peak) * 0.9 * levels + (Math.random() - Math.random()) * 0.5) / levels;
      // slow left/right drift (periodic in the loop so it stays seamless)
      const w = 2 * Math.PI * (i / sr) / secs;
      const pan = 0.45 * Math.sin(3 * w + 0.8) + 0.15 * Math.sin(7 * w + 2.1);   // -0.6..0.6
      const ang = (pan + 1) * Math.PI / 4;
      out[i] = held * Math.SQRT2 * (ch === 0 ? Math.cos(ang) : Math.sin(ang));
    }
  }
  return buf;
}
function ambTarget() { return player.area === "matrix" ? AMB_VOL : 0; }
// called when the area changes: fade the matrix wind in/out
function updateAmbienceArea(sec) {
  if (!ambOn || !actx) return;
  const t = actx.currentTime;
  ambGain.gain.cancelScheduledValues(t);
  ambGain.gain.setValueAtTime(ambGain.gain.value, t);
  ambGain.gain.linearRampToValueAtTime(ambTarget(), t + (sec || 1.5));
}
function fadeInAmbience() {
  if (ambOn || !actx || actx.state !== "running") return;
  ambOn = true;
  const t = actx.currentTime;
  ambGain.gain.setValueAtTime(0, t);
  ambGain.gain.linearRampToValueAtTime(ambTarget(), t + 3);   // gentle 3 s fade-in
  removeEventListener("pointerdown", startAmbience, true);
  removeEventListener("keydown", startAmbience, true);
}
function startAmbience() {
  if (dead) return;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      const src = actx.createBufferSource();
      src.buffer = makeWindBuffer(actx); src.loop = true;
      const filt = actx.createBiquadFilter();       // soften the aliasing a little
      filt.type = "lowpass"; filt.frequency.value = 4200; filt.Q.value = 0.5;
      ambGain = actx.createGain(); ambGain.gain.value = 0;
      src.connect(filt); filt.connect(ambGain); ambGain.connect(actx.destination);
      src.start();
    } catch (e) { actx = null; return; }
  }
  if (actx.state === "running") fadeInAmbience();
  else actx.resume().then(fadeInAmbience).catch(() => {});
}
addEventListener("pointerdown", startAmbience, true);
addEventListener("keydown", startAmbience, true);
startAmbience();   // starts right away if the browser already allows audio
document.addEventListener("visibilitychange", () => {
  if (!actx || !ambOn || dead) return;
  if (document.hidden) actx.suspend().catch(() => {}); else actx.resume().catch(() => {});
});

/* ================= body sounds: footsteps, jump, landing =================
   Tiny lo-fi samples made in code on first use (11025 Hz, ~5-bit), in the
   same grainy style as the ambience: a soft low thump, a crunchy tick and a
   short square "zap" from stepping on the glowing grid. 4 variations per
   step, random pitch, alternating left/right. Played through the same
   AudioContext as the ambience, so they only sound once audio is allowed. */
const STEP_VOL = 0.26;       // footstep loudness
let sfxBufs = null, sfxBus = null;
function synthSfx(dur, fn) {
  const sr = 11025, n = Math.floor(sr * dur), tmp = new Float32Array(n), st = { ph: 0, zp: 0, lp: 0, lp2: 0 };
  let peak = 1e-9;
  for (let i = 0; i < n; i++) { const v = fn(i / sr, st); tmp[i] = v; if (Math.abs(v) > peak) peak = Math.abs(v); }
  const b = actx.createBuffer(1, n, sr), d = b.getChannelData(0), lv = 22, fade = Math.floor(sr * 0.006);
  for (let i = 0; i < n; i++) {
    const f = i > n - fade ? (n - i) / fade : 1;
    d[i] = Math.round(tmp[i] / peak * 0.9 * f * lv) / lv;
  }
  return b;
}
function buildSfx() {
  const TAU = 2 * Math.PI, sr = 11025, R = (a, b) => a + Math.random() * (b - a);
  // A footfall = heel strike + toe contact ~55 ms later. The weight sits at
  // 90-400 Hz (a low "knock") so it's heard even on laptop speakers, with a
  // crunchy tick and a short square "zap" from the glowing grid on top.
  const svf = (st, key, x, fc, q) => {            // resonant band-pass (state-variable)
    const f = 2 * Math.sin(Math.PI * fc / sr), L = key + "L", B = key + "B";
    st[L] = st[L] || 0; st[B] = st[B] || 0;
    const hp = x - st[L] - q * st[B]; st[B] += f * hp; st[L] += f * st[B];
    return st[B];
  };
  const foot = o => (t, st) => {
    const n = Math.random() * 2 - 1;
    // heel: pitched body thump + wooden knock + tick
    st.ph += TAU * (o.body + o.body * 1.1 * Math.exp(-t / 0.018)) / sr;
    let v = Math.sin(st.ph) * Math.exp(-t / o.bodyT) * o.bodyA;

gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* ---- "mausoleum" area: the world under the matrix floor ----
   An endless orange plain of shiny, bevelled "smooth plastic" architecture
   under a purple-blue sky and a low sun: scattered blocks (some with yellow
   caps), tall pillars with overhanging tops and yellow knobs, and huge red
   walls with olive frame bands. Drawn per pixel by ray marching a distance
   field of rounded boxes, with sun shadows, ambient occlusion, a plastic
   highlight and a sky reflection.

   Layout: three layers of cells (blocks 5 m, pillars 40 m, walls 200 m);
   each cell reads 4 random bytes from MAUS_TAB, a 256x256 table made in JS
   from a fixed seed. The GPU and the JS collision code read the SAME table,
   so what you see is exactly what you bump into.

   Precision rule: the GPU only ever gets the eye position relative to a
   1000 m-aligned origin (plus each layer's table offset for that origin,
   worked out exactly in 64-bit on the CPU), so it looks the same trillions
   of metres out. Every pattern period divides 1000 m, so nothing jumps when
   the origin moves. Objects stay a safe margin inside their cells, which
   lets the distance field bound neighbouring cells without looking at them. */
const MAUS_TAB = (() => {                       // 256x256 RGBA random bytes, fixed seed
  let a = 0x9e3779b9 ^ 20260928;
  const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t = new Uint8Array(256 * 256 * 4);
  for (let i = 0; i < t.length; i++) t[i] = Math.floor(rnd() * 256);
  return t;
})();
const MAUS = {                                  // cell size + table offset per layer
  peg: { cell: 5, off: [0, 0] }, pillar: { cell: 40, off: [97, 31] },
  wall: { cell: 200, off: [181, 211] }, floor: { cell: 2.5, off: [53, 149] },
  blk: { cell: 2.5, off: [53 + 113, 149 + 29] }     // blocks: the floor grid, another table spot
};
/* ---- mausoleum renderer: real 3D geometry (rasterized), not ray marched ----
   Every piece (blocks, caps, towers, trims, knobs, ring walls, wall bands,
   colonnades...) is a bevelled box drawn with GPU instancing: one mesh, many
   copies. Nearby boxes use a rounded-bevel mesh (smooth shiny edges), far
   ones a plain box. The sun casts shadows through two shadow maps (sharp near
   you, wider further out) with smooth filtering. Surface detail (studs,
   panels, holes, rivets, pits, grid) is drawn per pixel.
   Precision rule: box positions are stored relative to a rebuild origin R
   (updated as you move) and shifted by (R - eye) each frame, both worked out
   in 64-bit on the CPU; the floor pattern uses the eye's offset inside each
   grid cell, like before. */
const MAUS_COMMON_FS = `
precision highp float;
uniform float uEyeY;
uniform vec4 uFeA, uFeB, uBaseA, uBaseB;
uniform sampler2D uTab;
uniform sampler2D uSh0, uSh1, uSh2;  // sun shadow maps (near, mid, far)
uniform vec3 uCamToS0, uCamToS1, uCamToS2;   // eye -> each shadow map's centre
uniform vec3 uLR, uLU, uLF;         // sun space: right, up, forward (direction the light travels)
uniform vec3 uShP, uShD;             // half sizes, depth ranges of the three maps
uniform float uShadowOn;
const vec3 SUN = vec3(-0.4461, 0.6197, -0.6454);
const vec3 SUNC = vec3(1.62, 1.42, 1.12);
const vec3 FOGC = vec3(0.64, 0.63, 0.92);
vec4 tab(vec2 c){ c = mod(c, 256.0); return texture2D(uTab, (c + 0.5) / 256.0); }
float h21(vec2 v){ return fract(sin(dot(v, vec2(12.9898, 78.233))) * 43758.5453); }
float hole(vec2 g, float r){ return 1.0 - smoothstep(r - 0.008, r + 0.008, max(abs(g.x), abs(g.y))); }
vec2 faceUV(vec3 p, vec3 n){
  vec3 a = abs(n);
  return a.x > a.y && a.x > a.z ? p.zy : (a.y > a.z ? p.xz : p.xy);
}
vec3 skyCol(vec3 rd){
  float y = max(rd.y, 0.0);
  vec3 c = mix(FOGC, vec3(0.34, 0.45, 0.86), pow(y, 0.5));
  float s = max(dot(rd, SUN), 0.0);
  c += vec3(1.0, 0.86, 0.62) * (pow(s, 400.0) * 1.2 + pow(s, 10.0) * 0.12);
  if (s > 0.99955) c = vec3(1.7, 1.6, 1.4);
  return c;
}
// 3x3 bilinear-weighted PCF (16 taps): smooth shadow edges, no noise, no rings
float pcf(sampler2D t, vec2 uv, float z){
  vec2 ts = vec2(1.0 / 2048.0);
  vec2 st = uv / ts - 0.5, f = fract(st);
  vec2 base = (floor(st) + 0.5) * ts;
  float sum = 0.0;
  for (int y = -1; y <= 2; y++) for (int x = -1; x <= 2; x++) {
    float wx = x == -1 ? 1.0 - f.x : (x == 2 ? f.x : 1.0);
    float wy = y == -1 ? 1.0 - f.y : (y == 2 ? f.y : 1.0);
    sum += wx * wy * step(z, texture2D(t, base + vec2(float(x), float(y)) * ts).r);
  }
  return sum / 9.0;
}
// one map: lit fraction, and how far out in the map the point is (0 centre .. 1 edge)
float shadowMap(sampler2D t, vec3 rel, vec3 n, vec3 camToS, float H, float D, float noff, float bias, out float e){
  vec3 q = rel + camToS;
  e = max(abs(dot(q, uLR)), abs(dot(q, uLU))) / H;
  if (e >= 1.0) return 1.0;
  vec3 qo = q + n * noff;
  vec3 lo = vec3(dot(qo, uLR), dot(qo, uLU), dot(qo, uLF));
  return pcf(t, lo.xy / H * 0.5 + 0.5, lo.z / D * 0.5 + 0.5 - bias);
}
// cascades blend into each other over the outer part of each map (no seam lines), and
// the last one fades to lit before its edge
float shadowAt(vec3 rel, vec3 n){
  if (uShadowOn < 0.5) return 1.0;
  float e0, e1, e2;
  float s0 = shadowMap(uSh0, rel, n, uCamToS0, uShP.x, uShD.x, 0.03, 0.0002, e0);
  if (e0 < 0.8) return s0;
  float s1 = shadowMap(uSh1, rel, n, uCamToS1, uShP.y, uShD.y, 0.2, 0.0006, e1);
  float w0 = e0 < 1.0 ? 1.0 - smoothstep(0.8, 0.95, e0) : 0.0;
  if (e1 < 0.8) return mix(s1, s0, w0);
  float s2 = shadowMap(uSh2, rel, n, uCamToS2, uShP.z, uShD.z, 0.8, 0.0005, e2);
  s2 = mix(s2, 1.0, smoothstep(0.8, 0.95, e2));
  float w1 = e1 < 1.0 ? 1.0 - smoothstep(0.8, 0.95, e1) : 0.0;
  return mix(mix(s2, s1, w1), s0, w0);
}
// materials: 0 floor, 1 block, 2 yellow, 3 red wall, 4 olive frame, 5 tower,
//            6 grooved long block, 7 patterned column, 8 olive frieze (dentils),
//            9 detailed orange (marks + grooves), 10 yellow-green trim,
//            13 studded wall (seed 0 orange, 1 dark brown), 15 dark recess
// fd = distance from the eye: fine patterns fade out before they get smaller than a
// pixel (otherwise they shimmer / turn grainy in the distance)
varying vec3 vRel, vN, vLocal, vHs;
varying float vMat, vSeed;
// block footprint per 2.5 m cell (same variants as mausBlock() in JS): half w, half d, offset
vec4 blockRect(vec4 u){
  float v = fract(u.b * 11.7);
  bool ax = u.a > 0.5;
  if (v < 0.12) { float L = (2.0 + floor(u.g * 1.999)) * 0.4 - 0.02; return ax ? vec4(L, 0.38, 0.0, 0.0) : vec4(0.38, L, 0.0, 0.0); }
  if (v < 0.24) { float T = 0.04 + 0.02 * u.g, D = 0.35 + 0.15 * fract(u.g * 7.13);
    return ax ? vec4(D, T, 0.0, 0.0) : vec4(T, D, 0.0, 0.0); }
  if (v < 0.32) return ax ? vec4(0.82, 0.4, 0.0, 0.0) : vec4(0.4, 0.82, 0.0, 0.0);
  if (v < 0.40) { float s = 0.25 + 0.05 * u.g; return vec4(s, s, 0.0, 0.0); }
  float hw = 0.38 + 0.17 * u.g;
  return vec4(hw, min(0.58, hw * (0.85 + 0.3 * fract(u.g * 7.13))), 0.0, 0.0);
}
// is a point (p frame) within reach of a tower (incl. its enclosure) or a wall, plus margin m?
// (same rule as mausNearBig() in JS; each tower/wall stays inside its own cell)
bool nearBig(vec2 c, vec2 m){
  vec2 q = uFeA.zw + (c - uFeA.xy), qc = floor(q / 40.0);
  vec4 t = tab(qc + uBaseA.zw);
  if (t.r < 0.28) {                                   // tower (offset in its cell) or medium building (centred)
    bool bld = fract(t.a * 7.7) < 0.35;
    vec2 s = bld ? vec2(6.0 + 2.0 * t.g + 7.2) : vec2(2.6 + 1.4 * t.g, 2.6 + 1.4 * fract(t.g * 5.3)) + 2.4;
    vec2 pp = (qc + 0.5) * 40.0 + (bld ? vec2(0.0) : (vec2(t.b, fract(t.b * 4.7)) - 0.5) * 12.0);
    if (abs(q.x - pp.x) < s.x + m.x && abs(q.y - pp.y) < s.y + m.y) return true;
  }
  vec2 w = uFeB.xy + (c - uFeA.xy), wc = floor(w / 200.0);
  t = tab(wc + uBaseB.xy);
  if (t.r < 0.45) {
    vec2 s = vec2(20.0 + 30.0 * t.g, 8.0 + 14.0 * t.b);
    if (t.a > 0.5) s = s.yx;
    vec2 wp = (wc + 0.5) * 200.0 + (vec2(fract(t.g * 3.3), fract(t.b * 6.1)) - 0.5) * 60.0;
    if (abs(w.x - wp.x) < s.x + 6.0 + m.x && abs(w.y - wp.y) < s.y + 6.0 + m.y) return true;
  }
  return false;
}
// big square pits in some 5 m cells, kept clear of towers and walls
// (same rule as mausHole() in JS). pc = cell index relative to the eye's cell.
const float HOLE_D = 0.9;
bool bigHole(vec2 pc, vec4 u, out vec2 hc, out vec2 hh){
  hc = vec2(0.0); hh = vec2(0.0);
  if (u.r < 0.965) return false;
  hh = vec2(0.8 + 0.7 * u.g, 0.8 + 0.7 * fract(u.g * 7.13));
  hc = (pc + 0.5) * 5.0;
  return !nearBig(hc, hh + 0.8);                     // + the module rim around it
}
vec3 albedo(vec3 p, vec3 local, vec3 n, float id, float seed, float fd, out float ao){
  ao = 1.0;
  float fine = 1.0 - smoothstep(18.0, 55.0, fd);      // 0.625 m details
  float mid = 1.0 - smoothstep(70.0, 180.0, fd);      // 2.5 m details
  float big = 1.0 - smoothstep(250.0, 600.0, fd);     // 5 m panels
  vec3 ORANGE = vec3(0.96, 0.44, 0.12), OLIVE = vec3(0.44, 0.42, 0.17), YEL = vec3(0.98, 0.88, 0.34);
  if (id < 0.5) {                                                           // ---- floor
    vec3 c = vec3(0.97, 0.33, 0.10);
    vec2 f1 = abs(fract(p.xz / 0.625) - 0.5) * 0.625, f2 = abs(fract(p.xz / 2.5) - 0.5) * 2.5;
    float sm = min(f2.x, f2.y);                                             // 2.5 m seams: groove + bright lip
    c *= 1.0 + 0.05 * fine * (1.0 - smoothstep(0.004, 0.012, min(f1.x, f1.y)))
             + 0.12 * mid * (1.0 - smoothstep(0.02, 0.035, sm))
             - 0.25 * mid * (1.0 - smoothstep(0.004, 0.009, sm));
    vec2 wf = uFeB.zw + (p.xz - uFeA.xy);
    vec2 cl = floor(wf / 2.5), lp = wf - (cl + 0.5) * 2.5;
    vec4 t = tab(cl + uBaseB.zw);
    c *= mix(1.0, 0.95 + 0.08 * t.a, big);                                 // tiles differ a little
    vec2 pc = floor(p.xz / 5.0), pl = p.xz - (pc + 0.5) * 5.0;
    vec4 u = tab(pc + uBaseA.xy);
    // faint lighter nested squares (the reference floor's fine "circuit" look)
    vec2 g1 = abs(fract(p.xz / 1.25) - 0.5) * 1.25;                          // 0 at the centre of each 1.25 m square
    float r1 = max(g1.x, g1.y);
    float ln = (1.0 - smoothstep(0.012, 0.024, abs(r1 - 0.3))) * 0.6 + (1.0 - smoothstep(0.01, 0.02, abs(r1 - 0.16))) * 0.35;
    float r2 = max(abs(lp.x), abs(lp.y));
    ln = max(ln, (1.0 - smoothstep(0.012, 0.026, abs(r2 - 1.0))) * step(0.5, t.a));
    c += vec3(0.16, 0.05, 0.06) * ln * fine + vec3(0.02, 0.006, 0.008) * (1.0 - fine) * mid;
    vec2 hc, hh;
    bool pitCell = bigHole(pc, u, hc, hh);
    // blocks (2.5 m cells) stand in a floor gap (dark pit) with a lit rim and soft contact shade
    vec4 tb = tab(cl + uBaseB.zw + vec2(113.0, 29.0));
    bool blk = tb.r < 0.30 && !pitCell && !nearBig(p.xz - lp, vec2(1.6));
    // a small yellow dot in the middle of each 1.25 m square
    { vec2 sc = floor(wf / 1.25), dg = wf - (sc + 0.5) * 1.25;
      c = mix(c, vec3(0.95, 0.80, 0.30), 0.8 * fine * (1.0 - smoothstep(0.022, 0.032, length(dg)))); }
    // small square holes on the 1.25 m lattice (the reference), 70%; the lattice points at
    // cell centres (block spots) only when there's no block
    { vec2 li = floor(wf / 1.25 + 0.5), dl = wf - li * 1.25;
      bool centre = mod(li.x, 2.0) > 0.5 && mod(li.y, 2.0) > 0.5;
      vec4 s = tab(li + uBaseB.zw * 2.0 + vec2(29.0, 83.0));
      if (s.r < 0.7 && !pitCell && !(centre && blk)) {
        float m = max(abs(dl.x), abs(dl.y));
        c *= mix(mix(0.10, 0.85, 1.0 - mid), 1.0, smoothstep(0.1, 0.12, m));
        c += vec3(0.25, 0.08, 0.02) * fine * (smoothstep(0.075, 0.1, m) - smoothstep(0.1, 0.12, m));
      }
    }
    if (!blk) {
      if (false) {
      } else if (false) {                                            // (yellow rivets: replaced by the hole lattice)
        float d = length(lp);
        c = mix(c, vec3(0.95, 0.82, 0.30), fine * (1.0 - smoothstep(0.05, 0.065, d)));
        c *= mix(mix(0.25, 1.0, 1.0 - fine), 1.0, smoothstep(0.018, 0.03, d));
      }
    } else {
      vec4 b = blockRect(tb);
      vec2 e = abs(lp - b.zw) - b.xy;
      float pit = max(e.x, e.y);
      float vis = 1.0 - smoothstep(290.0, 375.0, fd);                       // blocks fade away 290-375 m
      c *= mix(1.0, mix(0.14, 1.0, smoothstep(0.1, 0.13, pit)), vis);
      c += vec3(0.16, 0.05, 0.01) * fine * (smoothstep(0.11, 0.13, pit) - smoothstep(0.13, 0.17, pit));
      ao *= mix(1.0, mix(0.55, 1.0, smoothstep(0.1, 0.45, pit)), vis);
    }
    if (pitCell) {                                                          // big pits: a dark border lip
      vec2 e = abs(p.xz - hc) - hh;
      float m = max(e.x, e.y);
      c *= mix(0.35, 1.0, smoothstep(0.05, 0.08, m));
      c *= 1.0 + 0.2 * mid * (smoothstep(0.08, 0.1, m) - smoothstep(0.1, 0.14, m));
    }
    return c;
  }
  // soft darkening low down and underneath (stand-in for ambient occlusion)
  ao = mix(0.6, 1.0, smoothstep(0.0, 1.3, p.y)) * (n.y < -0.5 ? 0.55 : 1.0);
  bool side = abs(n.y) < 0.5;
  float across = abs(n.x) > 0.5 ? local.z : local.x;                         // horizontal coord on a side face
  float acrossH = abs(n.x) > 0.5 ? vHs.z : vHs.x;
  if (id < 1.5) {                                                           // ---- block
    if (vHs.y < 0.05) return ORANGE * 0.4;                                  // groove on the seam under the cap
    // one possible hole per 0.6 m cell, jittered inside it, ~12% of cells
    // the seed arrives interpolated (not bit-exact across the face), so round it:
    // a sin-hash turns tiny differences into per-pixel noise
    float sd = floor(seed + 0.5);
    float kind = floor(sd / 1024.0); sd = mod(sd, 1024.0);
    vec2 uv = faceUV(local, n);
    vec2 cell = floor(uv / 0.6), g = (fract(uv / 0.6) - 0.5) * 0.6;
    vec2 key = cell + vec2(mod(sd, 16.0), floor(sd / 16.0)) * 7.0;
    vec2 jit = (vec2(h21(key + 3.1), h21(key + 7.7)) - 0.5) * 0.3;
    float on = step(h21(key), 0.12) * step(kind, 1.5);
    float c = 1.0 - 0.75 * on * mid * hole(g - jit, 0.07);
    if (side && fine > 0.0) {                                               // tiny holes on the sides
      float dy = vHs.y - local.y;
      vec2 hg;
      float ok;
      if (kind > 1.5 && acrossH < 0.2) {                                    // slab end: a column of them
        hg = vec2(across, (fract(local.y / 0.16) - 0.5) * 0.16);
        ok = step(0.12, dy) * step(local.y, vHs.y - 0.12) * step(-vHs.y + 0.15, local.y);
      } else {                                                              // a row under the top edge
        hg = vec2((fract(across / 0.13 + 0.5) - 0.5) * 0.13, dy - 0.14);
        ok = step(abs(across), acrossH - 0.07) * step(mod(sd, 3.0), 0.5);
      }
      c *= 1.0 - 0.7 * fine * ok * (1.0 - smoothstep(0.017, 0.025, max(abs(hg.x), abs(hg.y))));
      // grooves along the faces: a ring around the body (most blocks), a vertical one on some
      float ring = step(mod(sd, 4.0), 0.5) * (1.0 - smoothstep(0.012, 0.022, abs(local.y - (vHs.y - 0.36))));
      float vert = step(mod(sd, 5.0), 1.5) * step(0.3, acrossH) * (1.0 - smoothstep(0.012, 0.022, abs(across)));
      c *= 1.0 - 0.5 * mid * max(ring, vert * step(local.y, vHs.y - 0.36));
    }
    return ORANGE * c;
  }
  if (id < 2.5) return YEL;                                                 // ---- yellow
  vec3 YG = vec3(0.80, 0.86, 0.32);
  if (id < 3.5) {                                                           // ---- red wall panels
    vec2 uv = faceUV(p, n);
    vec3 c = vec3(0.84, 0.22, 0.21);
    vec2 pg = abs(fract(uv / vec2(5.0, 3.5)) - 0.5) * vec2(5.0, 3.5);
    float frame = (1.0 - smoothstep(0.16, 0.2, min(pg.x, pg.y))) * big;
    c = mix(mix(c * 0.78, c, smoothstep(0.2, 0.6, min(pg.x, pg.y))), c * 0.9, 1.0 - big);
    c = mix(c, vec3(0.44, 0.40, 0.17), frame);
    vec2 g = fract(uv / 0.625) - 0.5;
    c *= 1.0 - 0.55 * fine * hole(g * 0.625, 0.06) * (1.0 - frame);
    c *= 1.0 - 0.12 * (1.0 - fine) * mid;                                   // studs far away: slightly darker average
    return c;
  }
  if (id < 4.5) return OLIVE;                                               // ---- olive frame
  if (id < 5.5) {                                                           // ---- tower: sparse small square holes
    vec2 uv = faceUV(p, n);
    vec2 cl = floor(uv / 1.25), g = (fract(uv / 1.25) - 0.5) * 1.25;
    // p is relative to the eye's 5 m cell, so add that cell (4 squares per cell) to get a
    // world-fixed pattern; without it the holes re-shuffled whenever you crossed a 5 m line
    vec2 cb = abs(n.x) > 0.5 ? vec2(uBaseA.y * 4.0, 0.0) : (abs(n.z) > 0.5 ? vec2(uBaseA.x * 4.0, 0.0) : uBaseA.xy * 4.0);
    vec4 r = tab(cl + cb + vec2(59.0, 211.0) + (abs(n.x) > 0.5 ? vec2(17.0, 0.0) : vec2(0.0)));
    vec2 e = abs(g) - 0.075;                                              // holes on a regular 1.25 m grid, a few missing
    float on = step(r.r, 0.7) * float(side);
    return ORANGE * (1.0 - 0.75 * on * mid * (1.0 - smoothstep(0.0, 0.012, max(e.x, e.y))))
                  * (1.0 - 0.03 * (1.0 - mid));
  }
  if (id < 6.5) {                                                           // ---- long block: grooves across
    bool lx = vHs.x > vHs.z;
    float a = lx ? local.x : local.z, L = lx ? vHs.x : vHs.z;
    float along = lx ? abs(n.x) : abs(n.z);
    float c = 1.0;
    if (along < 0.5) {
      float s = (fract(a / 0.26 + 0.5) - 0.5) * 0.26;                       // every 0.26 m, centred
      float inRange = step(abs(a), L - 0.1);
      float gr = (1.0 - smoothstep(0.016, 0.028, abs(s))) * inRange;
      float lip = (smoothstep(0.028, 0.034, s) - smoothstep(0.034, 0.05, s)) * inRange;
      c = 1.0 - 0.62 * gr * mid + 0.2 * lip * mid - 0.1 * (1.0 - mid) * inRange;
    }
    return ORANGE * c;
  }
  if (id < 7.5) {                                                           // ---- patterned column
    vec3 c = OLIVE;
    float yl = fract(p.y / 1.6) * 1.6;                                      // 0..1.6 per segment
    if (side) {
      float band = 1.0 - smoothstep(0.1, 0.13, min(yl, 1.6 - yl));        // yellow band every 1.6 m
      c = mix(c, YEL * 0.95, band * mid);
      float gv = (1.0 - smoothstep(0.03, 0.05, abs(across))) * step(0.2, acrossH);   // groove down the middle
      c *= 1.0 - 0.45 * gv * mid * (1.0 - band);
      vec2 hg = vec2(abs(abs(across) - acrossH * 0.5), abs(yl - 0.8) - 0.32);         // tiny holes in pairs
      c *= 1.0 - 0.7 * fine * (1.0 - band) * (1.0 - smoothstep(0.022, 0.032, length(hg)));
      c *= 1.0 - 0.05 * (1.0 - mid);
    }
    return c;
  }
  if (id > 15.5) return vec3(0.84, 0.22, 0.21);                            // ---- plain red (cube modules)
  if (id > 14.5) return vec3(0.16, 0.13, 0.07);                            // ---- dark recess under towers
  if (id > 12.5) {                                                          // ---- studded wall: yellow dot grid
    vec3 base = seed > 0.5 ? vec3(0.30, 0.17, 0.09) : ORANGE * 0.95;
    vec2 uv = faceUV(p, n);

const keys = {};

addEventListener("keydown", e => {
  if (e.code === "F11") {                  // real fullscreen of the page (Fullscreen API)
    e.preventDefault();
    if (!e.repeat) toggleFullscreen();
    return;
  }
  if (e.code === "Tab") {                  // Tab opens / closes the menu
    e.preventDefault();
    if (!e.repeat) (menuOpen ? closeMenu() : tryOpenMenu());
    return;
  }
  if (menuOpen) return;                    // game is frozen while the menu is open
  typed(e.key);                            // secret words (1337dbg)
  if (e.code === "KeyW" && !e.repeat) tryFallThrough(); else if (!e.repeat) body.downT = 0;
  keys[e.code] = true;
  if (e.code === "Space" && !e.repeat) spaceHit = true;
  if (e.code.startsWith("Digit") && e.code !== "Digit0") setSlot(+e.code.slice(5) - 1);
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();

const SENS = 0.0023;            // base mouse sensitivity; the menu slider scales it (settings.sens)
const PITCH_MAX = Math.PI / 2;   // look straight up / straight down (90°)
function look(dx, dy) {
  if (menuOpen) return;
  const k = SENS * settings.sens;
  player.yaw -= dx * k;
  player.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, player.pitch - dy * k));
}
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener("pointerdown", e => {
  if (canvas.requestPointerLock && e.pointerType === "mouse") { try { canvas.requestPointerLock(); } catch (_) {} }
  dragging = true; lx = e.clientX; ly = e.clientY;
});
addEventListener("pointerup", () => dragging = false);
let lastMove = 0;                           // size of the last normal mouse move (px)
addEventListener("pointermove", e => {
  if (document.pointerLockElement === canvas) {
    // browsers sometimes report one huge bogus jump in pointer lock (the camera "flicks"):
    // a move far bigger than the ones just before it is dropped
    const m = Math.max(Math.abs(e.movementX), Math.abs(e.movementY));
    if (m > 200 && m > lastMove * 5 + 40) return;
    lastMove = m;
    look(e.movementX, e.movementY);
  }
  else if (dragging) { look(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; }
});
addEventListener("contextmenu", e => e.preventDefault());

/* ================= menu (Tab) =================
   Opening it freezes the game: the current frame is saved as the small
   compressed snapshot (same as the save thumbnail) and shown pixelated as
   the background, and nothing moves or renders until it's closed. */
const menuEl = document.getElementById("menu");
const m3d = document.getElementById("m3d"), minv = document.getElementById("minv");
const msens = document.getElementById("msens"), msensv = document.getElementById("msensv");
const mdata = document.getElementById("mdata");
let menuOpen = false;
function storageStatus() {
  const k = "mx3d_test", v = String(Math.random());
  if (writeLS(k, v) && readLS(k) === v) { try { localStorage.removeItem(k); } catch (e) {} return "OK"; }
  if (navigator.cookieEnabled && location.protocol !== "file:") return "cookies only";
  return "UNAVAILABLE";
}
function openMenu() {
  menuOpen = true;
  for (const k in keys) keys[k] = false;
  dragging = false;
  if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
  const th = makeThumb();                  // compressed, frozen background
  if (th) { menuEl.style.backgroundImage = "url(" + th + ")"; writeLS(LS_THUMB, th); }
  mdata.textContent = "Data storage: " + storageStatus();
  menuEl.classList.add("on");
}
/* pause spam guard: opening the menu 3 times within 4 s of GAME time
   (time actually played — it doesn't pass while paused) locks it until
   you've played 2 more seconds. Closing is always allowed. */
const PAUSE_GUARD = { window: 4, maxOpens: 3, cooldown: 2 };
let pauseOpens = [], pauseLockUntil = 0;
function tryOpenMenu() {
  if (gameTime < pauseLockUntil) return;
  pauseOpens = pauseOpens.filter(t => gameTime - t < PAUSE_GUARD.window);
  pauseOpens.push(gameTime);
  if (pauseOpens.length >= PAUSE_GUARD.maxOpens) { pauseLockUntil = gameTime + PAUSE_GUARD.cooldown; pauseOpens = []; }
  openMenu();
}
// F11: make the page itself fullscreen (hides browser UI, keeps pointer lock working)
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    let r;
    if (d.fullscreenElement || d.webkitFullscreenElement) r = (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" });
    if (r && r.catch) r.catch(() => {});
  } catch (e) {}
}
document.addEventListener("fullscreenchange", () => resize());
function closeMenu() {
  menuOpen = false;
  menuEl.classList.remove("on");
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

/* ---- "3D Screen": WebXR immersive display (headset or 3D monitor) ----
   The option only appears if the browser reports one is available. */
let xrSession = null, xrRef = null;
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported("immersive-vr").then(ok => {
    if (!ok || dead) return;
    const o = document.createElement("option"); o.value = "xr"; o.textContent = "3D Screen";
    m3d.appendChild(o);
  }).catch(() => {});
}
function xrFallback() {
  settings.stereo = "off"; m3d.value = "off"; saveSettings();
  document.body.dataset.stereo = "off";
}
async function startXR() {
  if (xrSession || !navigator.xr) return;
  try {
    if (gl.makeXRCompatible) await gl.makeXRCompatible();
    const session = await navigator.xr.requestSession("immersive-vr");
    xrSession = session;
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
    xrRef = await session.requestReferenceSpace("local");
    session.addEventListener("end", () => {
      xrSession = null; xrRef = null;
      if (settings.stereo === "xr") xrFallback();
      if (!dead) { last = performance.now(); requestAnimationFrame(frame); }
    });
    session.requestAnimationFrame(frame);
  } catch (e) {
    xrSession = null; xrFallback();
  }
}

/* ================= loop ================= */
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr); canvas.height = Math.floor(innerHeight * dpr);
}
addEventListener("resize", resize); resize();

const EYE = 1.7;
let last = performance.now();
let gameTime = 0;           // seconds of game time (debug time multiplier speeds it up / slows it down)
// body feel — velocities are 64-bit like positions; bob/lean are render-only (never saved)
const body = {
  vx: 0, vz: 0,              // horizontal velocity (eased)
  turnV: 0, pitchV: 0,       // arrow-key look speed (eased)
  stepPhase: 0, stepIdx: 0,  // counts footsteps; bob is lowest at each whole number
  bobAmt: 0,                 // 0 standing .. 1 full stride
  landOff: 0, landVel: 0,    // spring for the camera dip after landing
  air: false, fov: 75, roll: 0,
  breathPh: 0,               // breathing phase (accumulated, see below)
  bobY: 0, bobSide: 0, breath: 0,
  downT: 0,                  // seconds spent looking straight down (secret fall)
  falling: false, fallT: 0,  // falling through the matrix floor
  slowFall: false,           // fall at walking speed (fall-through + drop into the new place)
  fly: false,                // debug no-clip flying
  baseY: 0,                  // height of the ground last stood on (climb heights count from here)
  climb: null,               // climbing onto a ledge: { T, lx, lz, m, sp, x0, z0, t, i, segs }
  climbPitch: 0,             // render-only view tilt while climbing
  stepOff: 0,                // render-only: camera lag when stepping up (height only, no tilt)
  coyote: 0, jumpBuf: 0      // jump grace after walking off an edge / a Space press just before landing
};
const WALK = 4.6, SPRINT = 8.5;   // m/s (was 7 / 16 — felt too fast)
// footstep cadence measured in real life: 133 steps/min walking, 217 running.
// Stride length is solved from that, so it stays right even if WALK/SPRINT change.
const STEP_BPM_WALK = 133, STEP_BPM_RUN = 217;
const STRIDE_W = WALK / (STEP_BPM_WALK / 60), STRIDE_R = SPRINT / (STEP_BPM_RUN / 60);
const strideAt = sp => STRIDE_W + (STRIDE_R - STRIDE_W) * (sp - WALK) / (SPRINT - WALK);
/* hidden stamina: no bar, you only feel it. Sprinting drains it, jumping
   costs a bit, it refills after a short rest (faster when standing still).
   Low stamina smoothly fades in a blue vignette (no pulsing);
   at zero you can't sprint until it's back to 35%, and jumps are weaker. */
const STAM = { drain: 1 / 7, jump: 0.07, regenDelay: 0.9, regenWalk: 1 / 8, regenIdle: 1 / 4.5, recover: 0.35 };
const stam = { v: 1, rest: 0, out: false, fx: 0 };
let tiredAmt = 0;           // blue low-stamina vignette strength, drawn in the post pass
let fadeAmt = 0;            // screen fade to black (area transitions)
const ease = (k, dt) => 1 - Math.exp(-k * dt);   // frame-rate independent smoothing

/* ---- secret: fall through the matrix floor ----
   In the matrix area, look straight down (within 4° of vertical) while
   standing still on the floor, wait more than 1 s without touching any
   other key, then press W on its own: the floor lets you through. You fall
   for a few seconds, the screen fades, and you land in a new place
   (the mausoleum). */
const FALL = { lookTol: 4 * Math.PI / 180, wait: 1, fadeAt: 2.6, switchAt: 3.4, dropHeight: 10,
               accel: 7, maxSpeed: 26 };
// falling through (and dropping into the new place): you start at walking speed
// and gently speed up (accel m/s², up to maxSpeed) — softer than normal gravity
function tryFallThrough() {
  if (player.area !== "matrix" || body.falling || body.fly || body.air) return;
  if (body.downT <= FALL.wait) return;
  for (const k in keys) if (keys[k] && k !== "KeyW") { body.downT = 0; return; }   // W only
  body.falling = true; body.fallT = 0; body.air = true; body.slowFall = true;
  player.vy = -WALK; body.vx = 0; body.vz = 0;
  body.downT = 0;
}
/* ---- mausoleum collision: the same boxes the shader draws (64-bit here) ---- */
const PLAYER_R = 0.245;                  // 30% narrower than the first 0.35
function mausTab(cx, cz, off) {
  const x = (((cx + off[0]) % 256) + 256) % 256, z = (((cz + off[1]) % 256) + 256) % 256;
  const i = (z * 256 + x) * 4;
  return [MAUS_TAB[i] / 255, MAUS_TAB[i + 1] / 255, MAUS_TAB[i + 2] / 255, MAUS_TAB[i + 3] / 255];
}
const fract = v => v - Math.floor(v);
// towers / buildings (40 m cells): 28% of cells hold one. 35% of those are medium
// buildings (square, centred in the cell), the rest towers (offset in the cell).
// Returns { bld, hx, hz, H, px, pz, reach } or null. reach = footprint + everything around
// it at ground level (= nearBig() in the shader).
function mausTower(cx, cz) {
  const P = MAUS.pillar, t = mausTab(cx, cz, P.off);
  if (t[0] >= 0.28) return null;
  const c0x = (cx + 0.5) * P.cell, c0z = (cz + 0.5) * P.cell;
  if (fract(t[3] * 7.7) < 0.35) {                       // medium building
    const h = 6 + 2 * t[1];
    return { t, bld: true, hx: h, hz: h, H: 8 + 2 * t[3], px: c0x, pz: c0z, reach: h + 7.2 };
  }
  const hx = 2.6 + 1.4 * t[1], hz = 2.6 + 1.4 * fract(t[1] * 5.3);
  return { t, bld: false, hx, hz, H: 2 * Math.max(hx, hz) * (1.1 + 0.4 * t[3]),
    px: c0x + (t[2] - 0.5) * 12, pz: c0z + (fract(t[2] * 4.7) - 0.5) * 12, reach: 2.4 };
}
// walls (200 m cells), or null
function mausWall(cx, cz) {
  const W = MAUS.wall, t = mausTab(cx, cz, W.off);
  if (t[0] >= 0.45) return null;
  let hx = 20 + 30 * t[1], hz = 8 + 14 * t[2];
  if (t[3] > 0.5) { const s = hx; hx = hz; hz = s; }
  const H = 40 + 50 * fract(t[3] * 2.9);
  return { t, hx, hz, H, H1: wallLedge(H),
    wx: (cx + 0.5) * W.cell + (fract(t[1] * 3.3) - 0.5) * 60, wz: (cz + 0.5) * W.cell + (fract(t[2] * 6.1) - 0.5) * 60 };
}
// within reach of a tower / building or a wall, plus margins? (= nearBig() in the shader)
function mausNearBig(x, z, mx, mz) {
  const T = mausTower(Math.floor(x / MAUS.pillar.cell), Math.floor(z / MAUS.pillar.cell));
  if (T) {
    const rx = T.bld ? T.reach : T.hx + T.reach, rz = T.bld ? T.reach : T.hz + T.reach;
    if (Math.abs(x - T.px) < rx + mx && Math.abs(z - T.pz) < rz + mz) return true;
  }
  const W = mausWall(Math.floor(x / MAUS.wall.cell), Math.floor(z / MAUS.wall.cell));
  if (W && Math.abs(x - W.wx) < W.hx + 6 + mx && Math.abs(z - W.wz) < W.hz + 6 + mz) return true;
  return false;
}
// small blocks on a REGULAR 2.5 m lattice (cell centres, no jitter), 30% of cells (the
// geometry reference). Footprint must match blockRect() in the shader. Kinds:
// 0 cube (~1 m, flat cap with side tabs), 1 row of 2-3 cube modules, 2 thin standing
// plate, 3 narrow block, 4 double cube (two side by side)
function mausBlock(t) {
  const v = fract(t[2] * 11.7), ax = t[3] > 0.5;
  let hw, hd, h, kind = 0, n = 1, cap = t[3] < 0.85;
  if (v < 0.12) {                                        // module row
    n = 2 + Math.floor(t[1] * 1.999); kind = 1; h = 0.85 + 0.15 * t[2];
    const L = n * 0.4 - 0.02;
    if (ax) { hw = L; hd = 0.38; } else { hw = 0.38; hd = L; }
  } else if (v < 0.24) {                                 // thin plate
    const T = 0.04 + 0.02 * t[1], Dp = 0.35 + 0.15 * fract(t[1] * 7.13);
    h = 0.8 + 0.3 * t[2]; kind = 2; cap = false;
    if (ax) { hw = Dp; hd = T; } else { hw = T; hd = Dp; }
  } else if (v < 0.32) {                                 // double cube
    kind = 4; h = 0.8 + 0.3 * t[2];
    if (ax) { hw = 0.82; hd = 0.4; } else { hw = 0.4; hd = 0.82; }
  } else if (v < 0.40) {                                 // narrow block
    kind = 3; hw = hd = 0.25 + 0.05 * t[1]; h = 1.1 + 0.3 * t[2];
  } else {                                               // cube
    hw = 0.38 + 0.17 * t[1]; hd = Math.min(0.58, hw * (0.85 + 0.3 * fract(t[1] * 7.13))); h = 0.8 + 0.45 * t[2];
  }
  const capI = cap ? { k: 0.78 + 0.07 * fract(t[1] * 2.9), th: 0.1 + 0.03 * fract(t[1] * 6.1), tabs: fract(t[1] * 8.3) < 0.5 } : null;
  const top = h + (capI ? capI.th : 0);
  return { hw, hd, h, ox: 0, oz: 0, kind, n, ax, cap: capI, step: null, top };
}
// the block in 2.5 m cell (cx, cz), placed, or null (none in big-pit cells or near big things)
function mausBlockAt(cx, cz) {
  const B = MAUS.blk, t = mausTab(cx, cz, B.off);
  if (t[0] >= 0.30) return null;
  if (mausHole(Math.floor(cx / 2), Math.floor(cz / 2))) return null;
  const x = (cx + 0.5) * B.cell, z = (cz + 0.5) * B.cell;
  if (mausNearBig(x, z, 1.6, 1.6)) return null;
  const b = mausBlock(t);
  b.X = x; b.Z = z;
  b.seed = Math.floor(t[1] * 251) + 256 * Math.floor(t[2] * 3) + 1024 * (b.kind === 2 ? 2 : b.kind === 1 ? 1 : 0);   // whole number (see shader)
  return b;
}
// big square pit in a 5 m cell, with a rim of cube modules around it (never near big
// things): { x0, x1, z0, z1 } of the HOLE, or null (same rule as bigHole() in the shader)
const HOLE_D = 0.9, PIT_RIM = 0.8;
function mausHole(cx, cz) {
  const t = mausTab(cx, cz, MAUS.peg.off);
  if (t[0] < 0.965) return null;
  const hx = 0.8 + 0.7 * t[1], hz = 0.8 + 0.7 * fract(t[1] * 7.13);
  const x = (cx + 0.5) * 5, z = (cz + 0.5) * 5;
  if (mausNearBig(x, z, hx + PIT_RIM, hz + PIT_RIM)) return null;
  return { x0: x - hx, x1: x + hx, z0: z - hz, z1: z + hz };

/* ---- mausoleum parts: every structure is a list of boxes, emitted by these functions.
   Drawing (mausBuild) and collision (mausSolids) use the SAME parts, at every distance
   (no simpler far versions, so nothing changes shape as you walk closer).
   e(x, y, z, hx, hy, hz, bevel, material, seed): centre (64-bit world), half sizes. */
// a row of cube modules with pillow caps (the reference's recurring edge motif), from a0 to
// a1 along x (alongX) or z, centred on `fix` across, `th` thick, `h` tall, standing at y0
function modRow(e, alongX, a0, a1, fix, y0, th, h, pitch, mat = 16, capMat = 2) {
  const L = a1 - a0, n = Math.max(1, Math.round(L / pitch)), sg = L / n, hb = h - 0.12;
  for (let k = 0; k < n; k++) {
    const a = a0 + sg * (k + 0.5);
    const B = [sg / 2 - 0.025, hb / 2, th / 2], C = [sg / 2 - 0.07, 0.07, th / 2 - 0.06];
    if (alongX) { e(a, y0 + hb / 2, fix, B[0], B[1], B[2], 0.05, mat); e(a, y0 + hb + 0.06, fix, C[0], C[1], C[2], 0.06, capMat); }
    else { e(fix, y0 + hb / 2, a, B[2], B[1], B[0], 0.05, mat); e(fix, y0 + hb + 0.06, a, C[2], C[1], C[0], 0.06, capMat); }
  }
}
// a closed square ring of modules: outer half size (rx, rz)
function modRing(e, cx, cz, rx, rz, y0, th, h, pitch, mat, capMat) {
  for (const s of [-1, 1]) {
    modRow(e, true, cx - rx, cx + rx, cz + s * (rz - th / 2), y0, th, h, pitch, mat, capMat);
    modRow(e, false, cz - rz + th, cz + rz - th, cx + s * (rx - th / 2), y0, th, h, pitch, mat, capMat);

}
// framed square knob on a face with outward normal (nx, nz): a back plate + a square frame
function frameKnob(e, x, y, z, nx, nz, s, mat = 5) {
  const P = (o, a, hy, ha, ho, r, m) => nx ? e(x + nx * o, y + hy, z + a, ho, ha[1], ha[0], r, m) : e(x + a, y + hy, z + nz * o, ha[0], ha[1], ho, r, m);
  P(0.16, 0, 0, [s - 0.06, s - 0.06], 0.16, 0.04, mat);                      // back plate
  P(0.3, 0, s - 0.07, [s, 0.07], 0.3, 0.03, mat); P(0.3, 0, -(s - 0.07), [s, 0.07], 0.3, 0.03, mat);   // frame top / bottom

// a small L of thin plates sticking out of a face (the reference's "chevrons")
function lPlate(e, x, y, z, nx, nz, s, flip) {
  const f = flip ? -1 : 1;
  if (nx) { e(x + nx * s, y, z, s, 0.025, s * 0.9, 0, 5); e(x + nx * s, y + s * 0.8, z + f * s * 0.9, s, s * 0.8, 0.025, 0, 5); }
  else { e(x, y, z + nz * s, s * 0.9, 0.025, s, 0, 5); e(x + f * s * 0.9, y + s * 0.8, z + nz * s, 0.025, s * 0.8, s, 0, 5); }
}
function blockParts(b, e, sink = 0) {
  const X = b.X, Z = b.Z, G = BLOCK_GAP, sd = b.seed, y0 = -sink;
  if (b.kind === 2) { e(X, y0 + b.h * 0.5, Z, b.hw, b.h * 0.5, b.hd, 0.03, 1, sd); return; }   // thin plate
  e(X, y0 + G * 0.5, Z, Math.max(0.04, b.hw - 0.07), G * 0.5, Math.max(0.04, b.hd - 0.07), 0, 1, sd);   // dark inset base

  if (actx) actx.close().catch(() => {});

  for (const k in keys) keys[k] = false;
  if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
  return save ? st : null;
}

/* ================= reveal ================= */
const minShow = shot ? 120 : thumb ? 900 : 300;
const start = performance.now();
(function waitReady() {
  const el = performance.now() - start;
  if (el > minShow) { loader.classList.add("gone"); }
  else setTimeout(waitReady, 50);
})();
return { stop };
} // end boot()
})();
</script>
