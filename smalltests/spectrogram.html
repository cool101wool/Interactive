const HELP = `<b>Big button</b>: tap to start recording from the mic, tap again to stop. Spectrogram: time runs left to right, low frequency at the bottom, high at the top, brighter = louder.
<br><br><b>Trim 0.5s / 1s</b>: removes that much from the start AND the end (to cut the tap sounds). Can be pressed repeatedly; <b>Reset</b> restores the full recording. <b>Play</b> plays (or stops) the current trimmed audio.
<br><br><b>Copy base64</b>: copies the encoded .ogg (Opus audio) as text. Base64 is a way of writing binary file bytes as plain letters/numbers so they can be pasted anywhere. Output is a long text string like T2dnUwAC...
<br><br><b>Square toggle button</b>: red X = plain base64 only. Green tick = the text gets a "data: URI" prefix: <code>data:audio/ogg;base64,T2dnUw...</code>. A URI is just an address/label for a resource; a data: URI embeds the actual file inside that address, so it can be used directly as e.g. an <code>&lt;audio src="..."&gt;</code> or pasted in a browser address bar. Use plain base64 if an API/field expects raw base64, and data: URI if you want something self-contained and playable.
<br><br><b>Copy .ogg file</b>: tries to put the actual file on the clipboard (so you can paste it as a file). Most browsers block audio on the clipboard; if so you'll get a message, so use Share or Download.
<br><br><b>Share</b>: opens the phone/OS share sheet with the file attached. <b>Download</b>: saves the file. <br><br><b>Timestamp</b>: the recording start time is added as recording_YYYYMMDD_HHMMSS.ogg (share/download/file copy), as a name= field in the data: URI, and as DATE/TITLE tags inside the .ogg itself (so it's also in the plain base64).
<br><br><b>Info panel</b>: duration, sample rate (Hz), peak and RMS level in dBFS (0 = digital maximum, more negative = quieter), count of clipped (maxed-out) samples, and the mic settings the browser reports (echo cancellation, noise suppression and auto gain are all turned off for raw audio).
<br><br><b>Format</b>: mono, 48 kHz, Opus codec in an Ogg container, ~64 kbps.`;
$('help').onclick = () => { const h = $('helpbox'); h.innerHTML = HELP; h.style.display = h.style.display === 'none' ? 'block' : 'none'; };
const status = s => $('st').textContent = s;

/* ---------- FFT / spectrogram ---------- */
const win = new Float32Array(N).map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
const cosT = new Float32Array(N / 2), sinT = new Float32Array(N / 2);
for (let i = 0; i < N / 2; i++) { cosT[i] = Math.cos(2 * Math.PI * i / N); sinT[i] = -Math.sin(2 * Math.PI * i / N); }
const rev = new Uint16Array(N);
for (let i = 0; i < N; i++) { let r = 0; for (let b = 0; b < 10; b++) if (i >> b & 1) r |= 1 << (9 - b); rev[i] = r; }
const re = new Float32Array(N), im = new Float32Array(N);

function column(x, off) { // returns Uint8ClampedArray RGBA (H px tall) for samples x[off..off+N)
  for (let i = 0; i < N; i++) { re[rev[i]] = x[off + i] * win[i]; im[rev[i]] = 0; }
  for (let size = 2; size <= N; size <<= 1) {
    const half = size >> 1, step = N / size;
    for (let s = 0; s < N; s += size)
      for (let j = 0, k = 0; j < half; j++, k += step) {
        const a = s + j, b = a + half;
        const tr = re[b] * cosT[k] - im[b] * sinT[k], ti = re[b] * sinT[k] + im[b] * cosT[k];
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
      }
  }
  const out = new Uint8ClampedArray(H * 4), per = (N / 2) / H;
  for (let y = 0; y < H; y++) {
    const bin = Math.floor((H - 1 - y) * per); // low freq at bottom
    let m = 0;
    for (let k = 0; k < per; k++) m = Math.max(m, Math.hypot(re[bin + k], im[bin + k]));
    const db = 20 * Math.log10(m / (N / 4) + 1e-9);
    const t = Math.min(1, Math.max(0, (db + 90) / 80));
    const c = (v) => Math.min(255, Math.max(0, v));
    out[y * 4] = c(t * 510); out[y * 4 + 1] = c(t * 510 - 255); out[y * 4 + 2] = c(t < .5 ? t * 400 : 255 - (t - .5) * 900); out[y * 4 + 3] = 255;
  }
  return out;
}
function renderStatic(x) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (x.length < N) return;
  const cols = Math.floor((x.length - N) / HOP) + 1;
  const off = document.createElement('canvas'); off.width = cols; off.height = H;
  const oc = off.getContext('2d'), img = oc.createImageData(cols, H);
  for (let c = 0; c < cols; c++) {
    const col = column(x, c * HOP);
    for (let y = 0; y < H; y++) img.data.set(col.subarray(y * 4, y * 4 + 4), (y * cols + c) * 4);
  }
  oc.putImageData(img, 0, 0);
  g.drawImage(off, 0, 0, cols, H, 0, 0, W, H);
}

/* ---------- recording ---------- */
let ctx, stream, node, chunks = [], tail = new Float32Array(0), recording = false, t0, timer;
let recStamp = '', orig = null, cur = null, rate = 48000, encPromise = null, settings = {};

const workletSrc = `class R extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(2048);this.n=0}
process(i){const c=i[0][0];if(c){for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];if(this.n==2048){this.port.postMessage(this.b.slice());this.n=0}}}return true}}
registerProcessor('r',R)`;

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  } catch (e) { status('Mic error: ' + e.message); return; }
  settings = stream.getAudioTracks()[0].getSettings();
  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  await ctx.resume();
  rate = ctx.sampleRate;
  const url = URL.createObjectURL(new Blob([workletSrc], { type: 'text/javascript' }));
  await ctx.audioWorklet.addModule(url);
  node = new AudioWorkletNode(ctx, 'r');
  chunks = []; tail = new Float32Array(0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  node.port.onmessage = e => { chunks.push(e.data); live(e.data); };
  const src = ctx.createMediaStreamSource(stream), mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  recording = true; t0 = Date.now();
  { const d = new Date(t0), p = n => String(n).padStart(2, '0'); recStamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); }
  $('rec').textContent = 'Recording… tap to stop';
  timer = setInterval(() => status('Recording ' + ((Date.now() - t0) / 1000).toFixed(1) + 's'), 100);
}

function live(chunk) {
  const t = new Float32Array(tail.length + chunk.length); t.set(tail); t.set(chunk, tail.length); tail = t;
  while (tail.length >= N) {
    const col = column(tail, 0);
    g.drawImage(cv, -1, 0);
    const img = g.createImageData(1, H); img.data.set(col); g.putImageData(img, W - 1, 0);
    tail = tail.slice(HOP);
  }
}

async function stop() {
  recording = false; clearInterval(timer);
  stream.getTracks().forEach(t => t.stop());
  node.disconnect(); await ctx.close();
  $('rec').textContent = 'Tap to start';
  const len = chunks.reduce((a, c) => a + c.length, 0);
  orig = new Float32Array(len); let p = 0;
  for (const c of chunks) { orig.set(c, p); p += c.length; }
  cur = orig; refresh();
}

$('rec').onclick = () => recording ? stop() : start();

/* ---------- trim / info ---------- */
document.querySelectorAll('.t').forEach(b => b.onclick = () => {
  if (!cur) return;
  const n = Math.round(parseFloat(b.dataset.s) * rate);
  if (cur.length <= 2 * n + N) { status('Too short to trim that much'); return; }
  cur = cur.subarray(n, cur.length - n); refresh();
});
$('reset').onclick = () => { if (orig) { cur = orig; refresh(); } };

function refresh() {
  renderStatic(cur);
  let peak = 0, sum = 0, clip = 0;
  for (let i = 0; i < cur.length; i++) { const a = Math.abs(cur[i]); if (a > peak) peak = a; if (a >= 0.999) clip++; sum += cur[i] * cur[i]; }
  const db = v => v > 0 ? (20 * Math.log10(v)).toFixed(1) + ' dBFS' : '-inf';
  $('info').textContent =
    `duration: ${(cur.length / rate).toFixed(2)}s (original ${(orig.length / rate).toFixed(2)}s)\n` +
    `samples: ${cur.length}  rate: ${rate} Hz\n` +
    `peak: ${db(peak)}  rms: ${db(Math.sqrt(sum / cur.length))}  clipped: ${clip}\n` +
    `track: ${JSON.stringify(settings)}`;
  encPromise = encodeOgg(cur, rate); // cached so clipboard calls stay inside the tap gesture
  encPromise.then(b => status('Ready: ogg/opus ' + (b.size / 1024).toFixed(1) + ' KB'), e => status('Encode error: ' + e.message));
  status('Encoding…');
}

/* ---------- play ---------- */
let pctx;
$('play').onclick = async () => {
  if (!cur) return;
  if (pctx) { pctx.close(); pctx = null; return; }
  pctx = new AudioContext();
  const buf = pctx.createBuffer(1, cur.length, rate); buf.copyToChannel(cur, 0);
  const s = pctx.createBufferSource(); s.buffer = buf; s.connect(pctx.destination);
  const me = pctx; s.onended = () => { if (pctx === me) { me.close(); pctx = null; } };
  s.start();
};

/* ---------- Ogg/Opus encoding (WebCodecs + manual muxer) ---------- */
const crcT = new Uint32Array(256);
for (let i = 0; i < 256; i++) { let r = i << 24; for (let k = 0; k < 8; k++) r = (r & 0x80000000) ? (r << 1) ^ 0x04C11DB7 : r << 1; crcT[i] = r >>> 0; }
function crc(b) { let c = 0; for (let i = 0; i < b.length; i++) c = ((c << 8) ^ crcT[((c >>> 24) ^ b[i]) & 255]) >>> 0; return c; }

function makePage(packets, granule, seq, type, serial) {
  const segs = [];
  packets.forEach(p => { let n = p.length; while (n >= 255) { segs.push(255); n -= 255; } segs.push(n); });
  const dataLen = packets.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(27 + segs.length + dataLen), dv = new DataView(out.buffer);
  out.set([0x4f, 0x67, 0x67, 0x53, 0, type]);
  dv.setUint32(6, granule % 4294967296, true); dv.setUint32(10, Math.floor(granule / 4294967296), true);
  dv.setUint32(14, serial, true); dv.setUint32(18, seq, true);
  out[26] = segs.length; out.set(segs, 27);
  let o = 27 + segs.length; packets.forEach(p => { out.set(p, o); o += p.length; });
  dv.setUint32(22, crc(out), true);
  return out;
}

async function encodeOgg(pcm, inRate) {
  if (typeof AudioEncoder === 'undefined') throw new Error('WebCodecs AudioEncoder not supported in this browser');
  if (inRate !== 48000) { // resample
    const oc = new OfflineAudioContext(1, Math.ceil(pcm.length * 48000 / inRate), 48000);
    const b = oc.createBuffer(1, pcm.length, inRate); b.copyToChannel(pcm, 0);
    const s = oc.createBufferSource(); s.buffer = b; s.connect(oc.destination); s.start();
    pcm = (await oc.startRendering()).getChannelData(0);
  }
  const packets = []; let preskip = 312, err = null;
  const enc = new AudioEncoder({
    output: (c, meta) => {
      const d = new Uint8Array(c.byteLength); c.copyTo(d);
      packets.push({ d, dur: Math.round((c.duration || 20000) * 48 / 1000) });
      const desc = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (desc && packets.length === 1) {
        const u = new Uint8Array(desc instanceof ArrayBuffer ? desc : desc.buffer);
        if (u.length >= 12 && u[0] === 0x4f) preskip = u[10] | (u[11] << 8);
      }
    },
    error: e => err = e
  });
  enc.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 1, bitrate: 64000 });
  const F = 960;
  for (let i = 0; i < pcm.length; i += F) {
    const part = pcm.slice(i, i + F);
    enc.encode(new AudioData({ format: 'f32', sampleRate: 48000, numberOfFrames: part.length, numberOfChannels: 1, timestamp: Math.round(i / 48000 * 1e6), data: part }));
    if (enc.encodeQueueSize > 50) await new Promise(r => setTimeout(r, 0));
  }
  await enc.flush(); enc.close();
  if (err) throw err;

  const te = new TextEncoder(), serial = (Math.random() * 4294967295) >>> 0;
  const head = new Uint8Array(19), hv = new DataView(head.buffer);
  head.set(te.encode('OpusHead')); head[8] = 1; head[9] = 1; hv.setUint16(10, preskip, true); hv.setUint32(12, 48000, true);
  const vendor = te.encode('web-spectrogram');
  const iso = recStamp.replace(/^(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)$/, '$1-$2-$3T$4:$5:$6');
  const cm = [te.encode('DATE=' + iso), te.encode('TITLE=' + fname())];
  const tags = new Uint8Array(8 + 4 + vendor.length + 4 + cm.reduce((a, c) => a + 4 + c.length, 0)), tv = new DataView(tags.buffer);
  tags.set(te.encode('OpusTags')); tv.setUint32(8, vendor.length, true); tags.set(vendor, 12);
  let to = 12 + vendor.length; tv.setUint32(to, cm.length, true); to += 4;
  cm.forEach(c => { tv.setUint32(to, c.length, true); tags.set(c, to + 4); to += 4 + c.length; });
  const pages = [makePage([head], 0, 0, 2, serial), makePage([tags], 0, 1, 0, serial)];
  let seq = 2, cum = 0, batch = [], segCount = 0;
  const flushBatch = last => {
    pages.push(makePage(batch.map(x => x.d), last ? preskip + pcm.length : preskip + cum, seq++, last ? 4 : 0, serial));
    batch = []; segCount = 0;
  };
  packets.forEach((p, i) => {
    const s = Math.floor(p.d.length / 255) + 1;
    if (segCount + s > 250) flushBatch(false);
    batch.push(p); segCount += s; cum += p.dur;
    if (i === packets.length - 1) flushBatch(true);
  });
  return new Blob(pages, { type: 'audio/ogg' });
}

/* ---------- output ---------- */
const fname = () => 'recording_' + (recStamp || 'unknown') + '.ogg';
const getBlob = () => { if (!encPromise) throw new Error('Nothing recorded yet'); return encPromise; };
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });

$('cb').onclick = async () => {
  try {
    const p = getBlob().then(async b => {
      const uri = await toB64(b);
      return new Blob([useUri ? uri.replace(';base64,', ';name=' + fname() + ';base64,') : uri.slice(uri.indexOf(',') + 1)], { type: 'text/plain' });
    });
    try { await navigator.clipboard.write([new ClipboardItem({ 'text/plain': p })]); }
    catch (e) { await navigator.clipboard.writeText(await (await p).text()); }
    status('Base64 copied');
  } catch (e) { status('Copy failed: ' + e.message); }
};

const file = async () => new File([await getBlob()], fname(), { type: 'audio/ogg' });
async function share() {
  const f = await file();
  if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return true; }
  return false;
}
function download(f) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = fname(); a.click();
}

$('cf').onclick = async () => {
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'audio/ogg': getBlob() })]);
    status('.ogg file copied to clipboard');
  } catch (e) {
    status('Browser can\'t put audio/ogg on the clipboard (' + e.message + '). Use Copy base64, Share or Download.');
  }
};
$('sh').onclick = async () => {
  try { if (!(await share())) status('Share with files not supported here'); else status('Shared'); }
  catch (e) { status('Share: ' + e.message); }
};
$('dl').onclick = async () => { try { download(await file()); } catch (e) { status(e.message); } };
</script>
</body>
</html>
