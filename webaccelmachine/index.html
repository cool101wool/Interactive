<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WebAccel Machine</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  /* touch-action:none hands every gesture to the canvas: without it the
     browser claims drags for scrolling and pinches for page zoom, and the app
     sees a stroke that stops dead partway. */
  canvas{display:block;image-rendering:pixelated;cursor:default;touch-action:none}
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
</style>
</head>
<body>
<canvas id="app"></canvas>
<script>
"use strict";
/* ===========================================================================
   CELL MODEL
   Internal byte per cell: (type << 2) | rotation.
   Rotation 0=Right 1=Down 2=Left 3=Up (screen coords, +y down) — this matches
   the level-code convention exactly, so no remapping on import.
   =========================================================================== */
const T_EMPTY=0,T_PUSH=1,T_SLIDE=2,T_WALL=3,T_MOVER=4,T_GEN=5,T_CW=6,T_CCW=7,
      T_ENEMY=8,T_TRASH=9,T_BORDER=10;
const mk=(t,r)=>((t<<2)|r), ty=c=>c>>2, rt=c=>c&3;

// level-code id -> internal type. ids: 0 gen,1 CW,2 CCW,3 mover,4 slide,
// 5 push,6 wall,7 enemy,8 trash,9 empty
const CM_TO_T=[T_GEN,T_CW,T_CCW,T_MOVER,T_SLIDE,T_PUSH,T_WALL,T_ENEMY,T_TRASH,T_EMPTY];
const T_TO_CM={};CM_TO_T.forEach((t,i)=>{if(!(t in T_TO_CM))T_TO_CM[t]=i;});

const DIR_ORDER=[0,2,3,1];              // Right, Left, Up, Down
const descending=d=>d===0||d===1;       // front-first is high→low index for R and D

/* ===========================================================================
   ENGINE
   10 subticks/tick: Gen R,L,U,D · CW · CCW · Mover R,L,U,D.
   Each has its own occupancy bitmap plus an L1 summary (1 bit per 32-cell
   word), so a pass visits only its own actors and skips empty space in
   1024-cell strides. Bitmaps are maintained incrementally in setCell().

   Push chains are skipped rather than walked. Most cells in a chain are
   TRANSPARENT to the scan — push cells, generators, rotators and aligned
   slides neither stop it nor change its force. Only empty/wall/border/trash/
   enemy/mover/misaligned-slide are OPAQUE, and two extra bitmaps let the scan
   jump opaque-to-opaque. obits[0] is row-major (horizontal pushes), obits[1]
   is transposed (vertical), because slide alignment is axis-dependent.
   Short chains still step directly — consulting the bitmap costs more than a
   couple of byte reads, so it only pays once a chain proves long.
   =========================================================================== */
const NBUCKET=10;

// Per-cell-byte lookup tables: a cell is only (type<<2)|rot, so every property
// the hot loop needs is a table read instead of a switch.
const TBL_BUCKET=new Int8Array(256), TBL_OPQ=new Uint8Array(256);
(function(){
  const bucket=c=>{
    switch(c>>2){
      case T_GEN: return c&3;
      case T_CW: return 4;
      case T_CCW: return 5;
      case T_MOVER: return 6+(c&3);
      default: return -1;
    }
  };
  const opaque=(c,axis)=>{
    switch(c>>2){
      case T_PUSH: case T_GEN: case T_CW: case T_CCW: return false;
      case T_SLIDE: return ((c&3)&1)!==axis;
      default: return true;
    }
  };
  for(let v=0;v<256;v++){
    TBL_BUCKET[v]=bucket(v);
    TBL_OPQ[v]=(opaque(v,0)?1:0)|(opaque(v,1)?2:0);
  }
})();

// nearest opaque cell at/after and at/before p, in bitmap B's index space
function opaqueFwd(B,p){
  let w=p>>5, m=B[w]&((0xFFFFFFFF<<(p&31))>>>0);
  while(m===0) m=B[++w];
  return (w<<5)|(31-Math.clz32(m&-m));
}
function opaqueBwd(B,p){
  let w=p>>5; const b=p&31;
  let m=B[w]&(b===31?0xFFFFFFFF:((1<<(b+1))-1));
  while(m===0) m=B[--w];
  return (w<<5)|(31-Math.clz32(m));
}

/* A backstop, not the main defence -- the viewport clip in push() is what keeps
   the cost sane. Tracking a screenful of an exploding board peaks around 95,000
   moves a tick and costs about 14% on top of the simulation, so this sits well
   clear of that: it only trips if you zoom out far enough that a single screen
   covers a vast amount of movement, and at that zoom a cell shifts a pixel or
   two and there is nothing to see anyway. */
const MOTION_CAP=200000;
class World{
  constructor(w,h){
    // Same reasoning as the importer: indices must fit a signed 32-bit int.
    if((w+2)*(h+2)>=2**31)
      throw new Error(`board too big to index: ${w}x${h}`);
    // counted so the UI can voice what the simulation did this tick
    this.evCreate=0; this.evDestroy=0;
    // Motion tracking for render interpolation: destination index -> the index
    // the cell occupied when the tick began. Off unless the renderer asks, so a
    // fast-forwarding board pays nothing for it.
    this.rev=0;                      // bumped on every real change
    // One bit per non-empty cell. The renderer walks these instead of reading
    // every slot in view, which is what made a big sparse board crawl.
    this.occ=null;
    this.trackMotion=false; this.motion=new Map(); this.moved=0; this.movedLast=0;
    // Visible window in interior row/column indices; -1 means "no clipping".
    this.winR0=-1; this.winR1=-1; this.winC0=-1; this.winC1=-1;
    this.movedVis=0; this.movedVisLast=0;
    this.rotFrom=new Map();          // index -> rotation when the tick began
    this.W=w; this.H=h; this.stride=w+2; this.strideT=h+2;
    this.size=this.stride*this.strideT;
    this.off=[1,this.stride,-1,-this.stride];
    this.g=new Uint8Array(this.size).fill(mk(T_BORDER,0));
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) this.g[this.idx(x,y)]=0;
    this.nwords=(this.size+31)>>5; this.nsum=(this.nwords+31)>>5;
    this.bits=[]; this.sum=[];
    for(let b=0;b<NBUCKET;b++){
      this.bits.push(new Uint32Array(this.nwords));
      this.sum.push(new Uint32Array(this.nsum));
    }
    // The transposed index used to be two Int32 lookup tables -- 8 bytes per
    // cell, four fifths of the engine's memory. Computed instead: a divide is
    // cheaper than 8 bytes x however many million cells, and it is only reached
    // on a vertical push scan.
    // Everything starts BORDER or EMPTY, both opaque. Bits past `size` stay set
    // too: a forward scan must always terminate, and an over-set bit is safe
    // (the border stops us first) whereas an under-set one would run off the end.
    /* obits[1] is transposed so vertical pushes can scan a column contiguously.
       That makes it useless for a horizontal shift, where a row's cells are
       strided through it. opqR1 is the same information in row-major order,
       kept purely so a row shift can find the handful of positions where
       opacity changes with word operations instead of walking every cell. */
    this.opqR1=new Uint32Array(this.nwords).fill(0xFFFFFFFF);
    this.obits=[new Uint32Array(this.nwords).fill(0xFFFFFFFF),
                new Uint32Array(this.nwords).fill(0xFFFFFFFF)];
    this.occ=new Uint32Array(this.nwords);
  }
  idx(x,y){return (y+1)*this.stride+(x+1);}
  toT(i){ const y=(i/this.stride)|0; return (i-y*this.stride)*this.strideT+y; }
  fromT(t){ const x=(t/this.strideT)|0; return (t-x*this.strideT)*this.stride+x; }
  clearMotion(){
    this.motionOver=false; this.motion.clear(); this.rotFrom.clear(); }

  static bucketOf(c){ return TBL_BUCKET[c]; }
  bitSet(b,i){
    const w=i>>5, arr=this.bits[b], v0=arr[w];
    arr[w]=v0|(1<<(i&31));
    if(v0===0) this.sum[b][w>>5]|=(1<<(w&31));
  }
  bitClear(b,i){
    const w=i>>5;
    const v=this.bits[b][w]&~(1<<(i&31));
    this.bits[b][w]=v;
    if(v===0) this.sum[b][w>>5]&=~(1<<(w&31));
  }
  /* Shifting a chain was one setCell per cell, and setCell is a method call
     that re-reads this.g, this.bits and this.sum every time. On a dense board
     these chains run to hundreds of cells and dominate everything else. This is
     the same work with every lookup hoisted out of the loop.

     (Batching the bucket bits a machine word at a time was also tried. It only
     helps horizontal chains, which are a third of the moves here, and measured
     no faster than this -- so it is not worth the extra code.) */
  shiftChain(i,k,o){
    if(k===i){ this.setCell(i,0); return; }
    this.rev++;
    if(o===1||o===-1) this.shiftRow(i,k,o); else this.shiftCol(i,k,o);
    this.setCell(i,0);
  }
  /* A horizontal chain is contiguous in memory, so the grid moves with a single
     memmove and every bitmap indexed by cell position shifts a machine word at
     a time rather than a bit at a time -- a 400-cell chain goes from roughly
     4800 operations to under 200.

     The transposed opacity bitmap is the exception: a row's cells are strided
     through it, so it cannot shift with the row. It gets fixed up at only the
     positions where opacity actually changes, which on a dense board is almost
     nowhere. */
  shiftRow(i,k,o){
    const g=this.g, up=(o===1);
    const lo=up?i+1:k, hi=up?k:i-1;
    /* Where does vertical opacity actually change? Exactly where the row-major
       copy differs from itself shifted by one. Compute that a word at a time
       and touch the transposed bitmap only at those bits -- on a dense board
       there are usually none at all. */
    const R=this.opqR1, opq1=this.obits[1];
    const wlo=lo>>5, whi=hi>>5, n=R.length;
    for(let w=wlo;w<=whi;w++){
      const a=(w===wlo?lo:(w<<5))&31, b=(w===whi?hi:((w<<5)|31))&31;
      const mask=((((0xFFFFFFFF<<a)>>>0)&(b===31?0xFFFFFFFF:(((1<<(b+1))-1)>>>0)))>>>0);
      const cur=R[w];
      const src=up ? ((((cur<<1)>>>0)|(w>0?(R[w-1]>>>31):0))>>>0)
                   : (((cur>>>1)|(((w+1<n?R[w+1]:0)&1)<<31))>>>0);
      let diff=((cur^src)&mask)>>>0;
      while(diff!==0){
        const bb=31-Math.clz32(diff&-diff);
        diff&=diff-1;
        const p=(w<<5)|bb, t=this.toT(p);
        opq1[t>>5]^=(1<<(t&31));
      }
    }
    if(up) g.copyWithin(i+1,i,k); else g.copyWithin(k,k+1,i+1);
    const bits=this.bits, sum=this.sum;
    for(let b=0;b<10;b++) this.shiftBits(bits[b],sum[b],lo,hi,up);
    this.shiftBits(this.occ,null,lo,hi,up);
    this.shiftBits(this.obits[0],null,lo,hi,up);
    this.shiftBits(R,null,lo,hi,up);
  }
  // bit p <- bit p-1 (up) or bit p+1 (down) for p in [lo,hi]; bits outside the
  // range are untouched. S is the per-word summary bitmap, or null.
  shiftBits(B,S,lo,hi,up){
    const wlo=lo>>5, whi=hi>>5, n=B.length;
    if(up){
      for(let w=whi;w>=wlo;w--){
        const a=(w===wlo?lo:(w<<5))&31, b=(w===whi?hi:((w<<5)|31))&31;
        const mask=((((0xFFFFFFFF<<a)>>>0)&(b===31?0xFFFFFFFF:(((1<<(b+1))-1)>>>0)))>>>0);
        const old=B[w];
        const shifted=((((old<<1)>>>0)|(w>0?(B[w-1]>>>31):0))>>>0);
        const nw=((((old&~mask)>>>0)|(shifted&mask))>>>0);
        if(nw!==old){
          B[w]=nw;
          if(S!==null&&((old===0)!==(nw===0))){
            if(nw===0) S[w>>5]&=~(1<<(w&31)); else S[w>>5]|=(1<<(w&31));
          }
        }
      }
    }else{
      for(let w=wlo;w<=whi;w++){
        const a=(w===wlo?lo:(w<<5))&31, b=(w===whi?hi:((w<<5)|31))&31;
        const mask=((((0xFFFFFFFF<<a)>>>0)&(b===31?0xFFFFFFFF:(((1<<(b+1))-1)>>>0)))>>>0);
        const old=B[w];
        const shifted=(((old>>>1)|(((w+1<n?B[w+1]:0)&1)<<31))>>>0);
        const nw=((((old&~mask)>>>0)|(shifted&mask))>>>0);
        if(nw!==old){
          B[w]=nw;
          if(S!==null&&((old===0)!==(nw===0))){
            if(nw===0) S[w>>5]&=~(1<<(w&31)); else S[w>>5]|=(1<<(w&31));
          }
        }
      }
    }
  }
  // A vertical chain steps by the row stride, so each cell lands in its own
  // word and there is nothing to batch.
  shiftCol(i,k,o){
    const g=this.g, bits=this.bits, sum=this.sum, occ=this.occ;
    const opq0=this.obits[0], opq1=this.obits[1];
    for(let p=k;p!==i;p-=o){
      const oldv=g[p], nv=g[p-o];
      if(oldv===nv) continue;
      g[p]=nv;
      const w=p>>5, bit=1<<(p&31);
      if(((oldv>>2)===T_EMPTY)!==((nv>>2)===T_EMPTY)) occ[w]^=bit;
      const ob=TBL_BUCKET[oldv], nb=TBL_BUCKET[nv];
      if(ob!==nb){
        if(ob>=0){ const arr=bits[ob], v=arr[w]&~bit; arr[w]=v;
                   if(v===0) sum[ob][w>>5]&=~(1<<(w&31)); }
        if(nb>=0){ const arr=bits[nb], v0=arr[w]; arr[w]=v0|bit;
                   if(v0===0) sum[nb][w>>5]|=(1<<(w&31)); }
      }
      const dop=TBL_OPQ[oldv]^TBL_OPQ[nv];
      if(dop){
        if(dop&1) opq0[w]^=bit;
        if(dop&2){ const t=this.toT(p); opq1[t>>5]^=(1<<(t&31));
                   this.opqR1[w]^=bit; }
      }
    }
  }
  setCell(i,c){
    const o=this.g[i];
    if(o===c) return;
    this.rev++;
    if(((o>>2)===T_EMPTY)!==((c>>2)===T_EMPTY)) this.occ[i>>5]^=(1<<(i&31));
    this.g[i]=c;
    // when the bucket is unchanged the bit at i is already right -- skip both ops
    const ob=TBL_BUCKET[o], nb=TBL_BUCKET[c];
    if(ob!==nb){ if(ob>=0) this.bitClear(ob,i); if(nb>=0) this.bitSet(nb,i); }
    const dop=TBL_OPQ[o]^TBL_OPQ[c];
    if(dop){
      if(dop&1) this.obits[0][i>>5]^=(1<<(i&31));
      if(dop&2){ const t=this.toT(i); this.obits[1][t>>5]^=(1<<(t&31));
                 this.opqR1[i>>5]^=(1<<(i&31)); }
    }
  }
  place(x,y,c){this.setCell(this.idx(x,y),c);}

  /* Rotators only change a neighbour's rotation, never its type, so most of
     setCell's work is provably unnecessary: opacity can only move for a slide
     (whose axis flips) and the bucket only for a generator or mover. */
  rotateCell(n,delta){
    const c=this.g[n], t=c>>2;
    if(t===T_EMPTY||t===T_BORDER) return;
    const r=c&3, nr=(r+delta)&3;
    this.rev++;
    if(this.trackMotion&&!this.rotFrom.has(n)) this.rotFrom.set(n,r);
    this.g[n]=mk(t,nr);
    if(t===T_GEN){ this.bitClear(r,n); this.bitSet(nr,n); }
    else if(t===T_MOVER){ this.bitClear(6+r,n); this.bitSet(6+nr,n); }
    else if(t===T_SLIDE){       // delta is odd, so the axis always flips
      this.obits[0][n>>5]^=(1<<(n&31));
      const tt=this.toT(n); this.obits[1][tt>>5]^=(1<<(tt&31));
      this.opqR1[n>>5]^=(1<<(n&31));
    }
  }

  /* Walk the chain from i in direction d and shift it forward one cell.
     `force` is the strength already committed by the initiator. */
  push(i,d,force){
    const g=this.g, o=this.off[d], opp=d^2;
    const axis=d&1, omask=1<<axis, fwd=(d===0||d===1);
    let j=i;
    for(;;){
      let c=g[j];
      // Skip transparent cells. Short chains dominate, so step the first few
      // directly; only once a chain proves long is the bitmap jump worth it.
      if(!(TBL_OPQ[c]&omask)){
        j+=o; c=g[j];
        if(!(TBL_OPQ[c]&omask)){
          j+=o; c=g[j];
          if(!(TBL_OPQ[c]&omask)){
            if(axis===0) j=fwd?opaqueFwd(this.obits[0],j):opaqueBwd(this.obits[0],j);
            else{
              let t=this.toT(j);
              t=fwd?opaqueFwd(this.obits[1],t):opaqueBwd(this.obits[1],t);
              j=this.fromT(t);
            }
            c=g[j];
          }
        }
      }
      const t=c>>2;
      if(t===T_EMPTY||t===T_TRASH||t===T_ENEMY) break;
      if(t===T_WALL||t===T_BORDER) return false;
      if(t===T_SLIDE){ if((((c&3)^d)&1)!==0) return false; }
      else if(t===T_MOVER){
        const r=c&3;
        if(r===d) force++;
        else if(r===opp){ if(--force<=0) return false; }
      }
      j+=o;
    }
    const endt=g[j]>>2;
    let k=j;
    if(endt!==T_EMPTY){
      this.evDestroy++;
      if(j===i){                      // nothing in the chain: the incoming cell is eaten
        if(endt===T_ENEMY) this.setCell(i,0);
        return false;
      }
      if(endt===T_ENEMY) this.setCell(j,0);
      k=j-o;
      if(k===i){ this.setCell(i,0); return true; }
    }
    /* Interpolation records where every moved cell came from -- a Map insert
       and delete per cell. A generator nuke moves tens of millions of cells in
       a tick, and doing that for all of them cost more than the simulation.

       But a cell you cannot see does not need interpolating, so the work is
       clipped to the visible window instead. A chain is a straight line, so the
       part of it that is on screen is a contiguous run: clip once, up front,
       and skip the whole chain when it misses the window entirely. The cost
       then follows the size of the viewport rather than the size of the
       explosion, which is what stops it falling off a cliff. */
    if(this.trackMotion){
      let a=k, b=i+o;                       // the run of destinations, k first
      const r0=this.winR0;
      if(r0>=0){
        const st=this.stride;
        if(o===1||o===-1){
          const row=(i/st)|0;
          if(row<r0||row>this.winR1) a=b=0;   // whole chain off screen
          else{
            const lo=row*st+this.winC0, hi=row*st+this.winC1;
            /* Clamp by the direction of travel, not by comparing the two ends:
               a one-cell chain has a===b, and comparing them then picked the
               wrong branch and let chains far off screen through. */
            if(o>0){ if(a>hi)a=hi; if(b<lo)b=lo; }
            else   { if(a<lo)a=lo; if(b>hi)b=hi; }
          }
        }else{
          const col=i-(((i/st)|0)*st);
          if(col<this.winC0||col>this.winC1) a=b=0;
          else{
            const lo=this.winR0*st+col, hi=this.winR1*st+col;
            if(o>0){ if(a>hi)a=hi; if(b<lo)b=lo; }
            else   { if(a<lo)a=lo; if(b>hi)b=hi; }
          }
        }
      }
      if(a!==b||a!==0){
        const n=(a-b)/o;
        if(n>=0){
          this.movedVis+=n+1;
          if(this.movedVis>=MOTION_CAP){ this.trackMotion=false; this.motionOver=true; }
          else for(let q=a;q!==b-o;q-=o){
            const src=this.motion.get(q-o);          // compose repeated moves
            this.motion.set(q,src===undefined?q-o:src);
            this.motion.delete(q-o);
            const rf=this.rotFrom.get(q-o);          // ...and carry the rotation with it
            if(rf!==undefined){ this.rotFrom.set(q,rf); this.rotFrom.delete(q-o); }
            else this.rotFrom.delete(q);
          }
        }
      }
    }
    this.moved+=(k-i)/o;
    this.shiftChain(i,k,o);
    return true;
  }

  actGen(i,d){
    const o=this.off[d], src=this.g[i-o], st=src>>2;
    if(st===T_EMPTY||st===T_BORDER) return;
    const t=i+o;
    if((this.g[t]>>2)===T_BORDER) return;
    if(this.push(t,d,1)){
      // a freshly generated cell has no history: drop anything stale at this slot
      if(this.trackMotion){ this.motion.delete(t); this.rotFrom.delete(t); }
      this.setCell(t,src); this.evCreate++;
    }
  }
  actRot(i,delta){
    this.rotateCell(i+this.off[0],delta); this.rotateCell(i+this.off[1],delta);
    this.rotateCell(i+this.off[2],delta); this.rotateCell(i+this.off[3],delta);
  }
  dispatch(b,i){
    if(b<4) this.actGen(i,b);
    else if(b===4) this.actRot(i,1);
    else if(b===5) this.actRot(i,3);
    else this.push(i,b-6,0);
  }

  /* Bitmap sweep. Words are re-read after every action so the scan sees the
     live grid, matching a naive linear scan without any snapshot copy. */
  sweep(b,desc){
    const bits=this.bits[b], sum=this.sum[b];
    if(desc){
      for(let sw=this.nsum-1;sw>=0;sw--){
        let s=sum[sw];
        while(s!==0){
          const sb=31-Math.clz32(s), w=(sw<<5)|sb;
          let m=bits[w];
          while(m!==0){
            const bb=31-Math.clz32(m);
            this.dispatch(b,(w<<5)|bb);
            m=bits[w]&(bb===0?0:(0xFFFFFFFF>>>(32-bb)));
          }
          s=sum[sw]&(sb===0?0:(0xFFFFFFFF>>>(32-sb)));
        }
      }
    }else{
      for(let sw=0;sw<this.nsum;sw++){
        let s=sum[sw];
        while(s!==0){
          const sb=31-Math.clz32(s&-s), w=(sw<<5)|sb;
          let m=bits[w];
          while(m!==0){
            const bb=31-Math.clz32(m&-m);
            this.dispatch(b,(w<<5)|bb);
            m=bits[w]&(bb===31?0:((0xFFFFFFFF<<(bb+1))>>>0));
          }
          s=sum[sw]&(sb===31?0:((0xFFFFFFFF<<(sb+1))>>>0));
        }
      }
    }
  }
  /* x0..x1, y0..y1 are cell coordinates; pass no arguments to track everywhere.
     Called once a frame from the camera, so tracking follows what is on screen. */
  setMotionWindow(x0,y0,x1,y1){
    if(x0===undefined){ this.winR0=-1; return; }
    const st=this.stride;
    this.winR0=Math.max(1,y0+1); this.winR1=Math.min(this.H,y1+1);
    this.winC0=Math.max(1,x0+1); this.winC1=Math.min(this.W,x1+1);
    if(this.winR1<this.winR0||this.winC1<this.winC0){ this.winR0=1; this.winR1=0; }
  }
  tick(){
    this.moved=0; this.movedVis=0;
    for(let k=0;k<4;k++){const d=DIR_ORDER[k]; this.sweep(d,descending(d));}
    this.sweep(4,false);
    this.sweep(5,false);
    for(let k=0;k<4;k++){const d=DIR_ORDER[k]; this.sweep(6+d,descending(d));}
    this.movedLast=this.moved; this.movedVisLast=this.movedVis;
  }
}

/* ===========================================================================
   LEVEL CODE IMPORTER  (V1 / V2 / V3)

   V1;w;h;placeables;cells;name;wallEffect
       decimal. placeables "x.y", cells "id.rot.x.y", comma separated.
   V2;w;h;cellData;tutorial;name;wallEffect
       base74, one char per cell row-major, run-length escapes:
         X)N     X repeated N+1 times      X(NNN)  same, multi-char count
   V3;w;h;cellData;tutorial;name;wallEffect
       as V2 but LZ-style BACK-REFERENCES into the text decoded so far:
         )OD     copy D chars from O+1 back
         (OOO)D  multi-char offset         (OOO(DDD)  multi-char offset+distance

   Char value: id*2 + rot*18 + placeable, or 72+placeable for empty.

   NOTE: the common Python reference implementation computes the row as
   `i // height`, which silently corrupts every non-square level. Correct is
   `i / width`, used here.

   ORIGIN: cell index 0 is the BOTTOM-left of the level as the game draws it —
   the stored grid is y-up. Verified against a Mystic Mod screenshot of a known
   15x13 level. Decoding top-down reverses every row and, worse, silently
   inverts vertical movement, because rotation 1 means "down the screen" while
   an un-flipped grid has +y going up. So rows are flipped on import and the
   engine works in screen coordinates with +y down, which is what the rotation
   constants already assume.
   =========================================================================== */
const B74="0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!$%&+-.=?^{}";
function b74(s){
  if(s==="") throw new Error("empty base74 number");
  let r=0;
  for(const ch of s){
    const v=B74.indexOf(ch);
    if(v<0) throw new Error(`invalid base74 character '${ch}'`);
    r=r*74+v;
  }
  return r;
}

function importCode(code,flip=true){
  const f=code.trim().split(";");
  if(f.length<6) throw new Error("not enough ';' fields — is the whole code pasted?");
  const L={version:f[0],name:"",tutorial:"",wallEffect:0,W:0,H:0,
           id:null,rot:null,place:null,maxId:0,nPlaceable:0,fields:f.length,flip};
  // stored (x,y) -> screen-coordinate offset
  const at=(x,y)=>(L.flip?(L.H-1-y):y)*L.W+x;

  const alloc=()=>{
    if(!(L.W>0&&L.H>0)) throw new Error("bad level dimensions");
    /* The old 4-million cap was arbitrary. The genuine ceilings are: every cell
       index must stay inside a signed 32-bit int, because the bitmaps address
       cells with >>5 and 1<<(i&31); and the browser has to actually allocate the
       arrays. Check the first, and let the second report itself rather than
       guessing a number. */
    const cells=L.W*L.H;
    if((L.W+2)*(L.H+2)>=2**31)
      throw new Error(`level too big to index: ${L.W}x${L.H} is `+
                      `${cells.toLocaleString()} cells, limit is about 2.1 billion`);
    try{
      L.id=new Uint8Array(cells).fill(9);
      L.rot=new Uint8Array(cells);
      L.place=new Uint8Array(cells);
    }catch(e){
      throw new Error(`not enough memory for ${L.W}x${L.H} (`+
                      `${cells.toLocaleString()} cells, needs about `+
                      `${(cells*2.7/1e9).toFixed(1)} GB)`);
    }
  };
  const put=(pos,v)=>{
    if(pos<0||pos>=L.id.length) return;
    const o=at(pos%L.W,Math.floor(pos/L.W));
    if(v>71){ L.place[o]=v&1; return; }
    const cid=Math.floor(v/2)%9, r=Math.floor(v/18)%4;
    L.id[o]=cid; L.rot[o]=r; L.place[o]=v&1;
    if(cid>L.maxId) L.maxId=cid;
  };
  const wallEff=v=>{const n=parseInt(v,10); return (n>=0&&n<=3)?n:0;};

  if(f[0]==="V1"){
    L.W=parseInt(f[1],10); L.H=parseInt(f[2],10); alloc();
    L.name=f[5]; L.wallEffect=f[6]?wallEff(f[6]):0;
    for(const p of f[3].split(",")){
      if(!p) continue;
      const q=p.split("."); if(q.length!==2) throw new Error(`bad placeable '${p}'`);
      const x=+q[0],y=+q[1];
      if(x>=0&&x<L.W&&y>=0&&y<L.H) L.place[at(x,y)]=1;
    }
    for(const p of f[4].split(",")){
      if(!p) continue;
      const q=p.split("."); if(q.length!==4) throw new Error(`bad cell '${p}'`);
      const cid=+q[0], r=+q[1], x=+q[2], y=+q[3];
      if(x<0||x>=L.W||y<0||y>=L.H) continue;
      const o=at(x,y);
      L.id[o]=cid; L.rot[o]=r&3;
      if(cid>L.maxId) L.maxId=cid;
    }
  }else if(f[0]==="V2"||f[0]==="V3"){
    L.W=b74(f[1]); L.H=b74(f[2]); alloc();
    L.tutorial=f[4]; L.name=f[5]; L.wallEffect=f[6]?wallEff(f[6]):0;
    const d=f[3];

    if(f[0]==="V2"){
      const data=d+"0";                       // sentinel keeps lookahead valid
      let c=0,pos=0;
      while(d.length&&c<data.length-1){
        let repeat=1,add=1;
        if(data[c+1]===")"){
          if(c+2>=data.length) throw new Error("truncated ')' run");
          repeat=b74(data[c+2])+1; add=3;
        }else if(data[c+1]==="("){
          const e=data.indexOf(")",c+2);
          if(e<0) throw new Error("unterminated '(' run");
          const s=data.slice(c+2,e);
          repeat=b74(s)+1; add=3+s.length;
        }
        const v=b74(data[c]);
        for(let i=0;i<repeat;i++) put(pos+i,v);
        c+=add; pos+=repeat;
      }
    }else{
      // Expand back-references into a typed array of cell VALUES, never a string.
      // Building the output with `out += out[src]` looks harmless but is fatal:
      // V8 represents the growing string as a rope and has to flatten it on every
      // indexed read, so the whole expansion is O(n^2). A 999x999 level is one
      // ~500k-long back-reference, which hung the page. Native std::string is
      // O(1) per op, which is why only the web build died on it.
      const cap=L.W*L.H;
      const out=new Uint8Array(cap);
      let n=0,i=0;
      while(i<d.length&&n<cap){
        const ch=d[i];
        if(ch!=="("&&ch!==")"){
          const v=B74.indexOf(ch);
          if(v<0) throw new Error(`invalid base74 character '${ch}'`);
          out[n++]=v; i++; continue;
        }
        let offs="",dist="";
        if(d[i]===")"){
          if(i+2>=d.length) throw new Error("truncated back-reference");
          offs=d[i+1]; dist=d[i+2]; i+=3;
        }else{
          i++;
          while(i<d.length&&d[i]!=="("&&d[i]!==")") offs+=d[i++];
          if(i>=d.length) throw new Error("truncated back-reference offset");
          if(d[i]===")"){
            if(i+1>=d.length) throw new Error("truncated back-reference distance");
            dist=d[i+1]; i+=2;
          }else{
            i++;
            while(i<d.length&&d[i]!==")") dist+=d[i++];
            if(i>=d.length) throw new Error("unterminated back-reference distance");
            i++;
          }
        }
        const o=b74(offs), cnt=b74(dist);
        for(let k=0;k<cnt&&n<cap;k++){
          const src=n-o-1;
          if(src<0) throw new Error("back-reference points before start of data");
          out[n++]=out[src];
        }
      }
      for(let k=0;k<n;k++) put(k,out[k]);
    }
  }else{
    throw new Error(`unknown format '${f[0]}' — this reads V1, V2 and V3`);
  }

  for(let i=0;i<L.id.length;i++) if(L.place[i]) L.nPlaceable++;
  return L;
}

/* --- What build is it from? -------------------------------------------------
   Honest answer: the code does not say. Only the format version, field shape
   and id range are evidence, and CMMM / CMMM+ / CMMM+MM read and write
   overlapping formats. So we surface the evidence and ask, rather than guess
   silently. */
const VARIANTS=[
  {id:"vanilla", name:"Vanilla Cell Machine", by:"Sam Hogan",
   note:"9 cells: generator, rotators, mover, slide, push, wall, enemy, trash."},
  {id:"cmmm",    name:"CMMM", by:"Cell Machine: Mystic Mod",
   note:"Adds cells beyond id 8, wall effects (wrap/delete/flip), and the V2/V3 codes."},
  {id:"cmmm+",   name:"CMMM+", by:"Mystic Mod Plus",
   note:"Reads V1/V3/MP1 and exports MP1 by default. Its own extended id table."},
  {id:"cmmm+mm", name:"CMMM+MM", by:"Mystic Mod Plus + Mystic Mod cells",
   note:"Widest id table of the four."},
];
function detectVariant(L){
  let guess="cmmm", conf="ambiguous", why=[];
  if(L.version==="V1"&&L.fields<=6){
    guess="vanilla"; conf="likely";
    why.push("V1 code with no wall-effect field, which predates the Mystic Mod additions.");
  }else if(L.version==="V1"){
    guess="cmmm"; conf="weak";
    why.push("V1 code carrying a wall-effect field — that field was added by the Mystic Mod.");
  }else if(L.version==="V2"){
    guess="cmmm"; conf="likely";
    why.push("V2 was the Mystic Mod's format and was superseded by V3.");
  }else{
    guess="cmmm"; conf="ambiguous";
    why.push("V3 is read and written by all three mod builds; CMMM+ only defaults to MP1 on <em>export</em>, so a V3 code narrows nothing.");
  }
  if(L.maxId>8)
    why.push(`Contains cell id <code>${L.maxId}</code>, above vanilla's 0–8 — so it is <b>not</b> from vanilla.`);
  if(L.wallEffect)
    why.push(`Wall effect <code>${L.wallEffect}</code> (${["stop","wrap","delete","flip"][L.wallEffect]}) is a Mystic Mod feature.`);
  return {guess,conf,why};
}

/* ===========================================================================
   RENDERING
   =========================================================================== */
const COLORS={};
COLORS[T_GEN]="#2f9e5a"; COLORS[T_CW]="#cf7726"; COLORS[T_CCW]="#26a08f";
COLORS[T_MOVER]="#3d6fc4"; COLORS[T_SLIDE]="#c2a03c"; COLORS[T_PUSH]="#a8862f";
COLORS[T_WALL]="#4d4d4d"; COLORS[T_ENEMY]="#a52836"; COLORS[T_TRASH]="#8f2fb2";
const NAMES={};
NAMES[T_GEN]="Generator";NAMES[T_CW]="CW rotator";NAMES[T_CCW]="CCW rotator";
NAMES[T_MOVER]="Mover";NAMES[T_SLIDE]="Slide";NAMES[T_PUSH]="Push";
NAMES[T_WALL]="Wall";NAMES[T_ENEMY]="Enemy";NAMES[T_TRASH]="Trash";

/* --- sprites ---------------------------------------------------------------
   Each cell is a bevelled tile plus a drawn icon, rendered once per (type,
   rotation, size) into an offscreen canvas and then blitted. Drawing the icon
   per cell per frame would be hopeless on a 999x999 board; drawing it 36 times
   per resize costs nothing. Below ~8px a tile is too small for an icon to read,
   so those fall back to a flat fill and skip the cache entirely. */
const ICON="#eff3f7";
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>0?v+(255-v)*amt:v*(1+amt))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
// icons are drawn in a 16x16 space centred on (0,0), i.e. coordinates -8..8
const ICONS={};
ICONS[T_GEN]=c=>{                       // hollow box feeding an arrow
  c.lineWidth=1.7; c.strokeStyle=ICON; c.strokeRect(-6,-3.2,5,6.4);
  c.fillStyle=ICON; c.fillRect(-0.6,-1.1,4,2.2);
  c.beginPath(); c.moveTo(2.6,-3.9); c.lineTo(6.8,0); c.lineTo(2.6,3.9); c.closePath(); c.fill();
};
ICONS[T_MOVER]=c=>{                     // solid triangle
  c.fillStyle=ICON;
  c.beginPath(); c.moveTo(-3.4,-5); c.lineTo(5.2,0); c.lineTo(-3.4,5); c.closePath(); c.fill();
};
const rotIcon=cw=>c=>{                  // two arcs chasing each other round a ring
  c.save(); if(!cw) c.scale(-1,1);
  c.strokeStyle=ICON; c.lineWidth=1.9; c.lineCap="butt";
  for(const a of [0,Math.PI]){
    c.beginPath(); c.arc(0,0,4.4,a+0.42,a+Math.PI-0.30); c.stroke();
  }
  c.fillStyle=ICON;
  const head=(ax,ay,dx,dy)=>{           // arrowhead as a triangle on the tangent
    c.beginPath(); c.moveTo(ax+dx*2.6,ay+dy*2.6);
    c.lineTo(ax-dy*2.5-dx*0.6,ay+dx*2.5-dy*0.6);
    c.lineTo(ax+dy*2.5-dx*0.6,ay-dx*2.5-dy*0.6);
    c.closePath(); c.fill();
  };
  head(4.4*Math.cos(0.42),4.4*Math.sin(0.42),Math.sin(0.42),-Math.cos(0.42));
  head(-4.4*Math.cos(0.42),-4.4*Math.sin(0.42),-Math.sin(0.42),Math.cos(0.42));
  c.restore();
};
ICONS[T_CW]=rotIcon(true);
ICONS[T_CCW]=rotIcon(false);
ICONS[T_PUSH]=c=>{                      // # lattice
  c.strokeStyle=ICON; c.lineWidth=1.7; c.beginPath();
  for(const v of [-2.3,2.3]){
    c.moveTo(v,-6); c.lineTo(v,6);
    c.moveTo(-6,v); c.lineTo(6,v);
  }
  c.stroke();
};
ICONS[T_SLIDE]=c=>{                     // rails along the axis it slides on
  c.strokeStyle=ICON; c.lineWidth=1.9; c.beginPath();
  for(const v of [-2.4,2.4]){ c.moveTo(-6,v); c.lineTo(6,v); }
  c.stroke();
};
ICONS[T_ENEMY]=c=>{                     // angry face
  c.fillStyle=ICON;
  c.beginPath(); c.moveTo(-6,-3.4); c.lineTo(-1.4,-0.6); c.lineTo(-1.4,1.6);
  c.lineTo(-6,-0.4); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(6,-3.4); c.lineTo(1.4,-0.6); c.lineTo(1.4,1.6);
  c.lineTo(6,-0.4); c.closePath(); c.fill();
  c.lineWidth=1.7; c.strokeStyle=ICON; c.beginPath();
  c.moveTo(-4.2,4.2); c.lineTo(-1.4,2.9); c.lineTo(1.4,4.4); c.lineTo(4.2,3.1);
  c.stroke();
};
ICONS[T_TRASH]=c=>{                     // bin with a lid and slots
  c.fillStyle=ICON;
  c.fillRect(-1.9,-6.4,3.8,1.5);
  c.fillRect(-5.6,-4.6,11.2,1.9);
  c.beginPath(); c.moveTo(-4.5,-2.1); c.lineTo(4.5,-2.1);
  c.lineTo(3.4,6.2); c.lineTo(-3.4,6.2); c.closePath(); c.fill();
};
ICONS[T_WALL]=c=>{                      // riveted plate
  c.fillStyle=shade(COLORS[T_WALL],0.55);
  for(const [x,y] of [[-4.3,-4.3],[4.3,-4.3],[-4.3,4.3],[4.3,4.3]])
    c.fillRect(x-1.1,y-1.1,2.2,2.2);
  c.fillStyle=shade(COLORS[T_WALL],0.18);
  c.fillRect(-2.6,-2.6,5.2,5.2);
};
// trash gets dark slots cut back out of its bin
const OVERLAY={};
OVERLAY[T_TRASH]=(c,base)=>{
  c.fillStyle=shade(base,-0.5);
  for(const x of [-1.9,0,1.9]) c.fillRect(x-0.45,-0.9,0.9,5.5);
};

const spriteCache=new Map();
// rotation only reads on cells that have one; slide has two states, not four
// Every cell carries a rotation and shows it -- generator, mover, both
// rotators, push, slide, enemy and trash. Only the wall has no oriented form.
const normRot=(t,r)=>t===T_WALL?0:r;
/* Sprites are baked at a fixed size and cached by that size. That is fine for a
   ladder of ~24 fixed zoom levels, but pinch zoom is continuous: every frame
   asks for a slightly different fractional size, so every frame baked nine
   fresh canvases that were never reused and never freed -- a two-second pinch
   allocated over a hundred of them. Sizes are therefore snapped to a small set
   of rungs, and the caller scales the nearest rung to the exact size it wants.
   Drawing a 37px cell from a 32px sprite costs one scaled blit; baking a
   bespoke 37px sprite costs a full rasterisation plus permanent memory. */
const SPRITE_RUNGS=[8,12,16,24,32,48,64,96,128];
function spriteSize(size){
  if(size<=SPRITE_RUNGS[0]) return Math.max(1,Math.round(size));
  for(const r of SPRITE_RUNGS) if(size<=r) return r;
  return SPRITE_RUNGS[SPRITE_RUNGS.length-1];
}
function spriteFor(t,r,size){
  const px=spriteSize(size);
  const key=t+"|"+normRot(t,r)+"|"+px;
  let s=spriteCache.get(key);
  if(!s){ s=makeSprite(t,r,px); spriteCache.set(key,s); }
  return s;
}
function makeSprite(t,r,size){
  const rr=normRot(t,r);
  const s=document.createElement("canvas"); s.width=s.height=size;
  const c=s.getContext("2d");
  const base=COLORS[t]||"#ff00ff";
  const b=Math.max(1,Math.round(size/16));
  c.fillStyle=shade(base,-0.5); c.fillRect(0,0,size,size);          // outline
  c.fillStyle=base;             c.fillRect(b,b,size-2*b,size-2*b);  // face
  c.fillStyle=shade(base,0.30);                                     // lit edges
  c.fillRect(b,b,size-2*b,b); c.fillRect(b,b,b,size-2*b);
  c.fillStyle=shade(base,-0.28);                                    // shaded edges
  c.fillRect(b,size-2*b,size-2*b,b); c.fillRect(size-2*b,b,b,size-2*b);
  const icon=ICONS[t];
  if(icon){
    c.save();
    c.translate(size/2,size/2);
    c.scale(size/20,size/20);        // icons are authored in a 16-unit box
    c.rotate(rr*Math.PI/2);
    c.lineJoin="miter";
    icon(c);
    if(OVERLAY[t]) OVERLAY[t](c,base);
    c.restore();
  }
  return s;
}


/* ===========================================================================
   PIXEL FONT
   The IBM VGA 8x16 CP437 face -- the ROM font that Perfect DOS VGA 437
   reproduces. One byte per row, 95 glyphs (ASCII 32..126), packed base64.

   glyph bitmaps are the font; a TTF would only wrap the same pixels and would

const FONT_W=8, FONT_H=16;
const FONT_BYTES=(()=>{const s=atob(FONT_B64),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;})();

const textCache=new Map();
function textCanvas(str,scale,color,sp){
  sp=sp|0; scale=Math.max(1,scale|0);
  const key=str+"|"+scale+"|"+color+"|"+sp;
  let c=textCache.get(key); if(c) return c;
  const adv=FONT_W+sp;

function backArrow(){
  // Twice the size on touch: it is the only way off these screens and it sat in
  // a corner at cursor proportions.
  const k=touchUsed?2:1;
  const w=24*U*k,h=18*U*k,x=W-w-7*U,y=7*U;
  reserve(x,y,w,h);
  const hot=inRect(x,y,w,h);
  frame(x,y,w,h,hot);
  X.fillStyle=WHITE; X.beginPath();
  X.moveTo(x+w/2-4*U*k,y+h/2); X.lineTo(x+w/2+3*U*k,y+h/2-4*U*k);
  X.lineTo(x+w/2+3*U*k,y+h/2+4*U*k);
  X.closePath(); X.fill();
  return hot&&M.click&&(sfx("click"),true);
}

/* ===========================================================================
   AUDIO  --  synthesised, no assets.
   Deliberately low and small: a soft low thud when a cell is made, and a
   short bit-crushed noise burst when one is destroyed. The crush is done two
   ways at once -- the noise buffer is sample-and-held, which drops the
   effective sample rate, and a waveshaper quantises it to a handful of
   levels. Both stay well under the click and tick in level.
   =========================================================================== */
/* --- music -----------------------------------------------------------------
   The supplied MIDI, flattened to note events at load time: 110bpm, 38 notes
   over a 32-beat loop. The file's final note is NOT here -- it was a marker for
   where the loop should return to, so its start time became the loop length and
   the note itself was dropped. Encoded as "loopSeconds|t,dur,pitch,velocity;..."
   Voiced with a short plucked square, matching the rest of the sound.
   MUSIC_BOOST is the requested 3x lift; the file is written at velocity 50,
   which is quiet. */
const MUSIC_SRC="17.4545|0.000,0.136,64,50;0.273,0.136,62,50;0.818,0.136,57,50;1.636,0.136,55,50;1.636,0.136,60,50;2.727,0.136,62,50;3.818,0.136,52,50;3.818,0.136,57,50;4.364,0.136,64,50;4.636,0.136,62,50;5.182,0.136,57,50;6.000,0.136,55,50;6.000,0.136,60,50;6.818,0.136,57,50;7.091,0.136,62,50;7.364,0.136,69,50;7.636,0.136,57,50;8.182,0.136,52,50;8.727,0.136,64,50;9.000,0.136,62,50;9.545,0.136,57,50;10.364,0.136,55,50;10.364,0.136,60,50;11.454,0.136,62,50;12.545,0.136,52,50;12.545,0.136,57,50;13.091,0.136,64,50;13.364,0.136,62,50;13.909,0.136,57,50;14.727,0.136,55,50;14.727,0.136,60,50;15.545,0.136,57,50;15.818,0.136,62,50;16.091,0.136,69,50;16.364,0.136,52,50;16.636,0.136,69,50;16.909,0.136,62,50;17.182,0.136,57,50";
const MUSIC_BOOST=3;
const MUSIC=(()=>{
  const [head,body]=MUSIC_SRC.split("|");
  return {loop:parseFloat(head),
          notes:body.split(";").map(n=>n.split(",").map(Number))};
})();
let musGain=null, musIdx=0, musBase=0, musOn=false;
let AC=null, master=null, NOISE=null, CRUSH=null, VERB=null, verbGain=null;
function audioUnlock(){
  if(AC){ if(AC.state==="suspended") AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=1; master.connect(AC.destination);
    musGain=AC.createGain(); musGain.gain.value=0; musGain.connect(AC.destination);
    const len=Math.floor(AC.sampleRate*0.4);
    NOISE=AC.createBuffer(1,len,AC.sampleRate);
    const d=NOISE.getChannelData(0);
    let v=0;
    // hold each sample longer -> lower effective sample rate -> grittier
    for(let i=0;i<len;i++){ if(i%14===0) v=Math.random()*2-1; d[i]=v; }
    CRUSH=new Float32Array(256);
    for(let i=0;i<256;i++){ const x=i/255*2-1; CRUSH[i]=Math.round(x*1.5)/1.5; } // ~2 bit
    // Small room: exponentially decaying noise as an impulse response. Kept in
    // its own try so that a browser without ConvolverNode loses the tail rather
    // than all sound.
    try{
      const rl=Math.floor(AC.sampleRate*0.34);
      const ir=AC.createBuffer(2,rl,AC.sampleRate);
      for(let ch=0;ch<2;ch++){
        const b=ir.getChannelData(ch);
        for(let i=0;i<rl;i++) b[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3.2);
      }
      VERB=AC.createConvolver(); VERB.buffer=ir;
      verbGain=AC.createGain(); verbGain.gain.value=0.5;
      VERB.connect(verbGain); verbGain.connect(AC.destination);
    }catch(e){ VERB=null; }
    musOn=true; musIdx=0; musBase=AC.currentTime+0.15;
  }catch(e){ AC=null; }
}

function musicNote(when,dur,pitch,vel){
  const f=440*Math.pow(2,(pitch-69)/12);
  const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
  o.type="square"; o.frequency.value=f;
  lp.type="lowpass"; lp.frequency.value=Math.min(6000,f*6);
  const peak=(vel/127)*0.22, end=when+Math.max(dur,0.09)+0.20;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(peak,when+0.008);   // quick pluck
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o.connect(lp); lp.connect(g); g.connect(musGain);
  o.start(when); o.stop(end+0.02);
}
// Scheduled ahead of the clock; the gain node is live so the slider responds
// immediately rather than after the lookahead window.
function musicPump(){
  if(!AC||!musOn) return;
  musGain.gain.value=S.musicVol*MUSIC_BOOST*0.25;
  const ahead=AC.currentTime+0.7;
  let guard=0;
  while(guard++<400){
    const n=MUSIC.notes[musIdx];
    if(musBase+n[0]>=ahead) break;
    if(S.musicVol>0) musicNote(musBase+n[0],n[1],n[2],n[3]);
    if(++musIdx>=MUSIC.notes.length){ musIdx=0; musBase+=MUSIC.loop; }
  }
}
function tone(freq,to,dur,type,gain,cut){
  if(!AC||S.sfxVol<=0) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  f.type="lowpass"; f.frequency.value=cut||800;
  g.gain.setValueAtTime(Math.max(.0001,gain*S.sfxVol),t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+.02);
}
function crushBurst(gain,dur,cut0,cut1,wet){
  if(!AC||S.sfxVol<=0) return;
  const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=NOISE;
  s.playbackRate.value=0.55;
  const ws=AC.createWaveShaper(); ws.curve=CRUSH; ws.oversample="none";
  const f=AC.createBiquadFilter(); f.type="lowpass";
  f.frequency.setValueAtTime(cut0,t); f.frequency.exponentialRampToValueAtTime(cut1,t+dur);
  const g=AC.createGain();
  g.gain.setValueAtTime(Math.max(.0001,gain*S.sfxVol),t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(ws); ws.connect(f); f.connect(g); g.connect(master);
  if(wet&&VERB){                       // a little tail, well under the dry signal
    const send=AC.createGain(); send.gain.value=wet*S.sfxVol;
    g.connect(send); send.connect(VERB);
  }
  s.start(t); s.stop(t+dur+.02);
}
const lastSfx={};
function sfxThrottled(name,minMs){
  if(now-(lastSfx[name]||-1e9)<minMs) return;
  lastSfx[name]=now; sfx(name);
}
// Generators making cells and trash/enemies destroying them are the same two
// sounds as placing and deleting by hand, but there can be thousands per tick,
// so they collapse to at most one of each per interval.
function voiceWorld(){
  if(!world) return;
  if(world.evCreate>0) sfxThrottled("place",70);
  if(world.evDestroy>0) sfxThrottled("del",90);
  world.evCreate=0; world.evDestroy=0;
}
function sfx(name){
  if(!AC||S.sfxVol<=0) return;
  switch(name){
    case "place": tone(132,84,.085,"square",.20,520); break;   // low thud
    case "del":   crushBurst(.11,.15,820,120,.55); break;      // small crushed pop with a tail
    case "click": tone(196,150,.035,"square",.10,700); break;
    case "err":   crushBurst(.14,.22,500,90,.3); break;
  }
}

/* ===========================================================================
   LEVEL CODE EXPORT (V3)
   Runs become back-references with offset 0, an escape the decoder already
   understands, so no new syntax. Rows are written bottom-up like the game.
   =========================================================================== */
function b74e(n){
  if(n<74) return B74[n];
  let s=""; while(n>0){ s=B74[n%74]+s; n=Math.floor(n/74); }
  return s||"0";
}
/* Built in a typed array of base74 VALUES, not by growing a string. The old
   version concatenated one character per cell and then indexed the result --
   the same mistake that hung the importer on a 999x999 level, mirrored. On a
   19-million-cell board that never returned. */
function exportV3(w,mask,name,desc){
  const n=w.W*w.H, ST=w.stride;
  const raw=new Uint8Array(n);
  let k=0;
  for(let y=w.H-1;y>=0;y--){                 // stored bottom-up
    const base=(y+1)*ST+1, mrow=y*w.W;
    for(let x=0;x<w.W;x++){
      const c=w.g[base+x], t=c>>2, p=mask&&mask[mrow+x]?1:0;
      raw[k++]=(t===T_EMPTY)?72+p:T_TO_CM[t]*2+(c&3)*18+p;
    }
  }
  let end=n;
  while(end>0&&raw[end-1]===72) end--;       // trailing empties are implied
  const parts=[];
  for(let i=0;i<end;){
    let j=i+1;
    const v=raw[i];
    while(j<end&&raw[j]===v) j++;
    const run=j-i, ch=B74[v];
    if(run<4) parts.push(ch.repeat(run));
    else if(run-1<74) parts.push(ch+")0"+b74e(run-1));
    else parts.push(ch+"(0("+b74e(run-1)+")");
    i=j;
  }
  // field 4 is the description, field 5 the name -- both were being thrown away
  const clean=t=>String(t||"").replace(/;/g,",");
  return `V3;${b74e(w.W)};${b74e(w.H)};${parts.join("")};${clean(desc)};${clean(name)};0`;
}

const DB_NAME="webaccel", DB_VER=1;   // never change this: it is where saved
                                      // levels and schematics already live
let db=null, dbFailed=false;
let levelsMem=[], schemMem=[];          // what the UI draws
let storeReady=false;

function dbOpen(){
  return new Promise(res=>{
    let req;
    try{ req=indexedDB.open(DB_NAME,DB_VER); }catch(e){ dbFailed=true; return res(null); }
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains("levels")) d.createObjectStore("levels",{keyPath:"name"});
      if(!d.objectStoreNames.contains("schematics")) d.createObjectStore("schematics",{keyPath:"name"});
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>{ dbFailed=true; res(null); };
    req.onblocked=()=>{ dbFailed=true; res(null); };
  });
}
function dbAll(store){
  return new Promise(res=>{
    if(!db) return res([]);
    try{
      const r=db.transaction(store,"readonly").objectStore(store).getAll();
      r.onsuccess=()=>res(r.result||[]);
      r.onerror=()=>res([]);
    }catch(e){ res([]); }
  });
}
function dbPut(store,rec){
  return new Promise(res=>{
    if(!db) return res("no storage available - this save will not survive a reload");
    try{
      const tx=db.transaction(store,"readwrite");
      tx.objectStore(store).put(rec);
      tx.oncomplete=()=>res(null);
      tx.onerror=()=>res("the browser refused to store this ("+
        (tx.error&&tx.error.name||"unknown")+")");
      tx.onabort=()=>res("storage quota exceeded");
    }catch(e){ res("storage error: "+e.message); }
  });
}
function dbDel(store,name){
  return new Promise(res=>{
    if(!db) return res();
    try{
      const tx=db.transaction(store,"readwrite");
      tx.objectStore(store).delete(name);
      tx.oncomplete=()=>res(); tx.onerror=()=>res();
    }catch(e){ res(); }
  });
}
async function storeInit(){
  db=await dbOpen();
  if(db){
    levelsMem=await dbAll("levels");
    schemMem=await dbAll("schematics");
    // ask the browser not to evict us; harmless if unsupported
    try{
      if(navigator.storage&&navigator.storage.persisted){
        storagePersistent=await navigator.storage.persisted();
        if(!storagePersistent&&navigator.storage.persist)
          storagePersistent=await navigator.storage.persist();
      }
    }catch(e){}
    // did anything cross a session boundary?
    let hadSession=false;
    try{
      hadSession=!!sessionStorage.getItem("wam_session");
      sessionStorage.setItem("wam_session","1");
    }catch(e){ hadSession=false; }
    const marked=levelsMem.some(e=>e.name==="__mark")||schemMem.some(e=>e.name==="__mark");
    if(marked&&!hadSession) persistedAcrossSessions=true;
    if(!marked){
      // invisible marker so the next session can tell
      dbPut("levels",{name:"__mark",code:""});
      levelsMem.push({name:"__mark",code:""});
    }
    storageChecked=true;
  }
  storeReady=true;
}
storeInit();

// The UI reads these synchronously; writes update memory first, then the store.
const cookieList=()=>levelsMem.filter(e=>e.name!=="__mark").sort((a,b)=>a.name<b.name?-1:1);
const schemList=()=>schemMem.filter(e=>e.name!=="__mark").sort((a,b)=>a.name<b.name?-1:1);
function saveRec(list,store,name,code,cb){
  const i=list.findIndex(e=>e.name===name);
  const rec={name,code};
  if(i>=0) list[i]=rec; else list.push(rec);
  dbPut(store,rec).then(err=>{ if(cb) cb(err); });
}
/* Served from a real domain, IndexedDB is permanent -- that is the intended
   home for this. On a file:// page the browser gives the document no origin and
   refuses storage outright, so a "save" there would be lost the moment the tab
   closed. Rather than hand back something that looks saved and is not, saving
   is refused and says why. */
/* Whether storage works is DETECTED, never assumed from the URL. file:// pages
   do get IndexedDB in some browsers and not others, and asserting otherwise was
   simply wrong. Saving is refused only when opening the database actually failed.

   Surviving a refresh does not prove surviving a restart, so a marker is kept in
   sessionStorage (which dies with the tab) alongside one in IndexedDB (which
   should not). Finding the database marker without the session one means the
   data genuinely crossed a session boundary -- the only honest way to report it. */
const NO_STORE="storage unavailable here - saving is disabled";
const storageBlocked=()=>storeReady&&(dbFailed||!db);
let persistedAcrossSessions=false, storagePersistent=false, storageChecked=false;
function storageStatus(){
  if(!storeReady) return {text:"checking storage...",colour:"#222"};
  if(storageBlocked()) return {text:"saving disabled - this browser gives the page no storage",colour:"#a33"};
  if(persistedAcrossSessions)
    return {text:"storage confirmed: saves survived a previous session",colour:"#2a7"};
  if(storagePersistent)
    return {text:"storage granted as persistent by the browser",colour:"#2a7"};
  return {text:"storage works, but a restart has not been observed yet",colour:"#666"};
}
const cookieSave=(name,code)=>{
  if(storageBlocked()) return NO_STORE;
  saveRec(levelsMem,"levels",name,code,err=>{ if(err) say(err,true); });
  return null;
};
const schemSave=(name,code)=>{
  if(storageBlocked()) return NO_STORE;
  saveRec(schemMem,"schematics",name,code,err=>{ if(err) say(err,true); });
  return null;
};
const cookieDrop=n=>{ levelsMem=levelsMem.filter(e=>e.name!==n); dbDel("levels",n); };
const schemDrop =n=>{ schemMem =schemMem .filter(e=>e.name!==n); dbDel("schematics",n); };

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement("textarea");
      ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand("copy"); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}

/* ===========================================================================
   STATE
   =========================================================================== */
const S={musicVol:.8,sfxVol:.8,fast:false,noDraw:false};
let scr="title", paused=false, modal=null, pending=null, toast="", toastT=-1e9;
let world=null, placeMask=null, levelName="", levelDesc="", tickCount=0;
/* The rate actually achieved, which is not the rate asked for once the board
   is big enough to fall behind. Counted over a moving second. */
let tpsMark=0, tpsSeen=0, tpsReal=0;
// 1234567 reads as 1,234,567. Tick counts run into the millions on a big
// board and an ungrouped run of digits is unreadable at a glance.
function grp(n){
  const str=String(n), dot=str.indexOf(".");
  const head=dot<0?str:str.slice(0,dot), tail=dot<0?"":str.slice(dot);
  return head.replace(/\B(?=(\d{3})+(?!\d))/g,",")+tail;
}
function noteTicks(n,t){
  tpsSeen+=n;
  if(!tpsMark) tpsMark=t;
  const dt=t-tpsMark;
  if(dt>=500){ tpsReal=tpsSeen*1000/dt; tpsSeen=0; tpsMark=t; }
}
let playing=false, tpsIdx=3, acc=0, now=0;
// Interpolation. The grid always holds the post-tick state; moved cells are
// drawn back toward where they came from and slide into place as the next tick
// approaches, so motion reads as continuous instead of stepping.
let tickAt=-1e9, tickDur=0;
const interpOn=()=>!S.fast;
const alphaNow=()=>tickDur>0?Math.min(1,(now-tickAt)/tickDur):1;
const TPS=[1,2,3,5,10,20,30,60,120,600,Infinity];
const tpsLabelFor=i=>TPS[i]===Infinity?"max tps":TPS[i]+" tps";
const tpsLabel=()=>tpsLabelFor(tpsIdx);
const PALETTE=[T_GEN,T_MOVER,T_CW,T_CCW,T_PUSH,T_SLIDE,T_ENEMY,T_TRASH,T_WALL];
// 9 = drag cells around, 10 = pan the camera, 11 = rectangle select
const TOOL_PLUS=9,TOOL_DRAG=10,TOOL_SELECT=11;   // middle-drag still pans
// A finger has no right button, so erasing needs a tool of its own. It is only
// offered on touch devices; a mouse already has a faster way to do this.
const TOOL_ERASE=12;

/* --- initial state ----------------------------------------------------------
   "Initial state" is whatever the board looked like the moment Play was first
   pressed. Everything edited before that counts as part of the level; edits
   after it are live and are thrown away on reset. R restores it and puts you
   back in the editing phase, so you can rearrange and run again. */
let mode="editable";          // "level" locks the building tools away
let started=false;            // has the run begun since the last reset?
let won=false, hadEnemies=false, winCheckAt=-1e9;
let initG=null, initMask=null;
let dragCell=null;            // {c,fromX,fromY} while dragging one cell
let sel=null, selDrag=null, carry=null;   // rectangle select + clipboard
/* A selection is a bitmask over the board. `sel` stays as its bounding box so
   everything that reads a rectangle still works, and selMask is null whenever
   the selection is exactly that rectangle -- the common case, which keeps a
   plain drag as cheap as it was. ctrl-drag adds a box, alt-drag cuts one out. */
let selMask=null;
function clearSel(){ sel=null; selMask=null; }
function selHas(x,y){
  if(!sel) return false;
  if(x<sel.x0||x>sel.x1||y<sel.y0||y>sel.y1) return false;
  return selMask?!!selMask[y*world.W+x]:true;
}
const SEL_MASK_MAX=64e6;                     // a mask past this is 64MB of nothing
function selToMask(){
  if(selMask) return selMask;
  if(world.W*world.H>SEL_MASK_MAX) return null;
  selMask=new Uint8Array(world.W*world.H);
  if(sel) for(let y=sel.y0;y<=sel.y1;y++)
    for(let x=sel.x0;x<=sel.x1;x++) selMask[y*world.W+x]=1;
  return selMask;
}
// Shrink `sel` onto what the mask actually covers; drop the mask if the result
// is solid again. Only the bounding box can hold anything, so this never walks
// the whole board.
function reboundSel(){
  if(!selMask||!sel) return;
  let x0=1e9,y0=1e9,x1=-1,y1=-1,n=0;
  for(let y=sel.y0;y<=sel.y1;y++)for(let x=sel.x0;x<=sel.x1;x++)
    if(selMask[y*world.W+x]){ n++;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(!n){ clearSel(); return; }
  sel={x0,y0,x1,y1};
  if(n===(x1-x0+1)*(y1-y0+1)) selMask=null;
}
function commitSelDrag(d){
  const r=normSel(d);
  if(!d.add&&!d.sub){ sel=r; selMask=null; return; }
  if(!sel&&d.sub) return;                    // nothing to cut out of
  const msk=selToMask();
  if(!msk){ sel=r; say("board too large for a compound selection",true); return; }
  const v=d.sub?0:1;
  for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++) msk[y*world.W+x]=v;
  if(d.add) sel=sel?{x0:Math.min(sel.x0,r.x0),y0:Math.min(sel.y0,r.y0),
                     x1:Math.max(sel.x1,r.x1),y1:Math.max(sel.y1,r.y1)}:r;
  reboundSel();
}
// switching away from select drops what was selected, so a stale box cannot
// linger over the board while you are painting
function setTool(i){
  if(selTool===TOOL_SELECT&&i!==TOOL_SELECT){ clearSel(); selDrag=null; }
  if(i<9) lastCell={t:PALETTE[i]};
  selTool=i;
}
// The cell the palette was last on. Picking the select tool hides it, but a
// fill still wants to know what you were building with.
let lastCell=null;
// One cell type, one facing, nothing else -- the overwhelmingly common fill.
function fillOnly(t,rot){
  for(const k of Object.keys(fillW)) delete fillW[k];
  for(const k of Object.keys(fillRW)) delete fillRW[k];
  fillW[t]=100;
  if(t>=0&&nrots(t)>1) for(let r=0;r<nrots(t);r++) fillRW[t+":"+r]=(r===rot?100:0);
  fillPick=t; fillRotPick=rot; focusRot=false; fillBox="100";
}
let importedLevel=null;
let schemOpen=false;

/* Saving has to capture the level, not the run. Once Play is pressed the board
   is a mid-simulation mess -- generators have flooded it, enemies are gone --
   and reloading that is not the level you built. These read the snapshot taken
   when the run began; before that, the snapshot is the live board anyway. */
function initialWorld(){
  if(!initG||!world) return world;
  if(!started) return world;                 // nothing has run yet
  const W0=world.W,H0=world.H,st=W0+2;
  const w=new World(W0,H0);

    const nx = step===1 ? (h-1-y) : y;
    const ny = step===1 ? x       : (w-1-x);
    out[ny*nw+nx]=mk(c>>2,((c&3)+step)&3);
  }
  // the anchor turns with everything else, which is what keeps the cell under
  // the cursor under the cursor
  const nax = step===1 ? (h-1-carry.ay) : carry.ay;
  const nay = step===1 ? carry.ax       : (w-1-carry.ax);
  /* If it is pinned, keep the cell under the anchor exactly where it is: the
     top-left moves by however much the anchor moved within the block. */
  const at=carry.at?{x:carry.at.x+carry.ax-nax,y:carry.at.y+carry.ay-nay}:null;
  carry={w:nw,h:nh,cells:out,ax:nax,ay:nay,at,
         from:null,                        // no longer lines up with where it came from
         src:carry.src};                   // ...but the ghost still marks where that was
}
// Commit the carried block wherever the preview currently is.
function placeCarry(){
  if(!carry) return;
  const o=carryOrigin();
  if(!o) return;
  stampAt(carry,o.x,o.y);
  carry=null; sfx("place");
}
/* Put it back where it came from, if it was cut rather than copied. Restore
   from the untouched copy kept for the ghost, not from what is in hand: turning
   the block clears `from` because a rotated block no longer lines up, and
   cancelling after a turn used to drop the cut cells on the floor. */
function cancelCarry(){
  if(!carry) return;
  const S2=carry.src;
  if(S2) stampAt({w:S2.w,h:S2.h,cells:S2.cells},S2.x,S2.y);
  else if(carry.from) stampAt(carry,carry.from.x,carry.from.y);
  carry=null;
}
// Pinned by a click, otherwise following the pointer.
function carryOrigin(){
  if(!carry) return null;
  if(carry.at) return carry.at;
  const h=hoverCellRaw();
  return h?{x:h.x-(carry.ax|0),y:h.y-(carry.ay|0)}:null;
}
function stampAt(cy,ax,ay){
  for(let y=0;y<cy.h;y++)for(let x=0;x<cy.w;x++){
    const c=cy.cells[y*cy.w+x];
    if(!c) continue;
    const tx=ax+x, ty=ay+y;
    if(tx>=0&&tx<world.W&&ty>=0&&ty<world.H) world.place(tx,ty,c);
  }
}
// A selection exported as a standalone V3 level, so it pastes into anything
// that reads Cell Machine codes.
function selCode(name){
  if(!sel) return null;
  const src=initialWorld(), msk=initialMask();
  const {x0,y0,x1,y1}=sel, w=x1-x0+1, h=y1-y0+1;
  const tw=new World(w,h), tm=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=selHas(x0+x,y0+y)?src.g[src.idx(x0+x,y0+y)]:0;
    if(c) tw.setCell(tw.idx(x,y),c);
    tm[y*w+x]=msk[(y0+y)*src.W+(x0+x)];
  }
  return exportV3(tw,tm,name||"");
}
function carryFromCode(code){
  const L=importCode(code);
  const cells=new Uint8Array(L.W*L.H);
  for(let y=0;y<L.H;y++)for(let x=0;x<L.W;x++){
    const cid=L.id[y*L.W+x];
    if(cid===9) continue;
    cells[y*L.W+x]=mk(cid>9?T_WALL:CM_TO_T[cid],L.rot[y*L.W+x]);
  }
  carry={w:L.W,h:L.H,cells,from:null};
  clearSel();
}
function deleteSel(){
  if(!sel) return;
  for(let y=sel.y0;y<=sel.y1;y++)for(let x=sel.x0;x<=sel.x1;x++)
    if(selHas(x,y)) world.place(x,y,0);
  clearSel(); sfx("del");
}

/* A frame only sees where the pointer is now, not the path it took. Drag fast
   and consecutive frames land cells apart, leaving dotted lines. Walk the
   segment between the previous cell and this one (Bresenham) and act on every
   cell along it. paintFrom is cleared on release so a new stroke never joins
   itself to where the last one ended. */
let paintFrom=null;
function eachCellOnLine(a,b,fn){
  let x0=a.x,y0=a.y;
  const x1=b.x,y1=b.y;
  const dx=Math.abs(x1-x0), sx=x0<x1?1:-1;
  const dy=-Math.abs(y1-y0), sy=y0<y1?1:-1;
  let err=dx+dy, guard=0;
  for(;;){
    fn(x0,y0);
    if((x0===x1&&y0===y1)||guard++>4096) break;
    const e2=2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
}
function boardInput(dt){
  if(!world) return;
  const sp=520*dt*DPR;
  if(KEYS.has("a"))cam.x-=sp; if(KEYS.has("d"))cam.x+=sp;
  if(KEYS.has("w"))cam.y-=sp; if(KEYS.has("s"))cam.y+=sp;
  clampCam();
  if(M.wheel) setZoom(camZi+(M.wheel<0?1:-1),M.x,M.y);
  if(!M.down&&!M.rdown) paintFrom=null;   // a new stroke starts fresh
  const panning=M.mdown;                 // panning is middle-drag only now
  if(panning){cam.x-=M.pdx;cam.y-=M.pdy;clampCam();return;}
  if(won) return;

  const h=hoverCell();
  // a dragged cell has to land (or go home) even if released off the board
  if(dragCell&&!M.down){
    let placed=false;
    if(h&&!overUI()){
      const dest=world.idx(h.x,h.y);
      const okDest=(world.g[dest]>>2)===T_EMPTY&&
                   (mode!=="level"||placeMask[h.y*world.W+h.x]);
      if(okDest){ world.place(h.x,h.y,dragCell.c); placed=true; sfx("place"); }
    }
    if(!placed) world.place(dragCell.fromX,dragCell.fromY,dragCell.c);
    dragCell=null;
  }
  if(selDrag&&!M.down){ commitSelDrag(selDrag); selDrag=null; }
  if(overUI()) return;
  if(selTool===TOOL_SELECT&&!carry){
    const c=hoverCellClamped();
    if(M.click&&!M.pressUI&&c){
      selDrag={x0:c.x,y0:c.y,x1:c.x,y1:c.y,add:M.ctrl&&!M.alt,sub:M.alt};
      if(!M.ctrl&&!M.alt) clearSel();
    }
    else if(M.down&&selDrag&&c){ selDrag.x1=c.x; selDrag.y1=c.y; }
    if(M.rclick) clearSel();
    return;
  }
  // While a stroke is live, a pointer that has wandered off the board still
  // resolves to the nearest cell. Without this a fast drag towards an edge
  // stops one cell short: the frame that should have covered the border column
  // arrived when the pointer was already past it, and got discarded whole.
  /* Carried cells are placed from the raw pointer position, so a selection held
     over an edge drops the part that is on the board and discards the rest --
     matching the preview. It is handled before the on-board guard below,
     because that guard would otherwise reject the whole action. */
  if(carry){
    /* A click used to stamp immediately, which on touch meant every stray tap
       dumped the block somewhere. Now a click only says where it goes, and
       PLACE commits it. */
    const hc=hoverCellRaw();
    if(hc){
      if(M.click&&!M.pressUI){
        /* With a cursor, click-to-place was never the problem -- a mouse goes
           where you point it. The confirm step exists because a stray tap on a
           phone dumped the block somewhere, so it only applies to touch. */
        if(touchUsed){ carry.at={x:hc.x-(carry.ax|0),y:hc.y-(carry.ay|0)}; sfx("click"); }
        else{ stampAt(carry,hc.x-(carry.ax|0),hc.y-(carry.ay|0)); carry=null; sfx("place"); }
      }
      if(M.rclick&&!M.rpressUI) cancelCarry();
    }
    return;
  }

  const stroking=(M.down||M.rdown)&&paintFrom;
  const hb=h||(stroking?hoverCellClamped():null);
  if(!hb) return;

  // level mode has no building tools: dragging cells that sit on a plus is all
  // you get, and only before the run has started
  if(mode==="level"||selTool===TOOL_DRAG){
    if(!h) return;
    if(M.click&&!M.pressUI&&canEdit()&&!dragCell){
      const i=world.idx(h.x,h.y), c=world.g[i];
      const onPlus=mode!=="level"||placeMask[h.y*world.W+h.x];
      if((c>>2)!==T_EMPTY&&onPlus){
        dragCell={c,fromX:h.x,fromY:h.y};
        world.place(h.x,h.y,0);
        sfx("click");
      }
    }
    return;
  }
  if(selTool===TOOL_SELECT){
    const c=hoverCellClamped();
    if(M.click&&!M.pressUI&&c){
      selDrag={x0:c.x,y0:c.y,x1:c.x,y1:c.y,add:M.ctrl&&!M.alt,sub:M.alt};
      if(!M.ctrl&&!M.alt) clearSel();
    }
    else if(M.down&&selDrag&&c){ selDrag.x1=c.x; selDrag.y1=c.y; }
    if(M.rclick) clearSel();
    return;
  }
  if(selTool===TOOL_PLUS){                 // paint / erase the placeable region
    const on=M.down&&!M.pressUI, off=M.rdown&&!M.rpressUI;
    if(on||off){
      eachCellOnLine(paintFrom||hb,hb,(x,y)=>{
        const o2=y*world.W+x;
        if(on&&!placeMask[o2]){ placeMask[o2]=1; noteMaskCell(x,y,true); }
        else if(off&&placeMask[o2]){ placeMask[o2]=0; noteMaskCell(x,y,false); }
      });
      paintFrom={x:hb.x,y:hb.y};
      if(M.click) sfx("place");
      if(M.rclick) sfx("del");
    }
    return;
  }

  if(selTool===TOOL_ERASE){
    if(M.down&&!M.pressUI){
      let hit=false;
      eachCellOnLine(paintFrom||hb,hb,(x,y)=>{
        if(world.g[world.idx(x,y)]){ world.place(x,y,0); hit=true; }
      });
      paintFrom={x:hb.x,y:hb.y};
      if(M.click&&hit) sfx("del");
    }
    return;
  }
  if(M.down&&!M.pressUI){
    const c=mk(PALETTE[selTool],selRot);
    eachCellOnLine(paintFrom||hb,hb,(x,y)=>world.place(x,y,c));
    paintFrom={x:hb.x,y:hb.y};
    if(M.click) sfx("place");
  }else if(M.rdown&&!M.rpressUI){
    let hit=false;
    eachCellOnLine(paintFrom||hb,hb,(x,y)=>{
      if(world.g[world.idx(x,y)]){ world.place(x,y,0); hit=true; }
    });
    paintFrom={x:hb.x,y:hb.y};
    if(M.rclick&&hit) sfx("del");
  }
}

/* The title decoration is a live board, not a picture: three sealed boxes each
   holding a mover and a rotator, so the engine itself is the animation. */
let titleW=null, titleAcc=0, titleAt=-1e9;
const TITLE_TPS=5;
function titleWorld(){
  // The mockup arrangement, floating in a void -- no walls at all. It is a
  // genuine 6-tick cycle: the mover crosses the gap, each corner rotator turns
  // it ninety degrees as it arrives, and it returns to where it started.
  const w=new World(5,2);
  w.place(0,0,mk(T_CW,0)); w.place(4,0,mk(T_CW,0));
  w.place(0,1,mk(T_CW,0)); w.place(4,1,mk(T_CW,0));
  w.place(2,0,mk(T_MOVER,0));
  return w;
}
function screenTitle(dt){
  X.fillStyle="#000"; X.fillRect(0,0,W,H);
  if(!titleW) titleW=titleWorld();
  titleAcc+=dt*TITLE_TPS;

  while(titleAcc>=1){
    titleW.trackMotion=interpOn(); titleW.clearMotion();
    titleW.tick(); titleW.trackMotion=false;
    if(titleW.motionOver) titleW.clearMotion();
    titleAcc-=1; ticked=true;
  }
  if(ticked) titleAt=now;
  const tal=interpOn()?Math.min(1,(now-titleAt)/(1000/TITLE_TPS)):1;

  // stacked top-down so nothing can overlap at any window size
  const TITLE="WebAccel machine";
  let tsc=U*5;
  while(tsc>1&&textW(TITLE,tsc,2)>W*0.92) tsc--;
  const psc0=Math.max(2,Math.round(tsc*0.85));
  const bts0=Math.max(3,Math.min(U*30,Math.floor(W*0.055),Math.floor(W*0.5/titleW.W)));
  const block=textH(tsc)+7*U+textH(psc0)+4*U+textH(U*2)+9*U+titleW.H*bts0;
  let y=Math.round(Math.max(H*0.05,(H-block)/2-4*U));

  y+=textH(tsc)+7*U;

  const psc=psc0;
  const pw=textW("Play",psc,2), ph=textH(psc), px=Math.round(W/2-pw/2);
  reserve(px,y,pw,ph);
  const phot=inRect(px,y,pw,ph);
  const pulse=0.70+0.30*Math.abs(Math.sin(now/560));
  text("Play",Math.round(W/2),y,psc,phot?"#fff":"rgba(255,255,255,"+pulse.toFixed(3)+")","center",2);
  if(phot&&M.click){ sfx("click"); nav("playmenu"); }
  y+=ph+4*U;

  if(uiText(Math.round(W/2),y,"options",U*2,DIM,"center",1)) nav("options");
  y+=textH(U*2)+9*U;

  const credit=Math.round(H-textH(U)-5*U);
  const bts=Math.max(3,Math.min(bts0,Math.floor((credit-y-6*U)/titleW.H)));
  const bx=Math.round(W/2-titleW.W*bts/2), by=Math.round(y);
  const TST=titleW.stride;
  for(let cy=0;cy<titleW.H;cy++)for(let cx=0;cx<titleW.W;cx++){
    const idx=titleW.idx(cx,cy), c=titleW.g[idx], t=c>>2;
    if(t===T_EMPTY) continue;
    let px=bx+cx*bts, py=by+cy*bts;
    if(tal<1){
      const sI=titleW.motion.get(idx);
      if(sI!==undefined){
        const ox=(sI%TST)-1, oy=((sI/TST)|0)-1;
        px=Math.round(bx+(ox+(cx-ox)*tal)*bts);
        py=Math.round(by+(oy+(cy-oy)*tal)*bts);
      }
    }
    if(bts>=8) drawCell(titleW,idx,t,c,px,py,bts,tal);
    else{ X.fillStyle=avgColor(t); X.fillRect(px,py,bts,bts); }
  }
  text("a remake of Cell Machine by Sam Hogan",Math.round(W/2),credit,U,"#555","center",1);
}
