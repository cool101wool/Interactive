    X.strokeStyle="#ff6b6b"; X.lineWidth=Math.max(2,s*0.11); X.lineCap="butt";
    X.beginPath();
    X.moveTo(x+s*0.28,y+s*0.28); X.lineTo(x+s*0.72,y+s*0.72);
    X.moveTo(x+s*0.72,y+s*0.28); X.lineTo(x+s*0.28,y+s*0.72);
    X.stroke();
    return;
  }
  if(i===TOOL_DRAG){
    X.beginPath();
    for(let k=0;k<4;k++){
      const a=k*Math.PI/2, dx=Math.cos(a), dy=Math.sin(a);
      X.moveTo(x+c+dx*(c-s*0.1),y+c+dy*(c-s*0.1));
      X.lineTo(x+c+dx*(c-s*0.26)-dy*s*0.1,y+c+dy*(c-s*0.26)+dx*s*0.1);
      X.lineTo(x+c+dx*(c-s*0.26)+dy*s*0.1,y+c+dy*(c-s*0.26)-dx*s*0.1);
    }
    X.fill();
    X.fillRect(x+c-q/2,y+s*0.24,q,s*0.52); X.fillRect(x+s*0.24,y+c-q/2,s*0.52,q);
  }
  if(i===TOOL_SELECT){ X.strokeStyle=WHITE; X.lineWidth=Math.max(1,U);
    X.strokeRect(x+s*0.2,y+s*0.2,s*0.6,s*0.6); }
  if(i===TOOL_PLUS){                       // the placeable tile, as drawn on the board
    X.fillStyle="#191919"; X.fillRect(x+s*0.14,y+s*0.14,s*0.72,s*0.72);
    X.strokeStyle="#555"; X.lineWidth=Math.max(1,U);
    X.strokeRect(x+s*0.14,y+s*0.14,s*0.72,s*0.72);
    drawPlus(x+s*0.14,y+s*0.14,s*0.72,"#8fa0b0");
  }
}
function screenGame(dt){
  drawBoard();
  const pad=7*U;
  const editing=mode!=="level";
  // --- bottom bar
  const n=touchUsed?13:12;             // touch gets the eraser as well
  const gap=Math.max(2,Math.round(U*1.5));
  const room=touchUsed?W-2*pad:W-2*pad-2*U*36;
  /* On a phone the icons are half again as big. Thirteen of them at that size
     do not fit across a portrait screen, so rather than let the width squeeze
     them back down to mouse size the bar wraps onto as many rows as it needs.
     Finger-sized targets matter more than a single tidy row. */
  const base=Math.max(16,Math.min(28*U,Math.floor(room/12)-2*U));
  /* Touch sizes for the finger first and lays out second. 44pt is Apple's
     minimum tap target, so that is the floor; however many of those fit across
     the screen is the row length. In landscape all thirteen fit and they grow
     to fill the width, which is the single row in the mockup. In portrait they
     cannot, so the bar wraps rather than shrinking the icons below what a
     thumb can actually hit. */
  const want=touchUsed?Math.max(TAP(),base):base;
  const perRow=touchUsed?Math.max(1,Math.floor((room+gap)/(want+gap))):n;
  const rows=Math.ceil(n/perRow);
  const ps=(touchUsed&&perRow>=n)
    ? Math.min(Math.floor((room-(n-1)*gap)/n),Math.round(want*1.7))
    : want;
  const barH=editing?rows*(ps+gap)-gap+6*U:0;
  if(editing){
    X.fillStyle="rgba(0,0,0,.72)"; X.fillRect(0,H-barH,W,barH);
    reserve(0,H-barH,W,barH);
    const top=Math.round(H-barH+3*U);
    for(let i=0;i<n;i++){
      const r=Math.floor(i/perRow), col=i%perRow;
      const cnt=Math.min(perRow,n-r*perRow);
      const rowW=cnt*(ps+gap)-gap;
      const x=Math.round((W-rowW)/2)+col*(ps+gap);
      const by=top+r*(ps+gap);
      paletteIcon(i,x,by,ps);
      if(i===selTool){X.strokeStyle=WHITE;X.lineWidth=Math.max(2,U);X.strokeRect(x-U,by-U,ps+2*U,ps+2*U);}
      if(inRect(x,by,ps,ps)&&M.click){setTool(i);sfx("click");}
    }
  }
  /* Left-column geometry, computed once here because both the selection row and
     the transport need it. It used to be worked out further down, so the
     selection row guessed at the transport's width and guessed wrong. */
  const bs=touchUsed?Math.max(TAP(),U*34):Math.max(28,U*30);
  const tSize=touchUsed?Math.max(TAP(),U*30):Math.max(26,U*26);
  const rSize=Math.max(TAP(),U*26);
  const colGap=4*U;
  const stackH=touchUsed?bs+colGap+rSize+colGap+tSize+colGap+tSize:0;
  const colBot=H-barH-colGap;
  const colTop=colBot-stackH;
  const menuBottom=pad+btnH(touchUsed?U*3:U*2)+6*U;
  const tightCol=touchUsed&&colTop<menuBottom;
  const colX=pad;
  const colY=touchUsed?(tightCol?Math.round(menuBottom):Math.round(colTop))
                      :Math.round(H/2-bs/2);
  const tw=tSize;
  const th=touchUsed?tSize:Math.max(20,U*20);
  const ty=H-barH-th-4*U;
  // reset stacks above play/step only when the column has the height for it
  const stack=touchUsed&&(ty-th-colGap)>(colY+bs+colGap+rSize+colGap);
  // With reset hidden the row is one button narrower, and the space it was
  // reserving should be given back to whatever sits beside it.
  const transportCols=stack?2:(started?3:2);
  const transportRight=pad+transportCols*(tw+4*U)+6*U;

  // actions on a rectangle selection
  // A block in hand: say where it will land and how to commit or drop it.
  if(editing&&carry&&touchUsed){
    const bh3=Math.max(btnH(U*2),touchUsed?TAP():0);
    const pw3=btnW("PLACE",U*2), cw3b=btnW("CANCEL",U*2), gp3=6*U;
    let ax3=Math.max(transportRight,Math.round((W-(pw3+cw3b+gp3))/2));
    let ay3=H-barH-bh3-4*U;
    if(ax3+pw3+cw3b+gp3>W-pad){ ax3=Math.max(pad,W-pad-(pw3+cw3b+gp3)); }
    /* Read the state before the buttons run: both of them clear `carry`, so
       anything below that still reaches into it dies on the press. */
    const hint=carry.at?"press PLACE to drop it here"
                       :(touchUsed?"tap the board to position it":"click the board to position it");
    textFit(hint,ax3,ay3-textH(U)-2*U,Math.max(pw3+cw3b+gp3,W-pad-ax3),textH(U),DIM,"left",1,U);
    if(uiBtn(ax3,ay3,0,0,"PLACE",U*2)){ placeCarry(); consumeClick(); }
    if(uiBtn(ax3+pw3+gp3,ay3,0,0,"CANCEL",U*2)){ cancelCarry(); consumeClick(); }
  }
  if(editing&&sel&&!carry){
    // Finger-sized on touch: these were laid out for a cursor and were by far
    // the smallest targets on the screen.
    const is=touchUsed?Math.max(TAP(),U*30):Math.max(20,U*13);
    const gp=touchUsed?3*U:4*U, totW=6*is+5*gp;
    // transportRight is the real right edge of the transport block, hoisted
    // above so this row cannot land on top of it.
    let axx=Math.max(transportRight,Math.round((W-totW)/2));
    let ay=H-barH-is-4*U;
    if(axx+totW>W-pad){
      // No room beside the transport: put the row on its own line above it.
      axx=Math.max(pad,W-pad-totW);
      if(axx<transportRight) ay-=is+4*U;
    }
    if(uiBtn(axx,ay,is,is,"",1)) grabSel(true);
    iconCopy(axx,ay,is);
    if(uiBtn(axx+is+gp,ay,is,is,"",1)) grabSel(false);
    iconMove(axx+is+gp,ay,is);
    if(uiBtn(axx+2*(is+gp),ay,is,is,"",1)) deleteSel();
    iconTrash(axx+2*(is+gp),ay,is);
    // copy the selection as a standalone V3 code
    if(uiBtn(axx+3*(is+gp),ay,is,is,"",1)){
      const code=selCode(levelName);
      if(code) copyText(code).then(ok=>
        say(ok?"selection copied as a V3 code":"could not copy - clipboard blocked",!ok));
    }
    iconClipboard(axx+3*(is+gp),ay,is);
    // ...or keep it as a named schematic
    if(uiBtn(axx+4*(is+gp),ay,is,is,"",1)){
      if(storageBlocked()) say(NO_STORE,true);
      else{
        const code=selCode();
        const nm=code&&prompt("Name this schematic:","");
        if(nm){ const err=schemSave(nm,code);
          if(err) say(err,true); else { say('schematic "'+nm+'" saved'); schemOpen=true; } }
      }
    }
    iconClipCookie(axx+4*(is+gp),ay,is);
    if(storageBlocked()){ X.fillStyle="rgba(0,0,0,.55)"; X.fillRect(axx+4*(is+gp),ay,is,is); }
    // fill the selection with a random arrangement
    if(uiBtn(axx+5*(is+gp),ay,is,is,"",1)){
    // Start from the cell you were last building with, so the usual case is
    // open-and-press-FILL rather than a form to fill in.
    if(!fillTypes().length&&lastCell) fillOnly(lastCell.t,selRot);
    fillSnapshot(); openModal("fill");
  }
    iconFill(axx+5*(is+gp),ay,is);
    if(!touchUsed)
      textFit("q/e turns a picked-up block",axx,ay-textH(U)-2*U,
              Math.max(totW,W-pad-axx),textH(U),DIM,"left",1,U);
  }
  // --- top left
  const menuU=touchUsed?U*3:U*2;
  if(uiBtn(pad,pad,0,0,"MENU",menuU)){ paused=true; consumeClick(); }
  const ty0=pad+btnH(menuU)+3*U;
  /* The tick counter goes beside MENU when the column below is occupied,
     otherwise it would sit underneath the tool preview. */
  // On touch the space under MENU belongs to the tool column, so the counter
  // always goes beside the button rather than under it.
  const tickBeside=touchUsed;
  if(tickBeside) text(grp(tickCount),pad+btnW("MENU",menuU)+5*U,pad+U,U*3,WHITE,"left",1);
  else text(grp(tickCount),pad+U,ty0,U*2,WHITE,"left",1);
  /* The title is the level's name and the description is instructions for
     playing it -- two different kinds of text, so they no longer look alike.
     The title is larger and white with a rule under it; the description is
     small, grey and indented beneath. */
  /* The box has to be measured in the glyphs actually drawn. At 60*U it was
     sized as though the text were scale 1, so the title never fitted at U*2 and
     fitScale shrank it to scale 1 -- leaving the name three times smaller than
     its own description. */
  const glyph=(FONT_W+1)*U;
  const textBoxW=Math.max(Math.min(24*glyph,W-2*pad),Math.min(40*glyph,W*0.42));
  if(levelName&&!tickBeside)
    textFitMid(levelName,pad+U,ty0+textH(U*2)+2*U,textBoxW,textH(U*2),WHITE,"left",2,U*2);
  /* A level's description is written for whoever is playing it, so it belongs
     on screen rather than buried in a menu. Wrapped to the width it has and
     capped at three lines. */
  if(levelDesc){
    /* 70*U was sized as though the text were drawn at scale 1. It is drawn at
       scale U, so each glyph is U times wider and the box held about seven
       characters. Size it from the glyph width actually used. */
    const dw=textBoxW;
    let dy=(tickBeside?pad+textH(U*3)+3*U
                     :ty0+textH(U*2)+2*U+(levelName?textH(U*2)+2*U:0));
    /* The tool column owns the left edge from colY down. Above it there is
       often only a line or two of space, so if the whole description will not
       fit there the text steps around the column instead of being cut: it is
       indented past the column's right edge, where the height is free. */
    const wrapTo=(width,cap)=>{
      const out=[]; let cur="";
      for(const w2 of levelDesc.split(/\s+/)){
        const t2=cur?cur+" "+w2:w2;
        if(textW(t2,U,1)>width-3*U&&cur){ out.push(cur); cur=w2; if(out.length===cap) return {lines:out,cut:true}; }
        else cur=t2;
      }
      if(cur) out.push(cur);
      return {lines:out,cut:false};
    };
    const spot=(x,room)=>{
      const width=Math.min(dw,Math.max(8*glyph,W-x-pad-2*glyph));
      const cap=Math.max(0,Math.min(4,Math.floor(room/textH(U))));
      const r=wrapTo(width,cap);
      return {x,width,cap,lines:r.lines,cut:r.cut||r.lines.length>cap};
    };
    let put=spot(pad+3*U,Math.max(0,colY-2*U-dy));
    if(put.cut){
      // beside the column rather than above it
      const alt=spot(pad+bs+6*U,Math.max(0,H-barH-10*U-dy));
      if(!alt.cut||alt.lines.length>put.lines.length) put=alt;
    }
    const dx=put.x, dwUse=put.width;
    const lines=put.lines.slice(0,put.cap);
    if(lines.length){
      // the rule only reads as "under the name" when the text is still under it
      if(levelName&&!tickBeside&&dx===pad+3*U){
        X.fillStyle="#5a5a5a"; X.fillRect(pad+U,dy-2*U,Math.min(dwUse,40*U),Math.max(1,U));
      }
      // a description cut short says so rather than just stopping
      if(put.cut&&lines.length)
        lines[lines.length-1]=clipText(lines[lines.length-1]+" ...",dwUse-3*U,U,1);
      for(let i=0;i<lines.length;i++)
        textFit(lines[i],dx,dy+i*textH(U),dwUse-3*U,textH(U),"#8f8f8f","left",1,U);
    }
  }
  /* --- bottom right: the rate actually achieved.
     Three things already live in this corner, so it has to clear all of them:
     the palette bar along the bottom, the selection action row that sits just
     above it, and the schematics drawer down the right-hand side. */
  {
    const lab=grp(tpsReal>=100?Math.round(tpsReal):tpsReal>=10?tpsReal.toFixed(0)
                 :tpsReal.toFixed(1))+" tps";
    const bw2=textW("888,888 tps",U,1)+4*U, bh2=textH(U)+3*U;
    const selIs=touchUsed?Math.max(TAP(),U*30):Math.max(20,U*13);
    const selRowH=(editing&&sel&&!carry)?selIs+8*U:0;
    const schW=schemOpen?(touchUsed?Math.min(Math.round(W*0.72),260*U)
                                   :Math.min(Math.round(W*0.42),190*U)):0;
    const bx2=W-schW-pad-bw2, by2=H-barH-selRowH-bh2-4*U;
    X.fillStyle="rgba(0,0,0,.55)"; X.fillRect(bx2,by2,bw2,bh2);
    textFit(playing?lab:"paused",bx2,by2+1.5*U,bw2,textH(U),
            playing?"#8f8f8f":"#5a5a5a","center",1,U);
    reserve(bx2,by2,bw2,bh2);
  }
  // --- top right
  // Twice the old length: a longer track means finer control over the speed,
  // and it is the one slider always on screen.
  /* Twice the old length. Both limits had to double: the 65*U cap was the one
     actually binding on a wide screen, so raising only the percentage left the
     slider unchanged everywhere except a narrow phone. */
  /* Twice the old length. Both limits had to double -- the 65*U cap was the one
     actually binding on a wide screen. The last term keeps the label, and the
     MENU button beside it, from being run over on a narrow phone.

     The reserved label space is the WIDEST label, not the current one. Using the
     current one fed the value back into the geometry that produced it: picking
     "10 tps" is wider than "5 tps", so the track shrank, which moved the value
     under a motionless finger back to 5, which widened the track again. At the
     right width that never settles and the speed flips every single frame. */
  const menuRight=pad+btnW("MENU",menuU)+(tickBeside?textW(String(tickCount),U*3,1)+7*U:2*U);
  const labelW=Math.max(...TPS.map((_,i)=>textW(tpsLabelFor(i),U*2,1)));
  const grabPad0=touchUsed?Math.max(TAP()/2,8*U):5*U;
  /* Never smaller than a usable track. On a 320pt phone the reserve for MENU
     and the label eats the whole row, and the slider collapsed to nothing --
     the speed control simply was not there. Below that floor the label moves
     onto its own line above the track instead of sharing the row. */
  // A floor, but not one that can push the track back under MENU: on a 320pt
  // screen 30% of the width was wider than the space actually left.
  const minSw=Math.min(Math.max(40*U,W*0.30),W-2*pad-2*grabPad0);
  const roomOnRow=W-pad-menuRight-labelW-8*U;
  const labelInline=roomOnRow>=minSw;
  /* When the label drops to its own line the track moves down a row, where the
     schematics toggle lives on the right. Leave room for it, plus the slider's
     own grab radius, or the two overlap. */
  const grabPad=grabPad0;
  const schemW=(touchUsed?Math.max(TAP(),U*32):Math.max(22,U*15))+6*U;
  // On the second line the track shares the row with the schematics toggle, so
  // it ends where that begins rather than at the screen edge.
  const trackRight=labelInline?W-pad:W-schemW-grabPad;
  /* On the second line the track sits low enough to run into the MENU button,
     which is tall on touch. Start it clear of whichever is further right: the
     screen edge padding, or MENU when their bands overlap. */
  const menuBot=pad+btnH(menuU);
  const slTopTwoLine=pad+U+textH(U*2)+3*U;
  const clearsMenu=labelInline||slTopTwoLine>menuBot;
  const trackLeft=clearsMenu?pad+grabPad0:menuRight+grabPad0;
  const avail=trackRight-trackLeft;
  const sw=Math.max(Math.min(minSw,avail),
                    Math.min(130*U,W*0.56,labelInline?roomOnRow:avail));
  const sx2=Math.max(trackLeft,trackRight-sw);
  // Inline the label beside the track when it fits; otherwise it goes on the
  // line above, with the track pushed clear of it by the label's full height
  // plus the slider's own grab radius.
  const slY=labelInline?pad+U+textH(U*2)/2
                       :pad+U+textH(U*2)+3*U+(touchUsed?Math.max(TAP()/2,8*U):5*U);
  text(tpsLabel(),labelInline?sx2-4*U:W-pad,pad+U,U*2,WHITE,"right",1);
  const t=uiSlider("tps",sx2,slY,sw,tpsIdx/(TPS.length-1));
  tpsIdx=Math.round(t*(TPS.length-1));
  // --- left column: preview + transport
  const px=colX, py=colY;
  if(editing){
    reserve(px,py,bs,bs);
    const hot=inRect(px,py,bs,bs);
    frame(px,py,bs,bs,hot);
    const isz=Math.round(bs*0.6);
    if(selTool<9) X.drawImage(spriteFor(PALETTE[selTool],selRot,isz),px+(bs-isz)/2,py+(bs-isz)/2,isz,isz);
    else paletteIcon(selTool,px+(bs-isz)/2,py+(bs-isz)/2,isz);
    if(hot&&M.click){selRot=(selRot+1)&3;sfx("click");}
    if(touchUsed){
      /* "Q / E" is meaningless without a keyboard. The mockup puts two curved
         arrows there instead, so rotating is reachable with a finger. */
      const rs=rSize;
      /* Side by side under the preview when the column fits; when it does not,
         the two turn buttons go to the right of the preview so the column stays
         short enough for the transport below it. */
      const r1x=tightCol?px+bs+3*U:px, r1y=tightCol?py:py+bs+colGap;
      const r2x=tightCol?px+bs+3*U:px+rs+3*U, r2y=tightCol?py+rs+3*U:r1y;
      if(uiBtn(r1x,r1y,rs,rs,"",1)){ if(carry) rotateCarry(3); else selRot=(selRot+3)&3; sfx("click"); }
      iconTurn(r1x,r1y,rs,-1);
      if(uiBtn(r2x,r2y,rs,rs,"",1)){ if(carry) rotateCarry(1); else selRot=(selRot+1)&3; sfx("click"); }
      iconTurn(r2x,r2y,rs,1);
    }else text("Q / E",px,py+bs+2*U,U,DIM,"left",1);
  }else{
    textFit("LEVEL",px,py,Math.max(30*U,bs),textH(U*2),"#6ec6ff","left",2,U*2);
    textFit(started?"running - R resets":"drag cells on a plus",
            px,py+textH(U*2)+2*U,Math.max(44*U,bs*2),textH(U),DIM,"left",1,U);
  }
  /* The mockup stacks these at the lower left: reset sits on its own above the
     play/step pair rather than all three in a row, which keeps them clear of
     the wider bottom bar and away from the middle of the board. */
  if(stack&&started){
    const ry2=ty-th-4*U;
    if(uiBtn(pad,ry2,tw,th,"",1)) restoreInitial();
    X.strokeStyle=WHITE; X.lineWidth=Math.max(2,U);
    X.beginPath(); X.arc(pad+tw/2,ry2+th/2,Math.min(tw,th)*0.26,0.6,5.4); X.stroke();
    X.fillStyle=WHITE;
    X.beginPath();
    X.moveTo(pad+tw/2+Math.min(tw,th)*0.30,ry2+th/2-Math.min(tw,th)*0.34);
    X.lineTo(pad+tw/2+Math.min(tw,th)*0.02,ry2+th/2-Math.min(tw,th)*0.20);
    X.lineTo(pad+tw/2+Math.min(tw,th)*0.34,ry2+th/2-Math.min(tw,th)*0.02);
    X.closePath(); X.fill();
  }
  if(uiBtn(pad,ty,tw,th,"",1)) togglePlay();
  X.fillStyle=WHITE;
  if(playing){X.fillRect(pad+tw*0.34,ty+th*0.26,tw*0.1,th*0.48);
              X.fillRect(pad+tw*0.54,ty+th*0.26,tw*0.1,th*0.48);}
  else{X.beginPath();X.moveTo(pad+tw*0.36,ty+th*0.24);X.lineTo(pad+tw*0.7,ty+th*0.5);
       X.lineTo(pad+tw*0.36,ty+th*0.76);X.closePath();X.fill();}
  const sx3=pad+tw+4*U;
  if(uiBtn(sx3,ty,tw,th,"",1)){playing=false; beginRun();
    world.trackMotion=interpOn(); world.clearMotion();
    world.tick(); world.trackMotion=false;
    if(interpOn()){ tickAt=now; tickDur=190; } else tickDur=0;
    tickCount++; noteTicks(1,now); voiceWorld();}
  X.fillStyle=WHITE;
  X.beginPath();X.moveTo(sx3+tw*0.3,ty+th*0.24);X.lineTo(sx3+tw*0.6,ty+th*0.5);
  X.lineTo(sx3+tw*0.3,ty+th*0.76);X.closePath();X.fill();
  X.fillRect(sx3+tw*0.64,ty+th*0.24,tw*0.08,th*0.52);
  if(!stack&&started){
    const rx=sx3+tw+4*U;
    if(uiBtn(rx,ty,tw,th,"",1)) restoreInitial();
    X.strokeStyle=WHITE; X.lineWidth=Math.max(2,U);
    X.beginPath(); X.arc(rx+tw/2,ty+th/2,Math.min(tw,th)*0.26,0.6,5.4); X.stroke();
    X.fillStyle=WHITE;
    X.beginPath();
    X.moveTo(rx+tw/2+Math.min(tw,th)*0.30,ty+th/2-Math.min(tw,th)*0.34);
    X.lineTo(rx+tw/2+Math.min(tw,th)*0.02,ty+th/2-Math.min(tw,th)*0.20);
    X.lineTo(rx+tw/2+Math.min(tw,th)*0.34,ty+th/2-Math.min(tw,th)*0.02);
    X.closePath(); X.fill();
  }
  if(editing) drawSchematics(pad,barH);
  if(!paused&&!modal) boardInput(dt);
}

/* A dock on the right holding V3 snippets. Clicking one picks it up as a
   floating block, so placing a schematic is the same gesture as pasting a
   selection -- click to stamp, q/e to turn it, right click to drop it. */
function drawSchematics(pad,barH){
  // Touch gets a bigger toggle, a wider drawer and taller rows: at cursor sizes
  // the list was a column of targets a finger could not reliably hit.
  const is=touchUsed?Math.max(TAP(),U*32):Math.max(22,U*15);
  const pw=touchUsed?Math.min(Math.round(W*0.72),260*U)
                    :Math.min(Math.round(W*0.42),190*U);
  const top=Math.round(pad+textH(U*2)+9*U);   // clear of the tps row
  const bot=H-barH-4*U;
  const px=schemOpen?W-pw:W;
  const bx=px-is-3*U, by=top;
  reserve(bx,by,is+3*U,is);
  const hot=inRect(bx,by,is,is);
  frame(bx,by,is,is,hot);
  iconSchem(bx,by,is);
  if(hot&&M.click){ schemOpen=!schemOpen; sfx("click"); consumeClick(); }
  if(!schemOpen) return;

  X.fillStyle="rgba(120,120,120,.94)"; X.fillRect(px,top,pw,bot-top);
  X.strokeStyle=WHITE; X.lineWidth=Math.max(1,U);
  X.strokeRect(px+U/2,top+U/2,pw-U,bot-top-U);
  reserve(px,top,pw,bot-top);

  const m=5*U;
  let y=top+m;
  const addH=touchUsed?Math.max(TAP(),btnH(U)+textH(U*2)+4*U):btnH(U)+textH(U)+2*U;
  if(uiBtn(px+m,y,pw-2*m,addH,"",1)){
    if(storageBlocked()){ say(NO_STORE,true); return; }
    const code=prompt("Paste a V3 schematic code:");
    if(code&&code.trim()){
      try{
        importCode(code.trim());                    // reject junk before storing
        const nm=prompt("Name this schematic:","");
        if(nm){ const err=schemSave(nm,code.trim());
          if(err) say(err,true); else say('schematic "'+nm+'" saved'); }
      }catch(e){ say("not a readable code: "+e.message,true); }
    }
  }
  textWrapFit("Add V3 schematic",px+m+2*U,y,pw-2*m-4*U,addH,WHITE,"center",1,U*2);
  y+=addH+3*U;

  const rowH=touchUsed?Math.max(TAP(),textH(U*2)+8*U):textH(U)+4*U;
  const qs=touchUsed?Math.max(TAP(),U*20):Math.max(14,U*10);
  textField("schemq",px+m,y,pw-2*m-qs-3*U,rowH,"search...",U);
  if(uiBtn(px+pw-m-qs,y,qs,qs,"",1)) openModal("schemhelp");
  textFit("?",px+pw-m-qs,y,qs,qs,WHITE,"center",1,U*2);
  y+=Math.max(rowH,qs)+3*U;

  const all=schemList();
  const q=schemQuery.toLowerCase();
  const list=q?all.filter(e=>e.name.toLowerCase().includes(q)):all;
  const listTop=y, listBot=bot-m;
  const visible=Math.max(1,Math.floor((listBot-listTop)/(rowH+2*U)));
  schemScroll=wheelScroll(px,listTop,pw,listBot-listTop,schemScroll,list.length,visible);
  if(!list.length){
    textWrapFit(storageBlocked()
        ? "saving is disabled - this browser gives the page no storage"
        : (all.length?"nothing matches that search"
                     :"nothing saved yet - select cells, then use the clipboard-and-cookie button"),
      px+m,y,pw-2*m,textH(U)*5,storageBlocked()?"#a33":"#222","left",1,U);
    return;
  }
  const sbW=Math.max(4,U*3), delW=touchUsed?Math.max(TAP(),U*22):Math.max(12,U*9);
  for(const e of list.slice(schemScroll,schemScroll+visible)){
    if(uiBtn(px+m,y,pw-2*m-delW-sbW-4*U,rowH,"",1)){
      try{ carryFromCode(e.code); setTool(TOOL_SELECT); schemOpen=false; consumeClick();
           say('placing "'+e.name+'" - left click to place, q/e turns it'); }
      catch(err){ say("schematic is corrupt",true); }
    }
    textFit(e.name,px+m+3*U,y,pw-2*m-delW-sbW-10*U,rowH,WHITE,"left",1,touchUsed?U*2:U);
    if(uiBtn(px+pw-m-delW-sbW-2*U,y,delW,rowH,"",1)){ schemDrop(e.name); say("deleted"); }
    X.strokeStyle=WHITE; X.lineWidth=Math.max(touchUsed?3:1,U);
    const cxm=px+pw-m-delW-sbW-2*U+delW/2, cym=y+rowH/2;
    const r=delW*(touchUsed?0.30:0.22);
    X.beginPath();
    X.moveTo(cxm-r,cym-r); X.lineTo(cxm+r,cym+r);
    X.moveTo(cxm+r,cym-r); X.lineTo(cxm-r,cym+r);
    X.stroke();
    y+=rowH+2*U;
  }
  scrollBar(px+pw-m-sbW,listTop,sbW,listBot-listTop,schemScroll,list.length,visible);
}

/* --- overlays: every panel is sized from the content it must hold ---------- */
function panelRect(needW,needH,ink,fill){
  const w=Math.round(Math.min(W-8*U,Math.max(60*U,needW)));
  const h=Math.round(Math.min(H-8*U,Math.max(50*U,needH)));
  const x=Math.round((W-w)/2), y=Math.round((H-h)/2);
  X.fillStyle="rgba(0,0,0,.74)"; X.fillRect(0,0,W,H);
  X.fillStyle=fill||"rgba(122,122,122,.94)"; X.fillRect(x,y,w,h);
  X.strokeStyle=ink||WHITE; X.lineWidth=Math.max(1,U); X.strokeRect(x+U/2,y+U/2,w-U,h-U);
  reserve(0,0,W,H);
  return {x,y,w,h};
}
function closeBtn(p,u){
  u=u||U;
  // The corner X closes the panel, so on touch it gets a full tap target
  // rather than the cursor-sized square it was.
  const s=touchUsed?Math.max(TAP(),u*11):Math.max(16,u*11);
  const x=p.x+p.w-s-4*u, y=p.y+4*u;
  reserve(x,y,s,s);
  const hot=inRect(x,y,s,s);
  frame(x,y,s,s,hot);
  X.strokeStyle=WHITE; X.lineWidth=Math.max(2,u);
  const m=s*0.3;
  X.beginPath();
  X.moveTo(x+m,y+m);     X.lineTo(x+s-m,y+s-m);
  X.moveTo(x+s-m,y+m);   X.lineTo(x+m,y+s-m);
  X.stroke();
  return hot&&M.click&&(sfx("click"),true);
}
function iconCog(x,y,s){

function iconMove(x,y,s){

// Curved arrow: an arc with a head at one end. dir -1 turns anticlockwise.
function iconTurn(x,y,s,dir){

function overlayPause(){
  /* Everything is measured and drawn at the same unit. It used to measure at
     full size, shrink the panel to fit the window, then draw the contents at
     full size anyway -- so on a short or narrow window the panel got smaller
     while its contents did not, and they spilled out of it. */
  const fit=u=>{
    const hs=u*3, m=8*u, gap=5*u;
    const labW=Math.max(textW("MUSIC",hs,2),textW("SFX",hs,2));
    const sldW=Math.max(24*u,Math.min(80*u,W*0.26));
    const is=Math.max(u*14,textW("copy",u,1)+3*u,btnW("?",u*2),btnH(u*2));
    const capH=Math.max(textH(u*2)+4*u,btnH(u));
    const capW=Math.max(textW("DESCRIPTION",u,1),textW("NAME",u,1))+4*u;
    const needW=Math.max(labW+gap+sldW,6*is+5*gap,
                         btnW("Exit",hs)+btnW("Resume",hs)+12*u,
                         capW+40*u)+2*m;
      const needH=m+textH(hs)+gap+textH(hs)+gap*2+2*capH+2*u+gap
                 +(mode==="level"?textH(u)+2*u:0)
                 +is+textH(u)+gap*2+btnH(hs)+m;
    return {u,hs,m,gap,labW,sldW,is,capH,capW,needW,needH};
  };
  let g=fit(U);
  while(g.u>1&&(g.needH>H-8*U||g.needW>W-8*U)) g=fit(g.u-1);
  const {u,hs,m,gap,sldW,is,capH,capW}=g;
  const p=panelRect(g.needW,g.needH);
  let y=p.y+m;
  const sx=p.x+p.w-m-sldW;
  text("MUSIC",p.x+m,y,hs,WHITE,"left",2);
  S.musicVol=uiSlider("pm",sx,y+textH(hs)/2,sldW,S.musicVol);
  y+=textH(hs)+gap;
  text("SFX",p.x+m,y,hs,WHITE,"left",2);
  S.sfxVol=uiSlider("ps",sx,y+textH(hs)/2,sldW,S.sfxVol);
  y+=textH(hs)+gap*2;
  // The level's name and description arrive with the code. Click one and type.
  textFit("NAME",p.x+m,y+(capH-textH(u))/2,capW,textH(u),DIM,"left",1,u);
  if(mode==="level") readOnlyField(levelName||"untitled",p.x+m+capW,y,p.w-2*m-capW,capH,u,WHITE,u*2);
  else textField("lname",p.x+m+capW,y,p.w-2*m-capW,capH,"untitled",u);
  y+=capH+2*u;
  textFit("DESCRIPTION",p.x+m,y+(capH-textH(u))/2,capW,textH(u),DIM,"left",1,u);
  if(mode==="level") readOnlyField(levelDesc||"none",p.x+m+capW,y,p.w-2*m-capW,capH,u,"#8f8f8f",u);
  else textField("ldesc",p.x+m+capW,y,p.w-2*m-capW,capH,"none",u);
  y+=capH+gap;
  if(mode==="level")
    textFit("a loaded level keeps its own name and description",
            p.x+m,y,p.w-2*m,textH(u),"#444","left",1,u), y+=textH(u)+2*u;

  let ix=p.x+m;
  const slot=(draw,cap,act)=>{
    if(uiBtn(ix,y,is,is,"",1)) act();
    draw(ix,y,is);
    textFit(cap,ix,y+is+u,is,textH(u),"#222","center",1,u);
    ix+=is+gap;
  };
  // stays inside the sandbox -- opens a popup rather than navigating away
  slot((x,y2,s)=>textFit("?",x,y2,s,s,WHITE,"center",1,u*2),"help",()=>openModal("help"));
  slot(iconCog,"opts",()=>openModal("settings"));
  slot(iconCopy,"copy",()=>
    copyText(exportV3(initialWorld(),initialMask(),levelName,levelDesc)).then(ok=>
      say(ok?(started?"copied the initial state, not the run":"level code copied to clipboard")
            :"could not copy - clipboard blocked",!ok)));
  const saveX=ix;
  slot(iconSave,"save",()=>{
    if(storageBlocked()){ say(NO_STORE,true); return; }
    const nm=prompt("Name your creation:",levelName||"untitled");
    if(nm){ const err=cookieSave(nm,exportV3(initialWorld(),initialMask(),nm,levelDesc));
      if(err) say(err,true);
      else { levelName=nm; say('saved "'+nm+'"'+(started?" (initial state)":"")); } }
  });
  if(storageBlocked()){ X.fillStyle="rgba(0,0,0,.55)"; X.fillRect(saveX,y,is,is); }
  slot(iconLoad,"load",()=>openModal("load"));
  slot(iconWorld,"size",()=>{
    fieldW=String(world?world.W:28); fieldH=String(world?world.H:18);

  const by=p.y+p.h-m-btnH(hs);

  if(uiBtn(p.x+p.w-m-btnW("Resume",hs),by,0,0,"Resume",hs)) paused=false;
}
/* Leaving a level throws away anything unsaved, so it asks first. The whole
   panel is yellow -- border, text and buttons -- to mark it out from the grey
   informational panels as something that wants a decision. */
const YELLOW="#ffd23f";

  const hs=U*2, m=8*U;

                       btnW("EXIT",hs)+btnW("STAY",hs)+10*U)+2*m;

  // so the panel came out short and the text sat under the buttons.
  const needH=m+textH(hs)+3*U+textH(U)+10*U+btnH(hs)+m;
  const u=Math.max(1,Math.min(U,Math.floor(U*(H-8*U)/Math.max(1,needH))));

function overlayHelp(){
  const m=8*U, unit=FONT_W+2;
  const keyU=Math.max(...CONTROLS.map(([k])=>k.length))*unit;
  const descU=Math.max(...CONTROLS.map(([,d])=>d.length))*unit;
  const gapU=3*unit;
  // Pick the panel first, then fit the text inside it. Fitting the text to the
  // window and sizing the panel to the text left the description column ending
  // exactly on the panel edge, which read as overflowing.
  const pw=Math.min(W-14*U,Math.max(80*U,Math.round(W*0.82)));
  const bodyW=pw-2*m-6*U;
  let sc=U*2;
  while(sc>1&&(keyU+gapU+descU)*sc>bodyW) sc--;
  const lineH=textH(sc)+4*U;
  const head=Math.max(textH(U*2),U*11);
  const needH=m+head+5*U+CONTROLS.length*lineH+5*U+m;
  const ph=Math.min(H-8*U,needH);
  const p=panelRect(pw,ph);
  const u=U;
  textFit("CONTROLS",p.x+m,p.y+m,p.w-2*m-14*u,head,WHITE,"left",2,u*2);
  if(closeBtn(p,u)) closeModal();
  // dark plate behind the list: blue on grey would be unreadable
  const ly=p.y+m+head+3*u;
  const lh=Math.min(CONTROLS.length*lineH+2*u,p.y+p.h-m-ly);
  X.fillStyle="#000"; X.fillRect(p.x+m,ly,p.w-2*m,lh);
  let y=ly+2*u;
  const dx=p.x+m+3*u+(keyU+gapU)*sc;
  for(const [k,d] of CONTROLS){
    if(y+textH(sc)>ly+lh) break;
    text(k,p.x+m+3*u,y,sc,WHITE,"left",2);
    text(d,dx,y,sc,BLUE,"left",2);
    y+=lineH;
  }
}

// One tile in the fill panel: a cell picture, an optional percentage strip,

function fillTile(x,y,ts,t,rot,on,lab){
  X.fillStyle=on?"#1d3448":"#111"; X.fillRect(x,y,ts,ts);
  if(t===-2){
    // the plus that marks where a level lets you build, struck through when
    // the entry is the one that takes the mark away again
    const off=rot===1;
    const th=Math.max(2,ts*0.11), cx=x+ts/2, cy=y+ts*0.38, arm=ts*0.20;
    X.fillStyle=off?"#7a3a3a":"#3fa63f";

      X.beginPath();

function overlayFill(){
  const m=8*U, hs=U*2, head=Math.max(textH(hs),U*11);
  const cols=Math.min(FILL_TYPES.length,W<560?5:10);
  const rows=Math.ceil(FILL_TYPES.length/cols);

  const hasRots=cur!==null&&nrots(cur)>1;
  const ctlH=Math.max(btnH(hs),textH(hs)+4*U);

                    2*m+btnW("FILL",hs)+btnW("CLEAR",hs)+btnW("CANCEL",hs)+14*U,

          p.x+m,y,p.w-2*m,textH(U),DIM,"left",1,U);

  // --- the cells. click adds, clicking the highlighted one again drops it

    if(hitR(cx,cy,ts,ts)){                    // right: take it out of the mix
      delete fillW[t];

      if(fillPick===t) fillPick=null;

    } else if(hitM(cx,cy,ts,ts)){             // middle: straight to its facings
      if(!w) fillW[t]=50;
      fillPick=t;
      if(t>=0&&nrots(t)>1){ fillRotPick=0; rotSnapshot(t); openModal("fillrot"); }
      consumeClick();
    } else if(hit){                           // left: add it, or pick it up again
      if(w>0&&fillPick===t){ delete fillW[t];
        for(let r=0;r<4;r++) delete fillRW[t+":"+r];
        fillPick=null;
      } else {
        if(!w){
          fillW[t]=50;
          // an even split of place and unplace would be nonsense as a default
          if(t===-2&&fillRW["-2:0"]===undefined&&fillRW["-2:1"]===undefined){

             :cur<0?"AIR":(NAMES[cur]||"CELL")).toUpperCase();

    const fbW=hasRots?btnW("FACINGS",hs)+6*U:0;
    const sx=p.x+m+nw+8*U;
    const pctW=textW("99999  100%",U,1)+4*U;
    const sw=Math.max(24*U,p.x+p.w-m-fbW-pctW-sx-6*U);
    fillCap=growCap(fillCap,fillW[cur],false);
    const v=uiSlider("fw",sx,y+ctlH/2,sw,Math.min(1,(fillW[cur]-1)/(fillCap-1)));
    fillW[cur]=Math.max(1,Math.round(v*(fillCap-1))+1);
    fillCap=growCap(fillCap,fillW[cur],v>=0.999);
    // the raw weight as well as the share, since the weight is now unbounded
    textFit(fillW[cur]+"  "+fillPctOf(cur)+"%",sx+sw+4*U,y+(ctlH-textH(U))/2,
            pctW,textH(U),"#6ec6ff","left",1,U);
    const rotLab=cur===-2?"STATES":"FACINGS";
    if(hasRots&&uiBtn(p.x+p.w-m-btnW(rotLab,hs),y,0,0,rotLab,hs)){
      fillRotPick=0; rotSnapshot(cur); openModal("fillrot");
    }
    y+=ctlH+6*U;
  }

  // before there was a choice.
  const swx=p.x+p.w-m-(touchUsed?Math.round(toggleH()*2):16*U);
  textFit("Overwrite air",p.x+m,y+(swH-textH(U))/2,swx-p.x-m-4*U,textH(U),WHITE,"left",1,U);
  fillOverAir=uiToggleAt(swx,y+swH/2,fillOverAir);

  fillOverCells=uiToggleAt(swx,y+swH/2,fillOverCells);
  y+=swH+6*U;

  const by=p.y+p.h-m-btnH(hs);
  if(uiBtn(p.x+m,by,0,0,"FILL",hs)){
    if(!picked.length) say("click at least one cell first",true);
    else { fillSelection(); closeModal(); }
  }
  const cw2=btnW("CANCEL",hs);
  if(uiBtn(p.x+p.w-m-cw2,by,0,0,"CANCEL",hs)){ fillRestore(); closeModal(); }
  // CLEAR is not apply and not cancel, so it sits between them
  const clw=btnW("CLEAR",hs);
  const cmid=p.x+p.w-m-cw2-6*U-clw;
  if(cmid>p.x+m+btnW("FILL",hs)+6*U&&uiBtn(cmid,by,0,0,"CLEAR",hs)){
    for(const k of Object.keys(fillW)) delete fillW[k];
    for(const k of Object.keys(fillRW)) delete fillRW[k];

}

function resizeWorld(nw,nh,anchor){
  const ow=world.W, oh=world.H;

  const dy=(anchor===2||anchor===3)?nh-oh:0;
  const nWorld=new World(nw,nh), nMask=new Uint8Array(nw*nh);
  for(let y=0;y<oh;y++)for(let x=0;x<ow;x++){
    const tx=x+dx, ty=y+dy;

    const c=world.g[world.idx(x,y)];
    if(c) nWorld.setCell(nWorld.idx(tx,ty),c);
    nMask[ty*nw+tx]=placeMask[y*ow+x];
  }
  world=nWorld; placeMask=nMask;
  rescanMask();

  clearSel(); carry=null; dragCell=null;
  snapshotInitial(); centreCam();
}

    if(on&&(Math.floor(now/450)&1))
      X.fillRect(bx+4*u+textW(val,HS,2)+u,y+3*u,Math.max(1,u),BH-6*u);
    if(hot&&M.click){ editField(key,label==="WIDTH"?"World width (1-9999)"
                                                   :"World height (1-9999)");
                      sfx("click"); }
    y+=BH+3*u;
  };
  box("WIDTH","w",fieldW);
  box("HEIGHT","h",fieldH);
  y+=4*u;
  textFit("anchor - which corner stays put",p.x+m,y,p.w-2*m,textH(u),"#222","left",1,u);
  y+=textH(u)+3*u;
  const cs=Math.max(16,u*10);
  for(let i=0;i<4;i++){
    const bx=p.x+m+(i%2)*(cs+3*u), by=y+((i/2)|0)*(cs+3*u);
    if(uiBtn(bx,by,cs,cs,"",1)) szAnchor=i;
    X.fillStyle=szAnchor===i?"#6ec6ff":"#666";
    X.fillRect(bx+cs*0.22,by+cs*0.22,cs*0.56,cs*0.56);
  }
  const by=p.y+p.h-m-btnH(HS);
  // Cancel on the left, apply on the right.
  if(uiBtn(p.x+p.w-m-btnW("CANCEL",HS),by,0,0,"CANCEL",HS)) closeModal();
  if(uiBtn(p.x+m,by,0,0,"APPLY",HS)){
    // 9999 x 9999 is 100 million cells -- around 270 MB of engine state, which
    // is heavy but real. Anything past the 32-bit index ceiling is refused by
    // the World constructor rather than silently corrupting.
    const nw=Math.max(1,Math.min(9999,parseInt(fieldW,10)||0));
    const nh=Math.max(1,Math.min(9999,parseInt(fieldH,10)||0));
    if(!nw||!nh) say("enter a width and height",true);
    else{
      try{
        resizeWorld(nw,nh,szAnchor);
        say(`world is ${nw} x ${nh}`+(nw*nh>4e6?` (${(nw*nh/1e6).toFixed(1)}M cells)`:""));
        closeModal();
      }catch(e){ say("could not resize: "+e.message,true); }
    }
  }
}
const SCHEM_HELP=[
  "Schematics are V3 level codes kept in your browser's storage, so you can "+
  "reuse a machine without rebuilding it.",
  "",
  "TO SAVE ONE: choose the square select tool, drag a box round some cells, "+
  "then press the clipboard-and-cookie button and give it a name.",
  "",
  "TO PLACE ONE: click it in the list. It becomes a floating block - click the "+
  "board to stamp it, q or e to turn it, right click to drop it.",
  "",
  "Add V3 schematic takes a code from anywhere; it is checked before it is "+
  "stored, so a bad paste is refused rather than saved.",
  "",
  "Cookies are blocked on file:// pages. If saves keep vanishing, serve the "+
  "file over localhost instead."
];
function overlaySchemHelp(){
  const m=8*U, head=textH(U*2)+4*U;
  // sized against the window, not a multiple of U -- there is a lot of text
  const pw=Math.min(W-14*U,Math.max(80*U,Math.round(W*0.62)));
  const ph=Math.min(H-8*U,Math.max(60*U,Math.round(H*0.86)));
  const bodyW=pw-2*m, bodyH=ph-head-2*m-4*U;
  const blockH=sc=>SCHEM_HELP.reduce((a,para)=>
    a+(para?wrapWords(para,bodyW,sc,1).length*textH(sc)+2*sc:Math.round(textH(sc)/2)),0);
  let u=U;
  while(u>1&&blockH(u)>bodyH) u--;
  const p=panelRect(pw,ph);
  textFit("SCHEMATICS",p.x+m,p.y+m,p.w-2*m-14*U,head,WHITE,"left",2,U*2);
  if(closeBtn(p,U)) closeModal();
  let y=p.y+m+head+2*U;
  for(const para of SCHEM_HELP){
    if(!para){ y+=Math.round(textH(u)/2); continue; }
    for(const ln of wrapWords(para,bodyW,u,1)){
      if(y+textH(u)>p.y+p.h-m) return;
      text(clipText(ln,bodyW,u,1),p.x+m,y,u,"#222","left",1);
      y+=textH(u);
    }
    y+=2*u;
  }
}
function overlayLoad(){
  // Rows sized for a list, not for headings: a row was taller than the search
  // box, so a 14-entry list showed one entry.
  const hs=U*2, m=6*U, rowH=textH(U)+5*U, pasteW=btnW("PASTE CODE",U);
  const all=cookieList();
  const q=loadQuery.toLowerCase();
  const saves=q?all.filter(e=>e.name.toLowerCase().includes(q)):all;
  // A list wants room, so this panel takes a share of the window rather than
  // shrinking to its contents; the number of visible rows follows the height.
  const minW=Math.max(textW("LOAD",hs,2)+gapPad()+pasteW,
                      textW("storage confirmed: saves survived a previous session",U,1))+2*m;
  const u=U;
  const p=panelRect(Math.max(minW,Math.round(W*0.54)),Math.round(H*0.80));
  textFit("LOAD",p.x+m,p.y+m,p.w-2*m-pasteW-6*u,Math.max(textH(hs),rowH),WHITE,"left",2,hs);
  if(uiBtn(p.x+p.w-m-pasteW,p.y+m,0,0,"PASTE CODE",u)){
    const code=prompt("Paste a V1, V2 or V3 level code:");
    if(code){ try{ pending=importCode(code.trim()); openModal("variant"); }
              catch(e){ say("import failed: "+e.message,true); } }
  }
  let y=p.y+m+Math.max(textH(hs),rowH)+4*u;
  textField("loadq",p.x+m,y,p.w-2*m,rowH,"search...",u);
  y+=rowH+4*u;
  const st=storageStatus();
  textFit(st.text,p.x+m,y,p.w-2*m,textH(u),st.colour,"left",1,u);
  y+=textH(u)+4*u;

  const listTop=y, listBot=p.y+p.h-m-btnH(u)-5*u;
  const visible=Math.max(1,Math.floor((listBot-listTop)/(rowH+3*u)));
  loadScroll=wheelScroll(p.x+m,listTop,p.w-2*m,listBot-listTop,loadScroll,saves.length,visible);
  if(!saves.length)
    textFit(storageBlocked()?"":(all.length?"nothing matches that search":"no saved creations yet"),
            p.x+m,y,p.w-2*m,textH(u),"#222","left",1,u);
  const sbW=Math.max(4,u*3);
  const shown=saves.slice(loadScroll,loadScroll+visible);
  shown.forEach(e=>{
    const delW=Math.max(14,u*10);
    if(uiBtn(p.x+m,y,p.w-2*m-delW-sbW-6*u,rowH,"",1)){
      try{ pending=importCode(e.code); openModal("variant"); }
      catch(err){ say("saved code is corrupt",true); }
    }
    textFit(e.name,p.x+m+4*u,y,p.w-2*m-delW-sbW-12*u,rowH,WHITE,"left",1,u);
    if(uiBtn(p.x+p.w-m-delW-sbW-2*u,y,delW,rowH,"",1)){ cookieDrop(e.name); say("deleted"); }
    textFit("x",p.x+p.w-m-delW-sbW-2*u,y,delW,rowH,WHITE,"center",1,u);
    y+=rowH+3*u;
  });
  scrollBar(p.x+p.w-m-sbW,listTop,sbW,listBot-listTop,loadScroll,saves.length,visible);
  if(saves.length>visible)
    textFit(`${loadScroll+1}-${Math.min(saves.length,loadScroll+visible)} of ${saves.length}`,
            p.x+m+btnW("BACK",u)+6*u,p.y+p.h-m-btnH(u),p.w-2*m-btnW("BACK",u)-8*u,
            btnH(u),"#222","right",1,u);
  if(uiBtn(p.x+m,p.y+p.h-m-btnH(u),0,0,"BACK",u)) closeModal();
}
const gapPad=()=>10*U;
function overlayVariant(){
  const m=8*U, rowH=btnH(U*2);
  const title="Which Cell Machine is this from?";
  const rows=VARIANTS.map(v=>v.name+"   (detected)");
  const needW=Math.max(textW(title,U*2,1),...rows.map(r=>textW(r,U*2,1)))+2*m+8*U;
  const needH=m+textH(U*2)+4*U+textH(U)+6*U+VARIANTS.length*(rowH+4*U)+m;
    // shrink to fit the window height rather than running off the bottom
  const u=Math.max(1,Math.min(U,Math.floor(U*(H-8*U)/Math.max(1,needH))));
  const _k=u/U;
const p=panelRect(needW*_k,needH*_k);
  text(title,p.x+p.w/2,p.y+m,u*2,WHITE,"center",1);
  const det=detectVariant(pending);
  textFit("the code does not say - best guess: "+det.conf,p.x+m,p.y+m+textH(u*2)+4*u,
          p.w-2*m,textH(u),"#222","center",1,u);
  let y=p.y+m+textH(u*2)+4*u+textH(u)+6*u;
  VARIANTS.forEach(v=>{
    if(uiBtn(p.x+m,y,p.w-2*m,rowH,"",1)){
      loadLevel(pending); pending=null; paused=false; closeModal();
      afterLoad(mode);
      say("loaded "+world.W+"x"+world.H);
    }
    textFit(v.name+(v.id===det.guess?"   (detected)":""),p.x+m+4*u,y,p.w-2*m-8*u,rowH,
            WHITE,"left",1,u*2);
    y+=rowH+4*u;
  });
}
/* ===========================================================================
   MAIN LOOP
   =========================================================================== */
let last=performance.now();
function loop(t){
  now=t;
  const dt=Math.min(.1,(t-last)/1000); last=t;
  uiZones=[];
  // A finger held still on the board is a considered press, not a slip.
  if(touchMode===1&&touchStart&&!touchStart.ui&&!M.down&&
     performance.now()-touchStart.t>TAP_DELAY){
    M.x=touchStart.x; M.y=touchStart.y;
    M.down=true; M.click=true; M.pressUI=false;
  }
  musicPump();
  X.imageSmoothingEnabled=false;

  if(scr==="game"&&playing&&!paused&&!modal&&!won&&world){
    const target=TPS[tpsIdx];
    let n=0;
    if(target===Infinity){
      world.trackMotion=false; world.clearMotion(); tickDur=0;
      const t0=performance.now();
      while(performance.now()-t0<9){ world.tick(); n++; }
    }else{
      acc+=dt*target; n=Math.min(200000,Math.floor(acc)); acc-=n;
      // Only a single tick can be interpolated -- with several per frame the
      // intermediate states are gone, so it snaps rather than lying about them.
      /* Judged from the last tick rather than discovered during this one: a
         board that just moved a screenful will do it again, and building forty
         thousand map entries only to throw them away costs as much as the
         simulation. It re-enables itself the moment things settle.

         The count is of cells that moved ON SCREEN, so zooming into a corner of
         an exploding board still animates smoothly -- only what you are looking
         at has to be affordable. */
      setMotionWindow();
      const track=interpOn()&&n===1&&world.movedVisLast<=MOTION_CAP;
      if(n){ world.trackMotion=track; if(track) world.clearMotion(); }
      for(let i=0;i<n;i++) world.tick();
      world.trackMotion=false;
      if(n){
        // A tick that gave up on tracking part-way through has only half a
        // picture of what moved, so it snaps rather than easing some cells and
        // not others.
        if(track&&!world.motionOver){ tickAt=t; tickDur=1000/target; }
        else{ world.clearMotion(); tickDur=0; }
      }
    }
    if(n) tickCount+=n;
    noteTicks(n,t);
    voiceWorld(); checkWin();
  }

  /* A text box only holds focus while whatever drew it is still on screen.
     Closing the pause menu used to leave the name or description focused, so
     every key afterwards went on typing into an invisible field -- and since a
     focused field swallows the keyboard, the game's own keys stopped working. */
  if(focusField){
    const live={lname:paused&&!modal, ldesc:paused&&!modal,
                w:modal==="world", h:modal==="world",
                loadq:modal==="load", schemq:schemOpen, fillw:modal==="fill"};
    if(live[focusField]===false) focusField=null;
  }

  if(scr==="title") screenTitle(dt);
  else if(scr==="playmenu") screenPlayMenu();
  else if(scr==="options") screenOptions();
  else if(scr==="controls") screenControls();
  else if(scr==="game") screenGame(dt);
  if(scr==="game"&&won&&!modal) overlayWin();
  else if(scr==="game"&&paused&&!modal) overlayPause();
  if(modal==="exit") overlayExitConfirm();
  if(modal==="help") overlayHelp();
  if(modal==="settings") overlaySettings();
  if(modal==="fill") overlayFill();
  if(modal==="fillrot") overlayFillRot();
  if(modal==="world") overlayWorld();
  if(modal==="schemhelp") overlaySchemHelp();
  if(modal==="load") overlayLoad();
  if(modal==="variant"&&pending) overlayVariant();

  if(fadeTo!==null||fade>0){
    fade+=dt*5.5*(fadeTo!==null?1:-1);
    if(fadeTo!==null&&fade>=1){ scr=fadeTo; fadeTo=null; fade=1; }
    fade=Math.max(0,Math.min(1,fade));
    X.fillStyle="rgba(0,0,0,"+fade+")"; X.fillRect(0,0,W,H);
  }
  if(toast&&t-toastT<3400){
    const w=textW(toast,U,1)+8*U, h=textH(U)+5*U;
    const x=Math.round(W/2-w/2), y=H-h-3*U;
    X.fillStyle="rgba(0,0,0,.88)"; X.fillRect(x,y,w,h);
    X.strokeStyle="#555"; X.lineWidth=1; X.strokeRect(x+.5,y+.5,w-1,h-1);
    textFit(toast,x+4*U,y+2*U,w-8*U,textH(U),WHITE,"center",1,U);
  }
  M.click=false; M.rclick=false; M.mclick=false; M.wheel=0; M.pdx=M.pdy=0;
  if(tapRelease&&!M.click){ M.down=false; M.pressUI=false; tapRelease=false; }
  if(liftAt>=0&&--liftAt<0&&!tapRelease){ M.x=-9e9; M.y=-9e9; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
